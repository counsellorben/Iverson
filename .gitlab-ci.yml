workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

stages:
  - validate
  - dependency-scan
  - build-test

.rules-deploy-changes:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Iverson.Server/deploy/**/*

# Unlike .rules-deploy-changes above, dependency-scan jobs are unfiltered by
# path — a dependency-manifest change (e.g. package.json, go.mod, pom.xml)
# would never match Iverson.Server/deploy/**/* and would silently skip
# scanning. GitLab has no periodic-schedule construct expressible purely in
# .gitlab-ci.yml (unlike GitHub Actions' `on.schedule`), so the second rule
# below is a dormant alternative trigger: it activates the moment a GitLab
# Pipeline Schedule is provisioned out-of-band (UI, API, or the
# gitlab_pipeline_schedule Terraform resource) with $CI_PIPELINE_SOURCE ==
# "schedule" — that provisioning is intentionally not part of this file.
.rules-dependency-scan:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# CSR round-11 #19: every job image is pinned as name:tag@sha256:<index digest>. The tag keeps the
# reference readable; the digest is what is pulled. A bump changes both together. Dependabot does not
# read this file, so these pins are bumped by hand.
helm-lint:
  stage: validate
  image: alpine/helm:3.15.4@sha256:105741fa6621ed9a3ea944066de78bb27d4b9bb93a56ce8e7cb4d621e1e4bbf2
  extends: .rules-deploy-changes
  script:
    - helm dependency build Iverson.Server/deploy/helm/iverson
    - |
      for values in values-local values-aws values-azure values-gcp; do
        echo "helm lint ($values.yaml)"
        extra_arg=""
        if [ -f "Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml" ]; then
          extra_arg="-f Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml"
        fi
        helm lint Iverson.Server/deploy/helm/iverson -f "Iverson.Server/deploy/helm/iverson/$values.yaml" $extra_arg
      done
    - helm lint Iverson.Server/deploy/terraform/modules/operators/charts/pvc-storageclass-policy
    - helm lint Iverson.Server/deploy/terraform/modules/operators/charts/operator-namespace-policies -f Iverson.Server/deploy/terraform/modules/operators/charts/operator-namespace-policies/values-kind.yaml

helm-template-kubeconform:
  stage: validate
  image: alpine/helm:3.15.4@sha256:105741fa6621ed9a3ea944066de78bb27d4b9bb93a56ce8e7cb4d621e1e4bbf2
  extends: .rules-deploy-changes
  before_script:
    - apk add --no-cache curl
    - curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
    - echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
    - tar xzf kubeconform.tar.gz kubeconform
    - mv kubeconform /usr/local/bin/
  script:
    - helm dependency build Iverson.Server/deploy/helm/iverson
    - |
      for values in values-local values-aws values-azure values-gcp; do
        echo "kubeconform ($values.yaml)"
        extra_arg=""
        if [ -f "Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml" ]; then
          extra_arg="-f Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml"
        fi
        helm template iverson Iverson.Server/deploy/helm/iverson -f "Iverson.Server/deploy/helm/iverson/$values.yaml" $extra_arg > rendered.yaml
        kubeconform -kubernetes-version 1.35.0 -summary -ignore-missing-schemas < rendered.yaml
      done
    # helm lint only proves the rendered YAML parses; schema validation is what catches
    # a misspelled ValidatingAdmissionPolicy field. No -ignore-missing-schemas: this
    # chart renders only core kinds, so a missing schema means something is wrong.
    - helm template pvc-storageclass-policy Iverson.Server/deploy/terraform/modules/operators/charts/pvc-storageclass-policy | kubeconform -kubernetes-version 1.35.0 -summary
    # The operator-namespace policy chart: kind's set, and the clouds' (kind=false) with the same addresses.
    # Its CNPG PeerAuthentication (CSR round 12 §4.1) is an Istio kind with no schema here: only it is skipped.
    - helm template operator-namespace-policies Iverson.Server/deploy/terraform/modules/operators/charts/operator-namespace-policies -f Iverson.Server/deploy/terraform/modules/operators/charts/operator-namespace-policies/values-kind.yaml | kubeconform -kubernetes-version 1.35.0 -summary -skip PeerAuthentication
    - helm template operator-namespace-policies Iverson.Server/deploy/terraform/modules/operators/charts/operator-namespace-policies -f Iverson.Server/deploy/terraform/modules/operators/charts/operator-namespace-policies/values-kind.yaml --set kind=false --set cnpgWebhookPermissive=true | kubeconform -kubernetes-version 1.35.0 -summary -skip PeerAuthentication

security-audit:
  stage: validate
  image: alpine/helm:3.15.4@sha256:105741fa6621ed9a3ea944066de78bb27d4b9bb93a56ce8e7cb4d621e1e4bbf2
  extends: .rules-deploy-changes
  before_script:
    - apk add --no-cache curl
    - curl -sSL -o kube-score.tar.gz https://github.com/zegl/kube-score/releases/download/v1.19.0/kube-score_1.19.0_linux_amd64.tar.gz
    - echo "a5b10e509bd845f0bc32a529f4e8165c021877f924ee6f6be66678039f75a761  kube-score.tar.gz" | sha256sum -c -
    - tar xzf kube-score.tar.gz kube-score
    - mv kube-score /usr/local/bin/
    # tfsec publishes a raw unarchived binary at tfsec-linux-amd64 with no checksum manifest
    # entry for that exact asset; the tar.gz sibling asset is the only form the project
    # publishes a SHA-256 for (tfsec_1.28.6_checksums.txt), so fetch that instead.
    - curl -sSL -o tfsec.tar.gz https://github.com/aquasecurity/tfsec/releases/download/v1.28.6/tfsec_1.28.6_linux_amd64.tar.gz
    - echo "8cbd8d64cbd1f25b38f33fa04db602466dade79e99c99dc9da053b5962d34014  tfsec.tar.gz" | sha256sum -c -
    - tar xzf tfsec.tar.gz tfsec
    - mv tfsec /usr/local/bin/tfsec
    - chmod +x /usr/local/bin/tfsec
  script:
    - helm dependency build Iverson.Server/deploy/helm/iverson
    - |
      for values in values-local values-aws values-azure values-gcp; do
        echo "kube-score ($values.yaml)"
        extra_arg=""
        if [ -f "Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml" ]; then
          extra_arg="-f Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml"
        fi
        helm template iverson Iverson.Server/deploy/helm/iverson -f "Iverson.Server/deploy/helm/iverson/$values.yaml" $extra_arg > rendered.yaml
        kube-score score \
            --ignore-test pod-networkpolicy \
            --ignore-test container-image-pull-policy \
            --ignore-test container-security-context-user-group-id \
            - < rendered.yaml   # pod-networkpolicy: NetworkPolicy coverage is asserted structurally by templates/networkpolicies.yaml, not per-manifest by kube-score's heuristic.
                                # container-image-pull-policy: repo-wide convention — every image is pinned by tag + imagePullPolicy: IfNotPresent, never Always.
                                # container-security-context-user-group-id: repo-wide convention — every hardened container runs as UID/GID 1000, which satisfies Pod Security Admission's "restricted" profile; kube-score's >=10000 preference is house style, not a real risk here.
      done
    - tfsec Iverson.Server/deploy/terraform/

terraform-validate:
  stage: validate
  image: hashicorp/terraform:1.7.5@sha256:386b7bff108f9fd3b79a2e0110190c162b5e4aebf26afe3eef028fd89532c17e
  extends: .rules-deploy-changes
  parallel:
    matrix:
      - CLOUD: [aws, azure, gcp]
  script:
    # -recursive over the whole tree rather than -chdir per cloud: fmt is not recursive
    # by default, so a per-root check reads only that root's own .tf files and never the
    # modules/ they call. Must stay ahead of init, which writes .tf into .terraform/.
    - terraform fmt -check -recursive Iverson.Server/deploy/terraform
    # -lockfile=readonly (CSR round-3 finding #13): enforce the committed
    # .terraform.lock.hcl rather than silently re-resolving providers to
    # whatever is newest at CI-run time — a floating resolution is exactly the
    # supply-chain risk pinning is meant to close. Fails loudly if a root
    # module's lockfile is missing or out of date with its version constraints,
    # which is the desired behavior: update the lockfile locally (`terraform
    # providers lock`) and commit it, don't let CI paper over the drift.
    - terraform -chdir="Iverson.Server/deploy/terraform/$CLOUD" init -backend=false -lockfile=readonly
    - terraform -chdir="Iverson.Server/deploy/terraform/$CLOUD" validate

nuget-audit:
  stage: dependency-scan
  image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317
  extends: .rules-dependency-scan
  script:
    - dotnet restore Iverson.slnx
    - dotnet list Iverson.slnx package --vulnerable --include-transitive 2>&1 | tee scan.log
    - grep -q "has the following vulnerable packages" scan.log && exit 1 || exit 0

npm-audit-adminui:
  stage: dependency-scan
  image: node:22@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
  extends: .rules-dependency-scan
  script:
    - cd Iverson.AdminUI
    - npm ci
    - npm audit --audit-level=high

npm-audit-ts-sdk:
  stage: dependency-scan
  image: node:22@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
  extends: .rules-dependency-scan
  script:
    - cd Iverson.Clients/TypeScript
    - npm ci
    - npm audit --audit-level=high

govulncheck:
  stage: dependency-scan
  # Go 1.26.9 with GOTOOLCHAIN=local, which meets go.mod's `toolchain go1.26.9` without a download
  image: golang:1.26@sha256:d7722066f0b60ceccb6c0643cbed1f5f9e15506ac237146c95333504d7805d89
  extends: .rules-dependency-scan
  script:
    - cd Iverson.Clients/Go
    - go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
    - govulncheck ./...

owasp-dependency-check-java:
  stage: dependency-scan
  image: maven:3.9-eclipse-temurin-21@sha256:99e61abcff91a9b1333463bd8451fb18495d6eba9250ac66a338b518f8278320
  # CSR round-11 #19: the only job that reads NVD_API_KEY, so it never runs in a merge-request
  # pipeline (these rules replace .rules-dependency-scan's, which also admit merge requests). Job
  # rules decide which jobs run, not which variables a pipeline receives: NVD_API_KEY must also be a
  # Protected (or pipeline-schedule) variable (docs/runbooks/csr11-clients-tooling-ci.md).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    NVD_API_KEY: $NVD_API_KEY
  script:
    - cd Iverson.Clients/Java
    - mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

pip-audit-python-sdk:
  stage: dependency-scan
  image: python:3.11@sha256:50cfccc707e8721201ee018bfd7f6a85d8eacf49c4f9f75833a2aba09a10411f
  extends: .rules-dependency-scan
  script:
    - cd Iverson.Clients/Python
    # the image's own pip 24.0 and setuptools 79.0.1 have published advisories, and the audit reads this interpreter
    - pip install pip==26.2.1 setuptools==84.1.0
    - pip install --require-hashes -r requirements.txt
    - pip install --no-deps .
    - pip check
    # pip-audit runs from its own venv and audits the interpreter that holds the lock
    - python -m venv /tmp/pip-audit && /tmp/pip-audit/bin/pip install pip-audit==2.10.1
    - PIPAPI_PYTHON_LOCATION="$(command -v python)" /tmp/pip-audit/bin/pip-audit

pip-audit-agents:
  stage: dependency-scan
  image: python:3.11@sha256:50cfccc707e8721201ee018bfd7f6a85d8eacf49c4f9f75833a2aba09a10411f
  extends: .rules-dependency-scan
  script:
    - cd Iverson.Agents/Python
    # the image's own pip 24.0 and setuptools 79.0.1 have published advisories, and the audit reads this interpreter
    - pip install pip==26.2.1 setuptools==84.1.0
    - pip install --require-hashes -r requirements.txt
    - pip install --no-deps .
    # the agent imports iverson_client by path (pyproject.toml), as the repo's own venv does
    - echo "$CI_PROJECT_DIR/Iverson.Clients/Python" > "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')/iverson_client.pth"
    - pip check
    # pip-audit runs from its own venv and audits the interpreter that holds the lock
    - python -m venv /tmp/pip-audit && /tmp/pip-audit/bin/pip install pip-audit==2.10.1
    - PIPAPI_PYTHON_LOCATION="$(command -v python)" /tmp/pip-audit/bin/pip-audit

dotnet-build-test:
  stage: build-test
  image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - dotnet build Iverson.slnx
    - dotnet test Iverson.slnx --filter "Category!=Integration"

typescript-sdk-build-test:
  stage: build-test
  image: node:22@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - cd Iverson.Clients/TypeScript
    - npm ci
    - npm test
