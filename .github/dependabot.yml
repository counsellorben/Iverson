version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # The .NET servicing packages ship together and depend on each other's exact patch, so bumping one
    # alone fails restore with NU1605 (a downgrade of its sibling). Move them as one PR.
    groups:
      dotnet-servicing:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
    # Microsoft.AspNetCore.OpenApi 10.x generates code against Microsoft.OpenApi 2.x; 3.x breaks the API
    # build (CS0200 on IOpenApiMediaType.Example, #179). Its major moves with the next ASP.NET Core major.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/Iverson.AdminUI"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/Iverson.Clients/TypeScript"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/Iverson.Clients/Go"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/Iverson.Clients/Java"
    schedule:
      interval: "weekly"
    # CSR round 12 §2.1: version updates wait a week after a release (security updates are not delayed).
    # Each Maven PR needs the trusted-checksum re-record before it goes green (docs/runbooks/csr12-supply-chain.md).
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/Iverson.Clients/Python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/Iverson.Agents/Python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/Iverson.AdminUI"
      - "/Iverson.Server/Iverson.Api"
      - "/Iverson.Server/Iverson.Events"
      - "/Iverson.Server/Iverson.Sql"
      - "/Iverson.Server/Iverson.Vector"
      - "/Iverson.Server/deploy/helm/iverson/charts/tei/model-image"
      - "/Iverson.Server/deploy/helm/iverson/charts/ollama/model-image"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/Iverson.Server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directories:
      - "/Iverson.Server/deploy/terraform/aws"
      - "/Iverson.Server/deploy/terraform/azure"
      - "/Iverson.Server/deploy/terraform/gcp"
      - "/Iverson.Server/deploy/terraform/bootstrap/aws"
      - "/Iverson.Server/deploy/terraform/bootstrap/azure"
      - "/Iverson.Server/deploy/terraform/bootstrap/gcp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "helm"
    directories:
      - "/Iverson.Server/deploy/helm/iverson"
      - "/Iverson.Server/deploy/helm/iverson/charts/*"
      - "/Iverson.Server/deploy/terraform/modules/operators/versions"
    schedule:
      interval: "weekly"
    # These two move in lockstep with other files (see the coupling notes in the stub's Chart.yaml): minor/major bumps are done by hand.
    ignore:
      - dependency-name: "cluster-autoscaler"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "aws-load-balancer-controller"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
