version: 2
# CSR round 12 §4.1 (amended 2026-10-27, docs/specs/2026-10-27-csr-round12-dependabot-helm-registries-design.md):
# an update job reaches only allowlisted hosts, and declaring a registry allowlists its host (some hosts,
# docs.tigera.io and kubernetes-sigs.github.io among them, are reachable without one). GitHub rejects a
# helm-registry without credentials, so each carries a dummy username and password; these chart repositories
# are public and ignore them. cloudnative-pg.github.io redirects to cloudnative-pg.io, which needs its own entry.
# docs.tigera.io refuses basic auth, so it has no entry; the kind job reaches it undeclared.
registries:
  cloudnative-pg:
    type: helm-registry
    url: https://cloudnative-pg.github.io/charts
    username: x
    password: x
  cloudnative-pg-io:
    type: helm-registry
    url: https://cloudnative-pg.io/charts
    username: x
    password: x
  strimzi:
    type: helm-registry
    url: https://strimzi.io/charts/
    username: x
    password: x
  starrocks:
    type: helm-registry
    url: https://starrocks.github.io/starrocks-kubernetes-operator
    username: x
    password: x
  autoscaler:
    type: helm-registry
    url: https://kubernetes.github.io/autoscaler
    username: x
    password: x
  eks-charts:
    type: helm-registry
    url: https://aws.github.io/eks-charts
    username: x
    password: x
  sigstore:
    type: helm-registry
    url: https://sigstore.github.io/helm-charts
    username: x
    password: x
  metrics-server:
    type: helm-registry
    url: https://kubernetes-sigs.github.io/metrics-server/
    username: x
    password: x
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # The .NET servicing packages ship together and depend on each other's exact patch, so bumping one
    # alone fails restore with NU1605 (a downgrade of its sibling). Move them as one PR.
    groups:
      dotnet-servicing:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
    # Microsoft.AspNetCore.OpenApi 10.x generates code against Microsoft.OpenApi 2.x; 3.x breaks the API
    # build (CS0200 on IOpenApiMediaType.Example, #179). Its major moves with the next ASP.NET Core major.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/Iverson.AdminUI"
    schedule:
      interval: "weekly"
    # The @opentelemetry packages pin each other through peer dependencies, so one bumped alone fails
    # `npm ci` with ERESOLVE. Move them as one PR.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
  - package-ecosystem: "npm"
    directory: "/Iverson.Clients/TypeScript"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/Iverson.Clients/Go"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/Iverson.Clients/Java"
    schedule:
      interval: "weekly"
    # CSR round 12 §2.1: version updates wait a week after a release (security updates are not delayed).
    # Each Maven PR needs the trusted-checksum re-record before it goes green (docs/runbooks/csr12-supply-chain.md).
    cooldown:
      default-days: 7
    # CSR round 12 decision 6 pins one Maven line (3.9) through the wrapper; a minor or major move needs a new
    # distributionSha256Sum and a checksum re-record, done by hand. 3.9 patches still arrive.
    ignore:
      - dependency-name: "org.apache.maven:apache-maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "pip"
    directory: "/Iverson.Clients/Python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/Iverson.Agents/Python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/Iverson.AdminUI"
      - "/Iverson.Server/Iverson.Api"
      - "/Iverson.Server/Iverson.Events"
      - "/Iverson.Server/Iverson.Sql"
      - "/Iverson.Server/Iverson.Vector"
      - "/Iverson.Server/deploy/helm/iverson/charts/tei/model-image"
      - "/Iverson.Server/deploy/helm/iverson/charts/ollama/model-image"
    schedule:
      interval: "weekly"
  # CSR round 12 §4.3: the GitLab job images (never built; see the file), in their own entry so these ignores
  # stay off the application images. Tool upgrades (helm 4, terraform past 1.7, node and JDK majors) are
  # deliberate changes across .gitlab-ci.yml and the workflows (ci/pins.yaml); same-tag digest refreshes still
  # arrive. The maven tag's JDK suffix (temurin-21 -> -26) is not a semver step, so it needs all three types.
  - package-ecosystem: "docker"
    directory: "/ci/gitlab-images"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "alpine/helm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/terraform"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: "docker-compose"
    directory: "/Iverson.Server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directories:
      - "/Iverson.Server/deploy/terraform/aws"
      - "/Iverson.Server/deploy/terraform/azure"
      - "/Iverson.Server/deploy/terraform/gcp"
      - "/Iverson.Server/deploy/terraform/bootstrap/aws"
      - "/Iverson.Server/deploy/terraform/bootstrap/azure"
      - "/Iverson.Server/deploy/terraform/bootstrap/gcp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "helm"
    directories:
      - "/Iverson.Server/deploy/helm/iverson"
      - "/Iverson.Server/deploy/helm/iverson/charts/*"
    registries: "*"
    schedule:
      interval: "weekly"
    # CSR round 12 §4.1: the umbrella's own images (built locally, not on Docker Hub) and the kubectl image
    # (looked up at a wrong path); ci/pins.yaml tracks kubectl instead.
    ignore:
      - dependency-name: "iverson-api"
      - dependency-name: "iverson-admin-ui"
      - dependency-name: "registry.k8s.io/kubectl"
  # The operator charts the cloud Terraform installs (CSR round 12 §4.1: its own entry, with the registries).
  - package-ecosystem: "helm"
    directory: "/Iverson.Server/deploy/terraform/modules/operators/versions"
    registries: "*"
    schedule:
      interval: "weekly"
    # These two move in lockstep with other files (see the coupling notes in the stub's Chart.yaml): minor/major bumps are done by hand.
    ignore:
      - dependency-name: "cluster-autoscaler"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "aws-load-balancer-controller"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  # CSR round 12 §4.2: the charts only kind installs.
  - package-ecosystem: "helm"
    directory: "/Iverson.Server/deploy/kind/versions"
    registries: "*"
    schedule:
      interval: "weekly"
