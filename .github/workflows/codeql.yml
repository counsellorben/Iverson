name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 3 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: autobuild
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CSR round-11 #19: no later step pushes or fetches, so the job token is not left in .git/config.
          persist-credentials: false

      # csharp/java-kotlin run with build-mode: autobuild (see the sibling
      # /language:csharp and /language:java-kotlin default-setup analyses,
      # which run build-mode: none and log call-target/known-type resolution
      # well below CodeQL's 85% quality threshold -- pinning the actual SDK
      # versions here so autobuild compiles for real instead of falling back
      # to source-only extraction).
      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # autobuild can't find this: the reactor pom.xml lives under
      # Iverson.Clients/Java/, not the repo root, so autodetection gives up
      # before descending into it.
      - name: Build Java client (manual build mode)
        if: matrix.language == 'java-kotlin'
        # CSR round 12 §4.7: through the repository's Maven Wrapper, the one Maven the trusted-checksum
        # record was written under.
        run: Iverson.Clients/Java/mvnw -B -f Iverson.Clients/Java/pom.xml -DskipTests clean install

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
