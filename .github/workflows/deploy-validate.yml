name: Deploy Validate

# CSR round-11 #19: every pull request and every push to main, with no paths filter. Branch
# protection requires these checks, and a required check whose workflow a paths filter skips never
# reports, which leaves the pull request blocked.
on:
  pull_request: {}
  push:
    branches: [main]

# Least-privilege default: every job here only checks out the repo and runs
# read-only linters/validators (helm lint, kubeconform, kube-score, tfsec,
# terraform validate) against it -- none need to write anywhere.
permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.0

      - name: helm dependency build
        run: helm dependency build Iverson.Server/deploy/helm/iverson

      - name: helm lint against all 5 values overlays
        run: |
          set -e
          for values in values-local values-laptop values-aws values-azure values-gcp; do
            echo "::group::helm lint ($values.yaml)"
            extra_arg=""
            if [ -f "Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml" ]; then
              extra_arg="-f Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml"
            fi
            helm lint Iverson.Server/deploy/helm/iverson -f "Iverson.Server/deploy/helm/iverson/$values.yaml" $extra_arg
            echo "::endgroup::"
          done

      - name: helm lint the PVC StorageClass admission-policy chart
        run: helm lint Iverson.Server/deploy/terraform/modules/operators/charts/pvc-storageclass-policy

      - name: helm lint the operator-namespace policy chart
        run: |
          C=Iverson.Server/deploy/terraform/modules/operators/charts/operator-namespace-policies
          helm lint "$C" -f "$C/values-kind.yaml"

      # CSR round 12 §3: the clouds' ClusterImagePolicies. kubeconform has no schema for their CRD, so the
      # lint (which renders them) is the CI check; the live check is docs/runbooks/csr12-supply-chain.md's.
      - name: helm lint the image-policies chart
        run: helm lint Iverson.Server/deploy/terraform/modules/operators/charts/image-policies

      # CSR round 12 §3: the publish workflow, the runbook's verification commands and the clusters'
      # admission policies must trust the same signing identity.
      - name: The publish identity is the same in the workflow, the runbook and the image policies
        run: |
          set -euo pipefail
          wf=$(sed -n "s/^ *IDENTITY: '\(.*\)'$/\1/p" .github/workflows/publish-images.yml)
          ip=$(sed -n "s/^ *subjectRegExp: '\(.*\)'$/\1/p" Iverson.Server/deploy/terraform/modules/operators/charts/image-policies/values.yaml)
          rb=$(sed -n "s/.*--certificate-identity-regexp '\([^']*\)'.*/\1/p" docs/runbooks/csr11-clients-tooling-ci.md | sort -u)
          echo "workflow:      $wf"
          echo "image-policies: $ip"
          echo "runbook:       $rb"
          [ -n "$wf" ] && [ "$ip" = "$wf" ] && [ "$rb" = "$wf" ] || { echo "::error::the three identities differ"; exit 1; }

  helm-template-kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.0

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: helm dependency build
        run: helm dependency build Iverson.Server/deploy/helm/iverson

      - name: helm template | kubeconform against all 5 values overlays
        run: |
          set -e
          for values in values-local values-laptop values-aws values-azure values-gcp; do
            echo "::group::kubeconform ($values.yaml)"
            extra_arg=""
            if [ -f "Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml" ]; then
              extra_arg="-f Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml"
            fi
            helm template iverson Iverson.Server/deploy/helm/iverson -f "Iverson.Server/deploy/helm/iverson/$values.yaml" $extra_arg > rendered.yaml
            kubeconform -kubernetes-version 1.35.0 -summary -ignore-missing-schemas < rendered.yaml
            echo "::endgroup::"
          done

      # helm lint only proves the rendered YAML parses. Schema validation is what
      # catches a misspelled ValidatingAdmissionPolicy field, which lint cannot see.
      # No -ignore-missing-schemas here: this chart renders only core Kubernetes
      # kinds, so a missing schema means something is wrong and should fail.
      - name: helm template | kubeconform the PVC StorageClass admission-policy chart
        run: |
          helm template pvc-storageclass-policy \
            Iverson.Server/deploy/terraform/modules/operators/charts/pvc-storageclass-policy \
            | kubeconform -kubernetes-version 1.35.0 -summary

      # The operator-namespace policy chart renders NetworkPolicies, kind's set and the clouds' (kind=false,
      # with cosign-system) with the same addresses, and the CNPG operator's PeerAuthentication (CSR round 12 §4.1), an Istio
      # kind kubeconform has no schema for: that kind alone is skipped, so a missing schema for anything
      # else still fails.
      - name: helm template | kubeconform the operator-namespace policy chart
        run: |
          set -e
          C=Iverson.Server/deploy/terraform/modules/operators/charts/operator-namespace-policies
          helm template operator-namespace-policies "$C" -f "$C/values-kind.yaml" | kubeconform -kubernetes-version 1.35.0 -summary -skip PeerAuthentication
          helm template operator-namespace-policies "$C" -f "$C/values-kind.yaml" --set kind=false --set cnpgWebhookPermissive=true --set cosignSystem=true | kubeconform -kubernetes-version 1.35.0 -summary -skip PeerAuthentication

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.0

      - name: Install kube-score
        run: |
          curl -sSL -o kube-score.tar.gz https://github.com/zegl/kube-score/releases/download/v1.19.0/kube-score_1.19.0_linux_amd64.tar.gz
          echo "a5b10e509bd845f0bc32a529f4e8165c021877f924ee6f6be66678039f75a761  kube-score.tar.gz" | sha256sum -c -
          tar xzf kube-score.tar.gz kube-score
          sudo mv kube-score /usr/local/bin/

      - name: helm dependency build
        run: helm dependency build Iverson.Server/deploy/helm/iverson

      - name: kube-score against all 5 values overlays
        run: |
          set -e
          for values in values-local values-laptop values-aws values-azure values-gcp; do
            echo "::group::kube-score ($values.yaml)"
            extra_arg=""
            if [ -f "Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml" ]; then
              extra_arg="-f Iverson.Server/deploy/helm/iverson/$values.ci-override.yaml"
            fi
            helm template iverson Iverson.Server/deploy/helm/iverson -f "Iverson.Server/deploy/helm/iverson/$values.yaml" $extra_arg > rendered.yaml
            kube-score score \
                --ignore-test pod-networkpolicy \
                --ignore-test container-image-pull-policy \
                --ignore-test container-security-context-user-group-id \
                - < rendered.yaml   # pod-networkpolicy: NetworkPolicy coverage is asserted structurally by templates/networkpolicies.yaml, not per-manifest by kube-score's heuristic.
                                    # container-image-pull-policy: repo-wide convention — every image is pinned by tag + imagePullPolicy: IfNotPresent, never Always.
                                    # container-security-context-user-group-id: repo-wide convention — every hardened container runs as UID/GID 1000, which satisfies Pod Security Admission's "restricted" profile; kube-score's >=10000 preference is house style, not a real risk here.
            echo "::endgroup::"
          done

      - name: Install tfsec
        # tfsec publishes a raw unarchived binary at tfsec-linux-amd64 with no checksum
        # manifest entry for that exact asset; the tar.gz sibling asset is the only form
        # the project publishes a SHA-256 for (tfsec_1.28.6_checksums.txt), so fetch
        # that instead.
        run: |
          curl -sSL -o tfsec.tar.gz https://github.com/aquasecurity/tfsec/releases/download/v1.28.6/tfsec_1.28.6_linux_amd64.tar.gz
          echo "8cbd8d64cbd1f25b38f33fa04db602466dade79e99c99dc9da053b5962d34014  tfsec.tar.gz" | sha256sum -c -
          tar xzf tfsec.tar.gz tfsec
          chmod +x tfsec && sudo mv tfsec /usr/local/bin/

      - name: tfsec against all 3 cloud Terraform modules
        run: tfsec Iverson.Server/deploy/terraform/

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aws, azure, gcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.7.5"

      # -recursive over the whole tree rather than -chdir per cloud: fmt is not
      # recursive by default, so a per-root check reads only that root's own .tf
      # files and never the modules/ they call, where most edits land. Must stay
      # ahead of the init step below, which writes vendored .tf into .terraform/.
      - name: terraform fmt -check
        run: terraform fmt -check -recursive Iverson.Server/deploy/terraform

      # -lockfile=readonly (CSR round-3 finding #13): enforce the committed
      # .terraform.lock.hcl rather than silently re-resolving providers to
      # whatever is newest at CI-run time — a floating resolution is exactly
      # the supply-chain risk pinning is meant to close. Fails loudly if a
      # root module's lockfile is missing or out of date with its version
      # constraints: update it locally (`terraform providers lock`) and
      # commit it, don't let CI paper over the drift.
      - name: terraform init (no backend, enforce committed lockfile)
        run: terraform -chdir=Iverson.Server/deploy/terraform/${{ matrix.cloud }} init -backend=false -lockfile=readonly

      - name: terraform validate
        run: terraform -chdir=Iverson.Server/deploy/terraform/${{ matrix.cloud }} validate
