name: Image Scan

# CSR round-10 #19. First-party images fail on fixable HIGH/CRITICAL findings; the third-party
# images the chart deploys are scanned and reported only, since a fix there means a version bump.
# trivy-action is pinned by commit SHA above the 2026-03 compromise's affected range
# (GHSA-69fq-xp46-6x23); the trivy version is pinned too.

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 0'

permissions:
  contents: read

jobs:
  first-party:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: iverson-api, dockerfile: Iverson.Server/Iverson.Api/Dockerfile }
          - { name: iverson-admin-ui, dockerfile: Iverson.AdminUI/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.name }}:scan .
      - name: Scan ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:scan
          version: v0.75.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  third-party:
    runs-on: ubuntu-latest
    env:
      # "true" only when both secrets exist; the step conditions below cannot read secrets directly.
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: List the chart's third-party images
        run: |
          set -eo pipefail
          C=Iverson.Server/deploy/helm/iverson
          helm dependency build "$C"
          # The CNPG and Strimzi operators are installed by Terraform; read their chart pins from
          # there, so this list follows a version bump without a second edit.
          TF=Iverson.Server/deploy/terraform/modules/operators/main.tf
          tf_pin() {   # $1 = chart name, $2 = attribute (repository or version)
            awk -v chart="$1" -v attr="$2" '
              /^(resource|data|module|locals|variable|output) / { delete a }
              /^ *[a-z_]+ *= *"/ { k = $1; v = $0; sub(/^[^"]*"/, "", v); sub(/".*$/, "", v); a[k] = v }
              /^}/ { if (a["chart"] == chart) { print a[attr]; exit } }' "$TF"
          }
          render_operator() {   # $1 = chart name; prints the rendered manifests
            local repo version
            repo=$(tf_pin "$1" repository); version=$(tf_pin "$1" version)
            [ -n "$repo" ] && [ -n "$version" ] || { echo "no $1 pin in $TF" >&2; return 1; }
            helm template op "$1" --repo "$repo" --version "$version"
          }
          {
            for v in values-aws values-azure values-gcp; do
              helm template iverson "$C" -f "$C/$v.yaml" -f "$C/$v.ci-override.yaml"
            done | sed -n 's/^ *image: "\{0,1\}\([^" ]*\)"\{0,1\}$/\1/p' \
                 | grep -v -E '(^|/)iverson-'
            # The model images' base references (fully qualified and digest-pinned).
            sed -n 's/^FROM \([^ ]*\)\( AS .*\)\{0,1\}$/\1/p' "$C"/charts/*/model-image/Dockerfile

            # CNPG: the operator image (it also runs as an init container in every PostgreSQL pod)
            # and, because the chart's Cluster sets no imageName, the operator's built-in default
            # PostgreSQL image. That default is compiled into the operator, not rendered by its
            # chart, so read it from the operator source at the chart's app version.
            cnpg=$(render_operator cloudnative-pg)
            cnpg_image=$(printf '%s\n' "$cnpg" | sed -n 's/^ *image: "\{0,1\}\([^" ]*\)"\{0,1\}$/\1/p' | head -1)
            cnpg_version=${cnpg_image##*:}
            test -n "$cnpg_version"
            echo "$cnpg_image"
            curl -fsSL "https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v$cnpg_version/pkg/versions/versions.go" \
              | sed -n 's/^[[:space:]]*DefaultImageName = "\([^"]*\)"$/\1/p' | grep .

            # Strimzi: the operator image (it also runs the entity operator the Kafka CR enables) and
            # the Kafka image for the version the chart's Kafka CR pins.
            strimzi=$(render_operator strimzi-kafka-operator)
            printf '%s\n' "$strimzi" | sed -n 's/^ *image: "\{0,1\}\([^" ]*\)"\{0,1\}$/\1/p'
            kafka_version=$(sed -n 's/^ *version: \([0-9][0-9.]*\)$/\1/p' "$C/charts/kafka/templates/kafka.yaml" | head -1)
            test -n "$kafka_version"
            printf '%s\n' "$strimzi" | awk -v v="$kafka_version" '
              /- name: STRIMZI_KAFKA_IMAGES$/ { on = 1; next }
              on && /- name:/ { exit }
              on { split($1, kv, "="); if (kv[1] == v) print kv[2] }' | grep .
          } | sort -u > images.txt
          test -s images.txt
          cat images.txt
      # Optional: authenticated Docker Hub pulls avoid its anonymous rate limit. Runs only when the
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are both set.
      - name: Log in to Docker Hub
        if: env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Scan (report only)
        run: |
          set -e
          # After a login, hand trivy the runner's docker config read-only: it holds a per-registry
          # credential, so trivy presents it to Docker Hub and nowhere else.
          creds=()
          if [ "$HAVE_DOCKERHUB" = true ]; then
            creds=(-v "$HOME/.docker/config.json:/docker-config/config.json:ro" -e DOCKER_CONFIG=/docker-config)
          fi
          for img in $(cat images.txt); do
            echo "::group::$img"
            docker run --rm "${creds[@]}" docker.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress "$img"
            echo "::endgroup::"
          done
