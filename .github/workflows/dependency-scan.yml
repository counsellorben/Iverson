name: Dependency Scan

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 0'

permissions:
  contents: read

jobs:
  nuget-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Iverson.slnx
      - run: dotnet list Iverson.slnx package --vulnerable --include-transitive 2>&1 | tee scan.log
      - run: grep -q "has the following vulnerable packages" scan.log && exit 1 || exit 0

  npm-audit-adminui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Iverson.AdminUI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=high

  npm-audit-ts-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Iverson.Clients/TypeScript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=high

  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Iverson.Clients/Go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  owasp-dependency-check-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Iverson.Clients/Java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"
      - run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  pip-audit-python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Iverson.Clients/Python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install .[dev] pip-audit
      - run: pip-audit

  pip-audit-agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Iverson.Agents/Python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install .[dev] pip-audit
      - run: pip-audit
