name: Publish Images

# CSR round-11 #19. Publishes the first-party images to GHCR, signs each published digest keyless
# with cosign (GitHub OIDC; the signature is recorded in the public Rekor log) and attaches a signed
# SPDX-JSON SBOM attestation. iverson-api and iverson-admin-ui publish on every run, tagged with the
# commit SHA on main and X.Y.Z on a vX.Y.Z tag, never "latest". The model images publish only on tags
# and manual runs, under the content-derived tags the chart references. A published tag never moves:
# a run whose tag already exists rebuilds nothing; it accepts the tag only if this workflow already
# signed and attested the digest it names, and fails otherwise. Signing runs in its own job, the
# only one holding an OIDC token.
# Verifying a published image: docs/runbooks/csr11-clients-tooling-ci.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  images:
    # The publish and sign jobs' matrix: one entry per image this run publishes.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.list.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.0
      - name: List the images
        id: list
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          case "$GITHUB_REF" in
            refs/heads/main) tag=$GITHUB_SHA ;;
            refs/tags/v*)
              tag=${GITHUB_REF#refs/tags/v}
              [[ $tag =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "tag ${GITHUB_REF#refs/tags/} is not vX.Y.Z" ;;
            *) fail "images publish from main or a vX.Y.Z tag, not $GITHUB_REF" ;;
          esac
          reg=ghcr.io/counsellorben
          row() {   # name image tag context dockerfile [build-arg ...]: one matrix entry as JSON
            python3 -c 'import json, sys; n, i, t, c, f, *a = sys.argv[1:]; print(json.dumps({"name": n, "image": i, "tag": t, "context": c, "dockerfile": f, "build_args": "\n".join(a)}))' "$@"
          }
          rows="$RUNNER_TEMP/images.jsonl"
          {
            row iverson-api "$reg/iverson-api" "$tag" . Iverson.Server/Iverson.Api/Dockerfile
            row iverson-admin-ui "$reg/iverson-admin-ui" "$tag" . Iverson.AdminUI/Dockerfile
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [[ $GITHUB_REF == refs/tags/v* ]]; then
              # The model images' references and build args come from the chart render, as
              # deploy/kind/build-and-load-image.sh reads them, so each pushed tag is the
              # content-derived tag the chart pulls. The AWS profile sets global.modelImageRegistry
              # to this registry; its CI override only fills in ingress placeholders the render
              # requires. Every profile renders the same model tags.
              C=Iverson.Server/deploy/helm/iverson
              helm dependency build "$C" >/dev/null
              render=$(helm template iverson "$C" -f "$C/values-aws.yaml" -f "$C/values-aws.ci-override.yaml")
              tei=$(printf '%s\n' "$render" | awk '
                /image: "[^"]*iverson-tei-model:/ { match($0, /"[^"]+"/); img = substr($0, RSTART+1, RLENGTH-2) }
                /args: \["--model-id"/ { split($0, a, "\""); print img "|" a[4] "|" a[8] }')
              [ -n "$tei" ] || fail "the chart renders no iverson-tei-model image"
              while IFS='|' read -r image model_id revision; do
                [[ $image == "$reg"/* ]] || fail "the chart's model image $image is not under $reg/"
                row iverson-tei-model "${image%:*}" "${image##*:}" "$C/charts/tei/model-image" "$C/charts/tei/model-image/Dockerfile" \
                  "MODEL_ID=$model_id" "REVISION=$revision"
              done <<< "$tei"
              image=$(printf '%s\n' "$render" | sed -n 's/.*image: "\([^"]*iverson-ollama-model:[^"]*\)".*/\1/p' | head -1)
              model=$(printf '%s\n' "$render" | sed -n 's/.*iverson.io\/model: "\(.*\)"/\1/p' | head -1)
              digest=$(printf '%s\n' "$render" | sed -n 's/.*iverson.io\/model-digest: "\(.*\)"/\1/p' | head -1)
              if [ -z "$image" ] || [ -z "$model" ] || [ -z "$digest" ]; then fail "the chart renders no iverson-ollama-model image"; fi
              [[ $image == "$reg"/* ]] || fail "the chart's model image $image is not under $reg/"
              row iverson-ollama-model "${image%:*}" "${image##*:}" "$C/charts/ollama/model-image" "$C/charts/ollama/model-image/Dockerfile" \
                "MODEL=$model" "DIGEST=$digest"
            fi
          } > "$rows"
          cat "$rows"
          echo "include=$(python3 -c 'import json, sys; print(json.dumps([json.loads(l) for l in sys.stdin]))' < "$rows")" >> "$GITHUB_OUTPUT"

  publish:
    # Builds and pushes each image and generates its SBOM, or, when the tag already exists, checks
    # that this workflow signed and attested the digest it names. No OIDC token here: the sign job
    # alone can mint one.
    name: publish (${{ matrix.name }})
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Runs that would push the same tag (a v tag and a manual run, two tags on one commit) do not
    # race here. GitHub keeps one running and one pending job per group; a third run for the same
    # tag cancels the pending one, which is harmless because the running job publishes that tag.
    concurrency:
      group: publish-${{ matrix.image }}:${{ matrix.tag }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check whether the tag is published
        id: published
        env:
          REF: ${{ matrix.image }}:${{ matrix.tag }}
        run: |
          set -euo pipefail
          # A published tag never moves. Only the registry's "not found" or "denied" answers count
          # as unpublished; any other failure (network, server error, malformed output) stops the
          # run rather than rebuild over a tag that may exist.
          err="$RUNNER_TEMP/inspect.err"
          state=
          for try in 1 2 3; do
            if manifest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' 2>"$err"); then
              state=found; break
            elif grep -Fq -- "$REF: not found" "$err" ||
                 grep -Eq 'manifest unknown|name unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$err"; then
              state=absent; break
            # GHCR may answer a lookup in a package that does not exist yet with denied/unauthorized;
            # after retries it counts as absent, since a real permission problem still fails at the push.
            elif grep -Eq 'denied:|unauthorized:|401 Unauthorized|403 Forbidden' "$err"; then
              state=denied
              if [ "$try" -lt 3 ]; then sleep 5; fi
            else
              cat "$err" >&2
              echo "::error::could not tell whether $REF is published"
              exit 1
            fi
          done
          case $state in
            found)
              digest=$(printf '%s' "$manifest" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("digest", ""))')
              [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$REF names no sha256 digest"; exit 1; }
              echo "$REF already exists at $digest; checking that this workflow signed and attested it"
              echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            absent) echo "$REF is not published yet; building it" ;;
            denied)
              cat "$err" >&2
              echo "$REF is not visible to this run (the registry denied the lookup $try times); treating it as not published and building it" ;;
          esac
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.published.outputs.digest != ''
        with:
          # The installer's own bootstrap release, which it checks against a SHA-256 in the pinned
          # action.
          cosign-release: v3.0.6
      - name: Verify the existing tag
        if: steps.published.outputs.digest != ''
        env:
          TAG_REF: ${{ matrix.image }}:${{ matrix.tag }}
          REF: ${{ matrix.image }}@${{ steps.published.outputs.digest }}
          DIGEST: ${{ steps.published.outputs.digest }}
          # The same identity and issuer as the verification commands in
          # docs/runbooks/csr11-clients-tooling-ci.md section 2; change both together.
          IDENTITY: '^https://github\.com/counsellorben/Iverson/\.github/workflows/publish-images\.yml@refs/(heads/main|tags/v.+)$'
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          # An existing tag is accepted only if this workflow already signed and attested its
          # digest; this run never signs a digest it did not build.
          if cosign verify --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$REF" >/dev/null &&
             cosign verify-attestation --type spdxjson --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$REF" >/dev/null; then
            echo "::notice::$TAG_REF is already published at $DIGEST, signed and attested by this workflow; nothing to do"
            mkdir -p "$RUNNER_TEMP/publish"
            printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/publish/verified"
          else
            echo "::error::$TAG_REF exists at $DIGEST but is not signed and attested by this workflow, so it was not published by it or an earlier run stopped before signing. Inspect that digest and delete the tag, then re-run."
            exit 1
          fi
      - name: Build and push
        id: build
        if: steps.published.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          tags: ${{ matrix.image }}:${{ matrix.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
      - name: Record the digest
        id: digest
        if: steps.published.outputs.digest == ''
        env:
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ $BUILT =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build reported no sha256 digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/publish"
          printf '%s\n' "$BUILT" > "$RUNNER_TEMP/publish/digest"
          echo "digest=$BUILT" >> "$GITHUB_OUTPUT"
      - name: SBOM
        if: steps.published.outputs.digest == ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}@${{ steps.digest.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ runner.temp }}/publish/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # The sign job's input: digest and sbom.spdx.json for a build, or only a "verified" marker
      # (the existing digest) for an accepted existing tag, which the sign job skips.
      - name: Hand the result to the sign job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ matrix.name }}-${{ matrix.tag }}
          path: ${{ runner.temp }}/publish/
          if-no-files-found: error
          # A re-run replaces the earlier attempt's copy.
          overwrite: true
          retention-days: 1

  sign:
    # Signs each digest this run built keyless and attests its SBOM. The only job with an OIDC
    # token. It runs for every entry even when another entry's publish job failed. An entry needs
    # its publish artifact from this run: artifacts persist across re-run attempts but expire after
    # retention-days (1), so re-running only a failed sign job after that needs a full re-run.
    name: sign (${{ matrix.name }})
    needs: [images, publish]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.include) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-${{ matrix.name }}-${{ matrix.tag }}
          path: ${{ runner.temp }}/publish
      - name: Read the digest
        id: digest
        env:
          DIR: ${{ runner.temp }}/publish
        run: |
          set -euo pipefail
          sha='^sha256:[0-9a-f]{64}$'
          if [ -e "$DIR/verified" ]; then
            [ ! -e "$DIR/digest" ] || { echo "::error::the publish job both built and accepted this image"; exit 1; }
            digest=$(< "$DIR/verified")
            [[ $digest =~ $sha ]] || { echo "::error::the publish job's digest is not a sha256 digest"; exit 1; }
            echo "::notice::$digest was already signed and attested by this workflow; nothing to sign"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest=$(< "$DIR/digest")
          [[ $digest =~ $sha ]] || { echo "::error::the publish job's digest is not a sha256 digest"; exit 1; }
          [ -s "$DIR/sbom.spdx.json" ] || { echo "::error::the publish job's SBOM is missing"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: steps.digest.outputs.skip == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.digest.outputs.skip == 'false'
      - name: Check the tag still names the built digest
        if: steps.digest.outputs.skip == 'false'
        env:
          TAG_REF: ${{ matrix.image }}:${{ matrix.tag }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "$TAG_REF" --format '{{json .Manifest}}') ||
            { echo "::error::could not resolve $TAG_REF; not signing"; exit 1; }
          current=$(printf '%s' "$manifest" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("digest", ""))')
          [ "$current" = "$DIGEST" ] ||
            { echo "::error::$TAG_REF now names ${current:-no digest}, not the $DIGEST this run built; not signing"; exit 1; }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.digest.outputs.skip == 'false'
        with:
          # The installer's own bootstrap release, which it checks against a SHA-256 in the pinned
          # action.
          cosign-release: v3.0.6
      - name: Sign
        if: steps.digest.outputs.skip == 'false'
        env:
          REF: ${{ matrix.image }}@${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Attest the SBOM
        if: steps.digest.outputs.skip == 'false'
        env:
          REF: ${{ matrix.image }}@${{ steps.digest.outputs.digest }}
          SBOM: ${{ runner.temp }}/publish/sbom.spdx.json
        run: cosign attest --yes --type spdxjson --predicate "$SBOM" "$REF"
