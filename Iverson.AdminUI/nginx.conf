# Drop-in replacement for nginxinc/nginx-unprivileged's stock
# /etc/nginx/conf.d/default.conf. The base image's default config serves
# files literally with no fallback, so any client-side React Router route
# with no matching file on disk (e.g. /callback, /performance, /storage) 404s
# instead of loading index.html and letting the SPA's router take over. This
# breaks the OIDC login flow specifically: Authentik's post-login redirect
# lands the browser on /callback (a client-side-only route, not a real
# file), which 404s without this fallback, so CallbackPage never mounts and
# login never completes.
#
# The OIDC_ORIGIN and HSTS_LINE tokens below are placeholders substituted at
# container start by /docker-entrypoint.d/40-admin-ui-config.sh through a
# restricted-form envsubst (only those two names, plus EXTERNAL_SCHEME which
# this file does not otherwise reference, never a bare envsubst) — see that
# script for why a bare envsubst would corrupt the try_files line below. The
# HSTS_LINE token is substituted the same way to either the
# Strict-Transport-Security header line (when EXTERNAL_SCHEME is https) or
# an empty string (when EXTERNAL_SCHEME is http): HSTS must never be
# advertised over a plain-http origin, since it forces the browser to
# upgrade future requests to https on that host.
#
# (Deliberately not written as literal ${VAR} tokens in this comment: doing
# so would make envsubst rewrite this prose too, since it substitutes every
# occurrence in the file, comments included.)
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ${OIDC_ORIGIN}; frame-ancestors 'none'" always;
    ${HSTS_LINE}

    location / {
        try_files $uri $uri/ /index.html;
    }
}
