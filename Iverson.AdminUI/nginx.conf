# Drop-in replacement for nginxinc/nginx-unprivileged's stock
# /etc/nginx/conf.d/default.conf. The base image's default config serves
# files literally with no fallback, so any client-side React Router route
# with no matching file on disk (e.g. /callback, /performance, /storage) 404s
# instead of loading index.html and letting the SPA's router take over. This
# breaks the OIDC login flow specifically: Authentik's post-login redirect
# lands the browser on /callback (a client-side-only route, not a real
# file), which 404s without this fallback, so CallbackPage never mounts and
# login never completes.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rendered at container start by /docker-entrypoint.d/40-admin-ui-config.sh, which
    # is what makes a per-environment CSP possible at all: this file is copied into the
    # image at BUILD time, while the two origins connect-src has to name (admin-api and
    # Authentik) are only known once the container has its environment. A connect-src
    # written here would carry an unresolved placeholder — and one that omits the
    # Authentik origin blocks the OIDC discovery fetch and the token exchange, so login
    # could never complete.
    #
    # The include is unconditional on purpose: nginx refuses to start if the file is
    # missing, so a startup where the entrypoint did not run cannot quietly serve the
    # console with no CSP.
    include /etc/nginx/conf.d/admin-ui-security-headers.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
