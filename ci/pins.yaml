    - file: .github/workflows/dependency-scan.yml
      regex: 'org\.owasp:dependency-check-maven:([0-9.]+):update-only'
    - file: .gitlab-ci.yml
      regex: 'org\.owasp:dependency-check-maven:([0-9.]+):update-only'

