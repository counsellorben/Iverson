# ────────────────────────────────────────────────────────────────────────────
# SECURITY NOTE: LOCAL-ONLY DEVELOPMENT
# ────────────────────────────────────────────────────────────────────────────
#
# This file defines a complete Iverson stack for local development, including
# several services with intentionally static, hardcoded default credentials:
#   - PostgreSQL: user/password = iverson/iverson (the owner, used by iverson-worker), and the api's
#     own login iverson_api with password dev-only-not-for-production-postgres-api-pw-0123456789,
#     which iverson-worker creates at startup (CSR round 12)
#   - StarRocks tenant logins: their master key is generated per-checkout, required via
#     ${IVERSON_STARROCKS_TENANT_KEY:?...} — run scripts/generate-compose-secrets.sh first
#   - Authentik: admin password and bootstrap token are generated per-checkout, required via
#     ${AUTHENTIK_BOOTSTRAP_PASSWORD:?...} / ${AUTHENTIK_BOOTSTRAP_TOKEN:?...} — run
#     scripts/generate-compose-secrets.sh first
#   - Service OAuth2 client secrets (see deploy/helm/iverson/charts/authentik/blueprints/compose-only/service-clients.yaml)
#   - Qdrant: API key is generated per-checkout, required via ${QDRANT__SERVICE__API_KEY:?...}
#     (shared by the qdrant and iverson-api services below) — run scripts/generate-compose-secrets.sh first
#   - TLS (CSR round-10 #5, round 12 §4.6): a per-checkout CA in deploy/compose-tls/ signs the
#     certificates authentik-tls-proxy, Postgres, the StarRocks FE, Kestrel (iverson-api and
#     iverson-worker) and Qdrant serve, and every in-network client verifies them against it — run
#     scripts/generate-compose-secrets.sh first (existing checkouts must re-run it once, then
#     recreate the stack, before the next `up`)
#   - And other dev-convenience values marked dev-only-not-for-production
#
# THIS DOCKER-COMPOSE STACK MUST NEVER BE EXPOSED BEYOND LOCALHOST OR USED IN:
#   - Shared/collaborative environments
#   - CI/CD pipelines
#   - Production or production-like (staging, test) deployments
#   - Any network-accessible endpoint
#
# For deployment beyond a local developer's machine, use Kubernetes (deploy/kind/ or deploy/terraform/ + deploy/helm/).
# All Kubernetes deployment targets generate real per-release secrets at deploy-time and never commit static credentials.
#
# ────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: iverson-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iverson
      POSTGRES_PASSWORD: iverson
      POSTGRES_DB: iverson
    # CSR round 12 §4.6: serves TLS from the compose certificate through tls-entrypoint.sh, which
    # copies the key into a postgres-owned 0600 file before docker-entrypoint.sh runs. Host tools may
    # still connect in plaintext: the image's pg_hba.conf ends with `host all all all scram-sha-256`,
    # which admits both. The api, the worker and Authentik verify the certificate (verify-full).
    entrypoint: ["sh", "/usr/local/bin/iverson-pg-tls-entrypoint.sh"]
    command: ["postgres"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # 18+ keeps its data in /var/lib/postgresql/18/docker and refuses to start with a mount at the
      # old /var/lib/postgresql/data. It also refuses a volume left by the 16.x image (a 16 cluster
      # at the volume's root): `docker compose down -v` before the first start.
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/init-authentik-db.sql:/docker-entrypoint-initdb.d/init-authentik-db.sql:ro
      - { type: bind, source: ./deploy/postgres/tls-entrypoint.sh, target: /usr/local/bin/iverson-pg-tls-entrypoint.sh, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/postgres.crt, target: /etc/pgtls-src/tls.crt, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/postgres.key, target: /etc/pgtls-src/tls.key, read_only: true }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iverson"]
      interval: 10s
      timeout: 5s
      retries: 5

  starrocks:
    image: starrocks/allin1-ubuntu:4.1.6@sha256:5cbf09c4c788d2ca41a8e38599b650f04dbc6af0de51ebda0952770fb8333e5d
    container_name: iverson-starrocks
    restart: unless-stopped
    # CSR round 12 §4.6: the FE serves TLS on 9030 from a keystore that fe-tls-entrypoint.sh builds
    # from the compose certificate at every start, before it hands over to the image's own
    # entrypoint under the image's tini. Secure transport is not forced; the api and worker verify
    # the certificate (SslMode=VerifyFull).
    entrypoint: ["/usr/bin/tini-static", "--", "bash", "/usr/local/bin/iverson-fe-tls-entrypoint.sh"]
    tmpfs:
      - /run/iverson-fe-tls:mode=0700
    ports:
      - "127.0.0.1:8030:8030"   # FE HTTP / admin
      - "127.0.0.1:9030:9030"   # FE MySQL query port
    volumes:
      - starrocks_data:/data/deploy
      - { type: bind, source: ./deploy/starrocks/fe-tls-entrypoint.sh, target: /usr/local/bin/iverson-fe-tls-entrypoint.sh, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/starrocks.crt, target: /etc/iverson/starrocks-tls/tls.crt, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/starrocks.key, target: /etc/iverson/starrocks-tls/tls.key, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/ca.crt, target: /etc/iverson/starrocks-tls/ca.crt, read_only: true }
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9030 -u root --connect-timeout=3 -e 'SELECT 1' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # One-shot bootstrap, mirroring deploy/helm/iverson/charts/starrocks/templates/job-create-user.yaml
  # (the authoritative shape for this grant set). The allin1 image bundles FE+BE in one process,
  # so unlike the chart's job there is no separate BE-registration wait — a healthy FE (the
  # `starrocks` healthcheck) is sufficient. Follows the `ollama-init` idiom already in this file:
  # a run-once service other services gate on via `condition: service_completed_successfully`,
  # rather than the `init-authentik-db.sql` idiom, because these statements must run against
  # StarRocks's own SQL dialect (CREATE ROLE/GRANT ON DATABASE/ON CATALOG) and StarRocks has no
  # docker-entrypoint-initdb.d equivalent to hook a script into at container start.
  #
  # `CREATE USER IF NOT EXISTS` / `CREATE DATABASE IF NOT EXISTS` / `GRANT` are all naturally
  # idempotent in StarRocks, so re-running this on an already-bootstrapped stack succeeds as a
  # no-op rather than erroring — required for `docker compose up -d` to stay safe to re-run.
  #
  # Every statement here is carried over unweakened from the chart job, which explains each one
  # (CSR round 11 §3): two logins, iverson_app for queries and iverson_provisioner for tenant
  # provisioning; iverson_app holds no grant (CSR round 12 §3.5), and the REVOKEs, OPERATE ON
  # SYSTEM among them, strip what earlier versions of this service granted it. A REVOKE of
  # something the user does not hold succeeds silently, but a database-scoped REVOKE on a missing
  # database fails and
  # aborts the batch, so `CREATE DATABASE IF NOT EXISTS iverson` stays ahead of them. Both
  # passwords are dev-only literals: root is passwordless and published on loopback only.
  # The trailing ALTER USER ... SET PROPERTIES line (CSR finding #6, defense-in-depth) is
  # likewise carried over from the chart job — see its comment there for the rationale.
  # So is the role revoke after the batch (CSR round 12 §7.5), word for word: it reads
  # iverson_app's role grants back from SHOW GRANTS and revokes each one. Compose has no
  # post-upgrade hook, so it runs on every `up`, before iverson-worker and iverson-api start, and
  # nothing grants iverson_app a tenant role any more.
  starrocks-init:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: iverson-starrocks-init
    depends_on:
      starrocks:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mysql -h starrocks -P 9030 -u root -e "
          CREATE USER IF NOT EXISTS 'iverson_app'@'%' IDENTIFIED BY 'dev-only-not-for-production-starrocks-app-pw-0123456789';
          CREATE USER IF NOT EXISTS 'iverson_provisioner'@'%' IDENTIFIED BY 'dev-only-not-for-production-starrocks-provisioner-pw-0123456789';
          CREATE DATABASE IF NOT EXISTS iverson;
          GRANT CREATE DATABASE ON CATALOG default_catalog TO 'iverson_provisioner'@'%';
          GRANT user_admin TO 'iverson_provisioner'@'%';
          REVOKE SELECT, INSERT, UPDATE, DELETE ON iverson.* FROM 'iverson_app'@'%';
          REVOKE CREATE TABLE, DROP, ALTER ON DATABASE iverson FROM 'iverson_app'@'%';
          REVOKE CREATE DATABASE ON CATALOG default_catalog FROM 'iverson_app'@'%';
          REVOKE user_admin FROM 'iverson_app'@'%';
          REVOKE OPERATE ON SYSTEM FROM USER 'iverson_app'@'%';
          ALTER USER 'iverson_app' SET PROPERTIES ('session.query_timeout' = '180', 'session.exec_mem_limit' = '4294967296');
        "
        fe() { mysql -h starrocks -P 9030 -u root "$$@"; }
        APP_GRANTS="$$(fe --batch --skip-column-names -e "SHOW GRANTS FOR 'iverson_app'@'%';")"
        APP_ROLES="$$(printf '%s\n' "$$APP_GRANTS" | sed -n "/ ON /d; s/.*GRANT \(.*\) TO .*/\1/p" | tr -d "' \`" | tr ',' '\n')"
        set -f
        for ROLE in $$APP_ROLES; do
          case "$$ROLE" in
            public) ;;
            *[!A-Za-z0-9_]*) echo "unexpected role name granted to iverson_app: $$ROLE" >&2; exit 1 ;;
            *) echo "revoking role $$ROLE from iverson_app"; fe -e "REVOKE $$ROLE FROM 'iverson_app'@'%';" ;;
          esac
        done
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    container_name: iverson-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY:?run scripts/generate-compose-secrets.sh first}
      QDRANT__SERVICE__JWT_RBAC: "true"
      # CSR round 12 §4.6: REST and gRPC serve TLS from the compose certificate, as on Helm. The api
      # and worker pin it by its SHA-256 thumbprint (Qdrant__CertPath); host tools dial localhost.
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__TLS__CERT: /qdrant-tls/cert.pem
      QDRANT__TLS__KEY: /qdrant-tls/key.pem
    ports:
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - { type: bind, source: ./deploy/compose-tls/qdrant.crt, target: /qdrant-tls/cert.pem, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/qdrant.key, target: /qdrant-tls/key.pem, read_only: true }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    container_name: iverson-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    container_name: iverson-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        curl -X POST http://ollama:11434/api/pull -d '{"name":"qwen2.5:3b"}'
    restart: "no"

  # Cross-encoder reranker (spec docs/specs/2026-09-03-reranker-design.md §5). Behind a profile so
  # nothing starts unless asked:   docker compose --profile reranker up -d reranker
  # Switch model per arm with RERANKER_MODEL_ID (the container serves ONE model). The model cache is
  # a named volume, never /tmp (a 4.9 GB tmpfs on the dev box, spec §7.6.3). --auto-truncate is the
  # stated head-truncation policy (§3.5); the harness records /info in each run's sidecar.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c
    container_name: iverson-reranker
    profiles: ["reranker"]
    command: ["--model-id", "${RERANKER_MODEL_ID:-cross-encoder/ms-marco-MiniLM-L-6-v2}", "--auto-truncate"]
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - reranker_models:/data

  # Default embedding backend (spec docs/specs/2026-09-05-embedding-migration-phase2-design.md §3.7):
  # iverson-api and iverson-worker both depend_on this via `condition: service_healthy`, so it
  # starts with the rest of the stack. EMBED_MODEL_ID still selects the served model, e.g.
  # EMBED_MODEL_ID=BAAI/bge-small-en-v1.5 docker compose up -d --no-deps tei-embed
  # — and must agree with the api/worker's Embeddings__ModelId (the API's /info identity guard
  # catches a mismatch loudly; TEI itself ignores the request's "model" field, since one model is
  # served per container). --auto-truncate is required: SciFact abstracts exceed the 512-token
  # window and TEI answers 413 without it. Model cache is a named volume, never /tmp.
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c
    container_name: iverson-tei-embed
    restart: unless-stopped
    # TEI's default max_batch_tokens (16384) OOM-kills warm-up for gte-modernbert-base on the 9 GB box
    # (spec 2026-09-04-multivector-experiment-design §10 row 7); that arm passes TEI_MAX_BATCH_TOKENS=4096.
    # The default here is TEI's own, so every bge arm is unchanged.
    command: ["--model-id", "${EMBED_MODEL_ID:-BAAI/bge-base-en-v1.5}", "--auto-truncate", "--max-batch-tokens", "${TEI_MAX_BATCH_TOKENS:-16384}"]
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - tei_models:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 5m

  # Generative backend the enrichment gate (docs/plans/2026-09-GATE-enrichment-backend.md) evaluated
  # AND FAILED on this box: Ollama stays the enrichment backend (Phase C′). TGI is retained only for
  # the deferred cloud measurement of the 3B candidate. Nothing on this branch routes to it — both
  # roles' Enrichment__BaseUrl point at http://ollama:11434, nothing depends_on it, and the Launcher
  # omits it. Behind a profile so a plain `docker compose up -d` never starts it:
  #   docker compose --profile tgi up -d tgi
  # Intel CPU image; bf16 weights; the token limits keep warm-up to ~10 minutes (the image defaults
  # pre-allocate a 32k context and take twenty). HF_HUB_DISABLE_XET: the Hub's Xet download path
  # fails from this box, the classic path works. First start: ~11 min download + ~10 min warm-up.
  tgi:
    image: ghcr.io/huggingface/text-generation-inference:3.3.7-intel-cpu@sha256:89b4cc8d6e4f7c184c63485a63094760ac9454be658a90f68bc8ecc3cde228bc
    container_name: iverson-tgi
    profiles: ["tgi"]
    command: ["--model-id", "${GEN_MODEL_ID:-Qwen/Qwen2.5-1.5B-Instruct}", "--dtype", "bfloat16", "--max-input-tokens", "3072", "--max-total-tokens", "3584", "--max-batch-prefill-tokens", "3072"]
    environment:
      - HF_HUB_DISABLE_XET=1
    shm_size: 1g
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      - tgi_models:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 25m

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0@sha256:9babd1c0beaf93189982bdbb9fe4bf194a2730298b640c057817746c19838866
    container_name: iverson-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0@sha256:24cdd3a7fa89d2bed150560ebea81ff1943badfa61e51d66bb541a6b0d7fb047
    container_name: iverson-kafka
    init: true
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Observability ────────────────────────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: iverson-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC (traces + logs)
      - "127.0.0.1:4318:4318"    # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: iverson-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - { type: bind, source: ./deploy/compose-tls/ca.crt, target: /etc/prometheus/compose-ca.crt, read_only: true }
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity ────────────────────────────────────────────────────────────────

  # The ONE process that migrates the authentik database. Everything else runs with
  # AUTHENTIK_SKIP_MIGRATIONS=true and waits for this to exit 0.
  #
  # Why this exists: `ak server` and `ak worker` BOTH run lifecycle/migrate.py on startup. That
  # module opens its own psycopg connection, takes pg_advisory_lock(1000) on it, and then hands the
  # actual migrating to Django on a SEPARATE connection — while its own connection sits holding an
  # uncommitted implicit transaction from the `SET search_path` and version-history reads it does
  # between the lock and the Django call. A second container's Django connection then blocks on a
  # table lock that idle transaction holds, and Postgres cannot break it as a deadlock because the
  # idle backend is not itself waiting on anything. Observed 2026-08-22: a fresh `docker compose up`
  # wedged indefinitely mid-migration and left a PARTIALLY MIGRATED schema — an index existed that
  # the Django ledger had no record of, so every subsequent blueprint apply failed with
  # `relation "authentik_t_queue_n_7b09fb_idx" already exists`, zero OAuth2 providers were created,
  # and token issuance returned invalid_client. No retry repaired it; only DROP DATABASE did.
  #
  # `python -m lifecycle.migrate` is the full sequence the server would otherwise run inline:
  # lifecycle/system_migrations/*, `migrate_schemas`, the tenant-template schema pass, and Django's
  # deploy checks. `ak migrate` is NOT equivalent — the image's entrypoint routes it to
  # `manage migrate`, which skips the system migrations and the schema passes entirely. The
  # entrypoint is overridden here because that same routing swallows any bare command.
  # Idempotent: a re-run on a migrated database exits 0 with "No migrations to apply."
  authentik-migrate:
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    container_name: iverson-authentik-migrate
    entrypoint: ["python", "-m", "lifecycle.migrate"]
    restart: "no"
    volumes:
      - { type: bind, source: ./deploy/compose-tls/ca.crt, target: /etc/postgres-tls/ca.crt, read_only: true }
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?run scripts/generate-compose-secrets.sh first}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      # CSR round 12 §4.6: verify Postgres's certificate against the compose CA, as on Helm.
      AUTHENTIK_POSTGRESQL__SSLMODE: verify-full
      AUTHENTIK_POSTGRESQL__SSLROOTCERT: /etc/postgres-tls/ca.crt
    depends_on:
      postgres:
        condition: service_healthy

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    container_name: iverson-authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?run scripts/generate-compose-secrets.sh first}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      # CSR round 12 §4.6: verify Postgres's certificate against the compose CA, as on Helm.
      AUTHENTIK_POSTGRESQL__SSLMODE: verify-full
      AUTHENTIK_POSTGRESQL__SSLROOTCERT: /etc/postgres-tls/ca.crt
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@iverson.local
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?run scripts/generate-compose-secrets.sh first}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?run scripts/generate-compose-secrets.sh first}
      # authentik-migrate owns migrations; this role must never run them concurrently.
      AUTHENTIK_SKIP_MIGRATIONS: "true"
      IVERSON_LOADTEST_CLIENT_SECRET: ${IVERSON_LOADTEST_CLIENT_SECRET:?run scripts/generate-compose-secrets.sh first}
      IVERSON_WEBTEST_CLIENT_SECRET: ${IVERSON_WEBTEST_CLIENT_SECRET:?run scripts/generate-compose-secrets.sh first}
      IVERSON_ADMIN_AUTOMATION_CLIENT_SECRET: ${IVERSON_ADMIN_AUTOMATION_CLIENT_SECRET:?run scripts/generate-compose-secrets.sh first}
      IVERSON_SMOKE_TEST_PASSWORD: ${IVERSON_SMOKE_TEST_PASSWORD:?run scripts/generate-compose-secrets.sh first}
      IVERSON_BYPASS_PASSWORD: ${IVERSON_BYPASS_PASSWORD:?run scripts/generate-compose-secrets.sh first}
      IVERSON_ADMIN_ORCHESTRATOR_PASSWORD: ${IVERSON_ADMIN_ORCHESTRATOR_PASSWORD:?run scripts/generate-compose-secrets.sh first}
      IVERSON_ADMIN_ORCHESTRATOR_TOKEN: ${IVERSON_ADMIN_ORCHESTRATOR_TOKEN:?run scripts/generate-compose-secrets.sh first}
      # CSR round-11 #8, round-12 §2.5: trust X-Forwarded-For and X-Forwarded-Proto only from
      # 127.0.0.2, the source address the tls-proxy sharing this network namespace binds
      # (deploy/compose-tls-proxy.conf). Any other peer is untrusted and recorded as itself.
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "127.0.0.2/32"
      # CSR round-12 §2.5: a reputation row expires an hour after it is created; the login throttle
      # (blueprints/recovery-flow.yaml) sums only live rows.
      AUTHENTIK_REPUTATION__EXPIRY: "3600"
    # CSR round 12 §4.6: host clients reach Authentik only through authentik-tls-proxy, which listens
    # on 8443 in this container's network namespace; 9443 is free in compose and kind. 9000 is no
    # longer published and stays reachable inside the compose network.
    ports:
      - "127.0.0.1:9443:8443"
    volumes:
      - ./deploy/helm/iverson/charts/authentik/blueprints:/blueprints/custom:ro
      - ./deploy/helm/iverson/charts/authentik/assets/fonts/fraunces-900.woff2:/web/dist/assets/fonts/Fraunces/fraunces-900.woff2:ro
      - { type: bind, source: ./deploy/compose-tls/ca.crt, target: /etc/postgres-tls/ca.crt, read_only: true }
    depends_on:
      authentik-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    container_name: iverson-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?run scripts/generate-compose-secrets.sh first}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      # CSR round 12 §4.6: verify Postgres's certificate against the compose CA, as on Helm.
      AUTHENTIK_POSTGRESQL__SSLMODE: verify-full
      AUTHENTIK_POSTGRESQL__SSLROOTCERT: /etc/postgres-tls/ca.crt
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@iverson.local
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?run scripts/generate-compose-secrets.sh first}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?run scripts/generate-compose-secrets.sh first}
      # authentik-migrate owns migrations; this role must never run them concurrently.
      AUTHENTIK_SKIP_MIGRATIONS: "true"
      IVERSON_LOADTEST_CLIENT_SECRET: ${IVERSON_LOADTEST_CLIENT_SECRET:?run scripts/generate-compose-secrets.sh first}
      IVERSON_WEBTEST_CLIENT_SECRET: ${IVERSON_WEBTEST_CLIENT_SECRET:?run scripts/generate-compose-secrets.sh first}
      IVERSON_ADMIN_AUTOMATION_CLIENT_SECRET: ${IVERSON_ADMIN_AUTOMATION_CLIENT_SECRET:?run scripts/generate-compose-secrets.sh first}
      IVERSON_SMOKE_TEST_PASSWORD: ${IVERSON_SMOKE_TEST_PASSWORD:?run scripts/generate-compose-secrets.sh first}
      IVERSON_BYPASS_PASSWORD: ${IVERSON_BYPASS_PASSWORD:?run scripts/generate-compose-secrets.sh first}
      IVERSON_ADMIN_ORCHESTRATOR_PASSWORD: ${IVERSON_ADMIN_ORCHESTRATOR_PASSWORD:?run scripts/generate-compose-secrets.sh first}
      IVERSON_ADMIN_ORCHESTRATOR_TOKEN: ${IVERSON_ADMIN_ORCHESTRATOR_TOKEN:?run scripts/generate-compose-secrets.sh first}
      # CSR round-10 #4/#16: where the recovery flow sends an invitee (recovery-flow.yaml's !Env).
      IVERSON_CONSOLE_URL: http://localhost:5173/
      # CSR round-12 §2.5: a reputation row expires an hour after it is created; the login throttle
      # (blueprints/recovery-flow.yaml) sums only live rows.
      AUTHENTIK_REPUTATION__EXPIRY: "3600"
    volumes:
      - ./deploy/helm/iverson/charts/authentik/blueprints:/blueprints/custom:ro
      - { type: bind, source: ./deploy/compose-tls/ca.crt, target: /etc/postgres-tls/ca.crt, read_only: true }
    depends_on:
      authentik-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # CSR round-10 #5: terminates TLS on 8443 in front of authentik-server, sharing its network
  # namespace the way the Helm chart's tls-proxy sidecar shares the pod, so the hop to Authentik
  # stays on loopback. The API reaches it as authentik-server:8443, and host clients as
  # https://localhost:9443 (published on authentik-server, whose network namespace it shares).
  # After authentik-server is restarted or recreated, restart authentik-tls-proxy too: it shares
  # that container's network namespace.
  authentik-tls-proxy:
    image: docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:884e0b7f42f303641b0f4e78755aea647521dca0b89ca3be7992ad78b5c07434
    container_name: iverson-authentik-tls-proxy
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:mode=1777
    network_mode: "service:authentik-server"
    volumes:
      - { type: bind, source: ./deploy/compose-tls-proxy.conf, target: /etc/nginx/conf.d/default.conf, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/tls.crt, target: /etc/iverson/tls/tls.crt, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/tls.key, target: /etc/iverson/tls/tls.key, read_only: true }
    # Healthy once the TLS listener answers, whatever Authentik behind it returns (no -f): the API and
    # worker wait on this rather than on the container merely starting.
    healthcheck:
      test: ["CMD", "curl", "-sk", "-o", "/dev/null", "https://127.0.0.1:8443/-/health/live/"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      authentik-server:
        condition: service_started

  # ── Application ─────────────────────────────────────────────────────────────
  #
  # STALE-IMAGE HAZARD — read before rebuilding after a server-side change.
  # iverson-api and iverson-worker share ONE image tag (`image: iverson-api`) but are two
  # containers. The habitual
  #     docker compose build iverson-api && docker compose up -d iverson-api
  # rebuilds the tag and recreates ONLY the api container; iverson-worker keeps running the
  # image it started with. Since the worker is what projects into StarRocks and Qdrant, the
  # conformance harness's `query` and `vector-search` scenarios would then be graded against a
  # stale projector while the api is current — a silent wrong-answer, not a failure.
  # Always recreate both:
  #     docker compose build iverson-api && docker compose up -d iverson-api iverson-worker
  # (or plain `docker compose up -d`, which recreates every service whose image changed).

  iverson-api:
    build:
      context: ..
      dockerfile: Iverson.Server/Iverson.Api/Dockerfile
    image: iverson-api
    container_name: iverson-api
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      # CSR round 12 §3.3: /metrics and /build (LoadTest's run attribution reads /build here).
      - "127.0.0.1:8082:8082"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # CSR round 12 §6.1: the api's own login, as on the chart's api Deployment: not the owner, no
      # BYPASSRLS, no DDL. iverson-worker creates it with this password (Postgres__ApiLoginPassword)
      # and grants it what the api uses, before its healthcheck passes.
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=iverson;Username=iverson_api;Password=dev-only-not-for-production-postgres-api-pw-0123456789;SSL Mode=VerifyFull;Root Certificate=/etc/iverson/authentik-ca/ca.crt
      - Otel__Endpoint=http://jaeger:4317
      - Embeddings__BaseUrl=http://tei-embed:80
      # MMR lambda per endpoint; these match VectorRankingOptions' defaults, set by the Tier 1 gate
      # (docs/plans/2026-09-GATE-tier1-defaults.md rule 7.2): SearchSimilar 1.00, SearchChunks 0.70.
      # Override both to sweep, e.g.
      #   VECTOR_RANKING_LAMBDA_SIMILAR=0.85 VECTOR_RANKING_LAMBDA_CHUNKS=0.85 docker compose up -d --no-deps iverson-api
      - VectorRanking__LambdaSimilar=${VECTOR_RANKING_LAMBDA_SIMILAR:-1.00}
      - VectorRanking__LambdaChunks=${VECTOR_RANKING_LAMBDA_CHUNKS:-0.70}
      - VectorRanking__SimilarViaChunksTypes__0
      # Must agree with tei-embed's served model (its --model-id, EMBED_MODEL_ID) and with the five
      # conformance fixtures' declared model: this is the deployment default types register under.
      # A mismatch fails loudly at first initialisation — the API's /info identity guard.
      - Embeddings__ModelId=${BENCH_EMBED_MODEL:-BAAI/bge-base-en-v1.5}
      - Enrichment__BaseUrl=http://ollama:11434
      - Enrichment__ModelId=qwen2.5:3b
      - Kafka__BootstrapServers=kafka:29092
      # Matches the chart's api/worker deployments (deploy/helm/iverson/charts/api/templates/
      # deployment.yaml): iverson_app, the login starrocks-init creates, with no default database.
      # It serves only /health and the readiness probes (CSR round 12 §7.4): every data connection
      # logs in as its tenant's own login, whose password is derived from StarRocks__TenantKey.
      - ConnectionStrings__StarRocks=Server=starrocks;Port=9030;Uid=iverson_app;Pwd=dev-only-not-for-production-starrocks-app-pw-0123456789;SslMode=VerifyFull;SslCa=/etc/iverson/authentik-ca/ca.crt;
      # CSR round 12 §7.1: the master key, shared with iverson-worker. Per-checkout, from
      # scripts/generate-compose-secrets.sh.
      - StarRocks__TenantKey=${IVERSON_STARROCKS_TENANT_KEY:?run scripts/generate-compose-secrets.sh first}
      - Qdrant__ApiKey=${QDRANT__SERVICE__API_KEY:?run scripts/generate-compose-secrets.sh first}
      # CSR round 12 §4.6: Qdrant serves TLS; the client pins this certificate by SHA-256 thumbprint.
      - Qdrant__CertPath=/etc/qdrant-tls/cert.pem
      # CSR round 12 §4.6: all three listeners serve HTTPS from the compose certificate, which names
      # iverson-api, iverson-worker, localhost and 127.0.0.1, as the chart's api serves them from
      # <release>-api-internal-tls. Overrides appsettings.json's http URLs. All-TLS: a plaintext
      # endpoint beside TLS ones breaks UseHttpsRedirection.
      - Kestrel__Endpoints__Grpc__Url=https://*:8080
      - Kestrel__Endpoints__Grpc__Certificate__Path=/etc/iverson/api-tls/tls.crt
      - Kestrel__Endpoints__Grpc__Certificate__KeyPath=/etc/iverson/api-tls/tls.key
      - Kestrel__Endpoints__Http__Url=https://*:8081
      - Kestrel__Endpoints__Http__Certificate__Path=/etc/iverson/api-tls/tls.crt
      - Kestrel__Endpoints__Http__Certificate__KeyPath=/etc/iverson/api-tls/tls.key
      - Kestrel__Endpoints__Metrics__Url=https://*:8082
      - Kestrel__Endpoints__Metrics__Certificate__Path=/etc/iverson/api-tls/tls.crt
      - Kestrel__Endpoints__Metrics__Certificate__KeyPath=/etc/iverson/api-tls/tls.key
      - Authentication__Authority=http://authentik-server:9000/application/o/iverson-api/
      # CSR round 12 §4.6: the issuer a host client gets through authentik-tls-proxy on 9443.
      - Authentication__ExternalIssuer=https://localhost:9443/
      - Authentication__ValidAudiences__0=dev-iverson-human-oidc-client-id
      # The admin console's client id (ValidAudiences__0): /v1/traces accepts only its tokens.
      - Authentication__ConsoleAudience=dev-iverson-human-oidc-client-id
      - Authentication__ValidAudiences__1=dev-iverson-loadtest-client-id
      - Authentication__ValidAudiences__2=dev-iverson-webtest-client-id
      - Authentication__ValidAudiences__3=dev-iverson-admin-automation-client-id
      # The LoadTest's data-plane calls (Post/Get/Search) carry the tenant-admin *user* token as
      # their service credential — AddIversonClient routes the persistence/retrieval/search stubs
      # through dataPlaneTokenProvider, leaving only the mapping stub on client credentials. That
      # token is minted via the human OIDC client below, so without this audience every Post fails
      # the default scheme with a bare HTTP 401 while RegisterSchema still succeeds.
      - Authentication__ValidAudiences__4=dev-iverson-loadtest-human-client-id
      - Authentication__ActingUser__Authority=http://authentik-server:9000/application/o/iverson-api/
      - Authentication__ActingUser__ValidAudiences__0=dev-iverson-loadtest-human-client-id
      - Authentik__BaseUrl=https://authentik-server:8443
      - Authentik__PublicBaseUrl=https://localhost:9443
      - Authentik__AdminToken=${IVERSON_ADMIN_ORCHESTRATOR_TOKEN:?run scripts/generate-compose-secrets.sh first}
      - Authentication__MetadataAddress=https://authentik-server:8443/application/o/iverson-api/.well-known/openid-configuration
      - Authentication__ActingUser__MetadataAddress=https://authentik-server:8443/application/o/iverson-api/.well-known/openid-configuration
      # The issuer tokens minted on 9000 carry (Authentik's global issuer mode).
      - Authentication__InternalIssuer=http://authentik-server:9000/
      - Authentik__CaCertificatePath=/etc/iverson/authentik-ca/ca.crt
      - Jaeger__OtlpHttpUrl=http://jaeger:4318
      # Iverson.AdminUI's Vite dev server (npm run dev) runs at localhost:5173
      # (Iverson.AdminUI/README.md) and is not proxied -- every fetch to /admin,
      # /health, /v1/traces from it is cross-origin. Without this, CORS never
      # activates (Program.cs registers no policy when AdminConsole:Origin is
      # empty) and the browser blocks every one of those calls.
      - AdminConsole__Origin=http://localhost:5173
      # /admin/console/metrics (Task 7) proxies Prometheus's HTTP API. The prometheus
      # service below scrapes iverson-api/iverson-worker (deploy/prometheus/prometheus.local.yml)
      # and is reachable from api at its compose service name and its own query port 9090 --
      # without this, the endpoint reports "notDeployed" even though Prometheus is running.
      - Prometheus__BaseUrl=http://prometheus:9090
      # CSR round 12 §2.4: compose's dev operator (iverson-loadtest-bypass-user) gets its sub only at
      # first database init, so no static operator list can name it. This dev-only fallback keeps the
      # compose blueprints' operators group an Operator; the api warns at startup while it is set, and
      # the Helm chart never sets it.
      - Authorization__OperatorGroupFallback=operators
    volumes:
      # The compose CA, which signs every compose certificate: Authentik's, Postgres's, the FE's and
      # Kestrel's (the worker's healthcheck) are verified against it.
      - { type: bind, source: ./deploy/compose-tls/ca.crt, target: /etc/iverson/authentik-ca/ca.crt, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/kestrel.crt, target: /etc/iverson/api-tls/tls.crt, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/kestrel.key, target: /etc/iverson/api-tls/tls.key, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/qdrant.crt, target: /etc/qdrant-tls/cert.pem, read_only: true }
    # A TCP connect to 8080 says Kestrel is listening, and that is all this healthcheck claims.
    # The api runs no bootstrap DDL (CSR round 12 §6.3): iverson-worker does, and this service waits
    # for it below. A bash /dev/tcp redirect rather than curl/wget: the aspnet:10.0 runtime image
    # ships neither (verified), but does ship bash.
    healthcheck:
      # CMD-SHELL wrapping `bash -c '...'`, as iverson-worker's and qdrant's do. The redirect needs
      # bash: CMD-SHELL alone runs /bin/sh, which on this image is dash, and dash has no /dev/tcp
      # ("cannot create /dev/tcp/...: Directory nonexistent"). And not ["CMD", "bash", "-c", "..."]:
      # podman's Docker API splits every CMD argument on whitespace, which turns that form into
      # `bash -c exec`, a check that always passes.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      starrocks:
        condition: service_healthy
      starrocks-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
      # authentik-server alone never applies the compose-only blueprints (users, OAuth clients,
      # flows) -- that's authentik-worker's job, and nothing else in this file depends on it, so
      # `docker compose up -d iverson-api` alone would otherwise never start it, leaving nobody
      # able to log in or mint a token. No healthcheck exists on this image's worker role, so
      # service_started is the strongest condition available; blueprint application finishes on
      # its own shortly after the container starts.
      authentik-worker:
        condition: service_started
      authentik-tls-proxy:
        condition: service_healthy
      tei-embed:
        condition: service_healthy
      # CSR round 12 §6.3: the worker starts first. It runs the bootstrap DDL, creates iverson_api
      # and issues its grants before it listens, so a passing worker healthcheck means this
      # service's login can connect and read the schema registry.
      iverson-worker:
        condition: service_healthy

  # The worker role. Every Kafka consumer and background reconciliation worker in Iverson.Api is
  # gated on `workloadRole == "worker"` (Iverson.Api/Program.cs) — IntelligenceStoreConsumer,
  # the DLQ/reconciliation and document re-render workers, and AddEngagementStoreConsumer's
  # hosted consumer. Without this service NO asynchronous projection is ever populated: Qdrant
  # stays empty, StarRocks stays empty, and every read served from a projection returns nothing
  # while the write path looks perfectly healthy. The Helm chart has always deployed a worker
  # (deploy/helm/iverson/charts/worker); compose was the outlier.
  iverson-worker:
    build:
      context: ..
      dockerfile: Iverson.Server/Iverson.Api/Dockerfile
    image: iverson-api
    container_name: iverson-worker
    restart: unless-stopped
    user: "1000:1000"
    # No `ports:` on purpose, mirroring the chart's worker Deployment, which publishes no gRPC
    # port either: this role serves no client traffic. Nothing is published to the host, so the
    # container's own 8080/8081/8082 cannot collide with iverson-api's published bindings.
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # The one line that distinguishes this service from iverson-api. The env-var configuration
      # provider folds "__" into ":" but leaves a single underscore alone, so this lands in
      # IConfiguration under the literal key "WORKLOAD_ROLE" — the first key Program.cs checks.
      - WORKLOAD_ROLE=worker
      - Otel__Endpoint=http://jaeger:4317
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=iverson;Username=iverson;Password=iverson;SSL Mode=VerifyFull;Root Certificate=/etc/iverson/authentik-ca/ca.crt
      # CSR round 12 §6.1: compose has no CNPG to create iverson_api, so this worker, connected as
      # the superuser above, creates it at startup with this password; iverson-api logs in with it.
      - Postgres__ApiLoginPassword=dev-only-not-for-production-postgres-api-pw-0123456789
      - Embeddings__BaseUrl=http://tei-embed:80
      - Embeddings__ModelId=${BENCH_EMBED_MODEL:-BAAI/bge-base-en-v1.5}
      - Enrichment__BaseUrl=http://ollama:11434
      - Enrichment__ModelId=qwen2.5:3b
      - Kafka__BootstrapServers=kafka:29092
      # Matches the chart's api/worker deployments (deploy/helm/iverson/charts/api/templates/
      # deployment.yaml): iverson_app, the login starrocks-init creates, with no default database.
      # It serves only /health and the readiness probes (CSR round 12 §7.4): every data connection
      # logs in as its tenant's own login, whose password is derived from StarRocks__TenantKey.
      - ConnectionStrings__StarRocks=Server=starrocks;Port=9030;Uid=iverson_app;Pwd=dev-only-not-for-production-starrocks-app-pw-0123456789;SslMode=VerifyFull;SslCa=/etc/iverson/authentik-ca/ca.crt;
      # CSR round 11 §3: tenant provisioning's own login, as on the chart's worker. Only the
      # worker provisions, so iverson-api has no provisioner connection string.
      - ConnectionStrings__StarRocksProvisioner=Server=starrocks;Port=9030;Uid=iverson_provisioner;Pwd=dev-only-not-for-production-starrocks-provisioner-pw-0123456789;SslMode=VerifyFull;SslCa=/etc/iverson/authentik-ca/ca.crt;
      # CSR round 12 §7.1: iverson-api's master key. Provisioning creates each tenant's login with
      # the password derived from it, and the worker's upserts and aggregates log in with it.
      - StarRocks__TenantKey=${IVERSON_STARROCKS_TENANT_KEY:?run scripts/generate-compose-secrets.sh first}
      - Qdrant__ApiKey=${QDRANT__SERVICE__API_KEY:?run scripts/generate-compose-secrets.sh first}
      # CSR round 12 §4.6: Qdrant serves TLS; the client pins this certificate by SHA-256 thumbprint.
      - Qdrant__CertPath=/etc/qdrant-tls/cert.pem
      # CSR round 12 §4.6: all three listeners serve HTTPS from the compose certificate, which names
      # iverson-api, iverson-worker, localhost and 127.0.0.1, as the chart's api serves them from
      # <release>-api-internal-tls. Overrides appsettings.json's http URLs. All-TLS: a plaintext
      # endpoint beside TLS ones breaks UseHttpsRedirection.
      - Kestrel__Endpoints__Grpc__Url=https://*:8080
      - Kestrel__Endpoints__Grpc__Certificate__Path=/etc/iverson/api-tls/tls.crt
      - Kestrel__Endpoints__Grpc__Certificate__KeyPath=/etc/iverson/api-tls/tls.key
      - Kestrel__Endpoints__Http__Url=https://*:8081
      - Kestrel__Endpoints__Http__Certificate__Path=/etc/iverson/api-tls/tls.crt
      - Kestrel__Endpoints__Http__Certificate__KeyPath=/etc/iverson/api-tls/tls.key
      - Kestrel__Endpoints__Metrics__Url=https://*:8082
      - Kestrel__Endpoints__Metrics__Certificate__Path=/etc/iverson/api-tls/tls.crt
      - Kestrel__Endpoints__Metrics__Certificate__KeyPath=/etc/iverson/api-tls/tls.key
      - Authentication__Authority=http://authentik-server:9000/application/o/iverson-api/
      # CSR round 12 §4.6: the issuer a host client gets through authentik-tls-proxy on 9443.
      - Authentication__ExternalIssuer=https://localhost:9443/
      - Authentication__ValidAudiences__0=dev-iverson-human-oidc-client-id
      - Authentication__ValidAudiences__1=dev-iverson-loadtest-client-id
      - Authentication__ValidAudiences__2=dev-iverson-webtest-client-id
      - Authentication__ValidAudiences__3=dev-iverson-admin-automation-client-id
      - Authentication__ValidAudiences__4=dev-iverson-loadtest-human-client-id
      - Authentication__ActingUser__Authority=http://authentik-server:9000/application/o/iverson-api/
      - Authentication__ActingUser__ValidAudiences__0=dev-iverson-loadtest-human-client-id
      - Authentik__BaseUrl=https://authentik-server:8443
      - Authentik__PublicBaseUrl=https://localhost:9443
      - Authentik__AdminToken=${IVERSON_ADMIN_ORCHESTRATOR_TOKEN:?run scripts/generate-compose-secrets.sh first}
      - Authentication__MetadataAddress=https://authentik-server:8443/application/o/iverson-api/.well-known/openid-configuration
      - Authentication__ActingUser__MetadataAddress=https://authentik-server:8443/application/o/iverson-api/.well-known/openid-configuration
      # The issuer tokens minted on 9000 carry (Authentik's global issuer mode).
      - Authentication__InternalIssuer=http://authentik-server:9000/
      - Authentik__CaCertificatePath=/etc/iverson/authentik-ca/ca.crt
      - Jaeger__OtlpHttpUrl=http://jaeger:4318
      - Tenancy__SeedLegacyTenants=true
    volumes:
      # The compose CA, which signs every compose certificate: Authentik's, Postgres's, the FE's and
      # Kestrel's (the worker's healthcheck) are verified against it.
      - { type: bind, source: ./deploy/compose-tls/ca.crt, target: /etc/iverson/authentik-ca/ca.crt, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/kestrel.crt, target: /etc/iverson/api-tls/tls.crt, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/kestrel.key, target: /etc/iverson/api-tls/tls.key, read_only: true }
      - { type: bind, source: ./deploy/compose-tls/qdrant.crt, target: /etc/qdrant-tls/cert.pem, read_only: true }
    # CSR round 12 §6.3: iverson-api waits for this. The worker's startup block (the plumbing and
    # entity-table DDL, the roles, iverson_api and its grants, the legacy-tenant seed) is awaited
    # before Kestrel listens, so an HTTP 200 from /health on 8081 means it has finished and the
    # stores answer. 8081 serves TLS (CSR round 12 §4.6), so the request goes through the runtime
    # image's openssl (it has no curl, wget or nc), which verifies the Kestrel certificate against the
    # mounted compose CA and the name localhost; -verify_return_error ends the check on a failed
    # verification. CMD-SHELL wrapping `bash -c '...'`, as qdrant's does, rather than
    # ["CMD", "bash", "-c", "..."]: podman's Docker API splits every CMD argument on whitespace,
    # which turns that form into `bash -c exec`, a check that always passes. The script holds no
    # single quote (it sits inside one) and no `$` (compose would interpolate it).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" | openssl s_client -quiet -verify_return_error -CAfile /etc/iverson/authentik-ca/ca.crt -verify_hostname localhost -connect 127.0.0.1:8081 2>/dev/null | head -n 1 | grep -q \" 200 \"'"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    depends_on:
      # The same backing-service conditions iverson-api uses...
      postgres:
        condition: service_healthy
      starrocks:
        condition: service_healthy
      starrocks-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
      # See the matching comment on iverson-api's depends_on: without this, authentik-worker
      # never starts and the compose-only blueprints (users, OAuth clients, flows) never apply.
      authentik-worker:
        condition: service_started
      authentik-tls-proxy:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      tei-embed:
        condition: service_healthy

volumes:
  postgres_data:
  starrocks_data:
  qdrant_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  ollama_data:
  prometheus_data:
  reranker_models:
  tei_models:
  tgi_models:
