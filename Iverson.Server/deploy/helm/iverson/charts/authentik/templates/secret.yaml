apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-app
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
{{- /* CSR round-12 §2.6: no bootstrap password. No pod reads one, so Authentik's Setup flag stays
   False on a fresh install; initial-setup.yaml (blueprints-configmap.yaml) closes that flow. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-authentik-app" .Release.Name) }}
{{- if $existing }}
  secret-key: {{ index $existing.data "secret-key" }}
{{- else }}
  secret-key: {{ randAlphaNum 50 | b64enc }}
{{- end }}
