{{- if not (dig "gateway" "class" "" .Values.global) }}
{{- /* CSR round 12 §4.5: where global.gateway.class is set, the parent's gateway templates route this
   host instead. */}}
{{- include "iverson.refuseRetiredIngressClass" (dict "label" "authentik.ingress" "className" .Values.ingress.className) }}
{{- $wafKey := get (dict "alb" "wafAclArn" "gce" "securityPolicy" "azure-application-gateway" "wafPolicyId") .Values.ingress.className }}
{{- if and $wafKey (not (get .Values.ingress $wafKey)) }}
{{- fail (printf "authentik.ingress.%s must be set with ingress className %q: copy it from the Terraform output (docs/runbooks/csr11-identity-plane.md). Without it the public login has no edge rate limit (CSR round-11 #5)." $wafKey .Values.ingress.className) }}
{{- end }}
{{- $annotations := deepCopy (default dict .Values.ingress.annotations) }}
{{- with .Values.ingress.wafAclArn }}
{{- $_ := set $annotations "alb.ingress.kubernetes.io/wafv2-acl-arn" . }}
{{- end }}
{{- with .Values.ingress.wafPolicyId }}
{{- $_ := set $annotations "appgw.ingress.kubernetes.io/waf-policy-for-path" . }}
{{- end }}
{{- /* CSR round-11 #4, #6: the class's edge → tls-proxy 9080 protocol and port-80 settings
   (iverson.edgeAnnotations, parent templates/_helpers.tpl). */}}
{{- $backendTls := eq (include "authentik.backendTls" .) "true" }}
{{- $_ := mergeOverwrite $annotations (include "iverson.edgeAnnotations" (dict "className" .Values.ingress.className "backendTls" $backendTls "grpc" false "trustedRoot" .Values.ingress.appgwTrustedRootCertificate "host" (printf "%s-authentik" .Release.Name) "probePort" 9080 "probePath" "/-/health/live/") | fromYaml) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-authentik
  # No ingress-level CORS annotations: Authentik's own OAuth2 provider CORS middleware already
  # scopes Access-Control-Allow-Origin to each client's registered redirect-URI origins (verified
  # empirically against a live Authentik instance — see Task 2 report) — this is application-layer
  # behavior, independent of the edge in front of it.
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
{{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ printf "authentik.%s" .Values.global.ingressHost | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
{{- end }}
  rules:
    - host: {{ printf "authentik.%s" .Values.global.ingressHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-authentik
                port:
                  number: 9080
{{- end }}
