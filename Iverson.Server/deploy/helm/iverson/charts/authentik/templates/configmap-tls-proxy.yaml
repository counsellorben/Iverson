{{- $backendTls := eq (include "authentik.backendTls" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-authentik-tls-proxy
data:
  # CSR round-10 #5: TLS on 8443 in front of Authentik's plaintext 9000, inside the same pod. Host is
  # passed through and X-Forwarded-Proto set to https, so Authentik (which trusts both from loopback)
  # builds https issuer and jwks_uri URLs for this listener.
  default.conf: |
    # CSR round-11 #8: the address Authentik records, by the API's ClientPartitionKey rule and from
    # the same values (global.trustedProxies). A peer inside the trusted ranges is a load balancer or
    # ingress, so the client is the entry `hops` positions from the right of X-Forwarded-For; any
    # other peer, or a header with no such entry, gives the peer itself. The last map strips a port
    # (AGIC writes "ip:port") and unwraps "[v6]" with or without a port, as ClientPartitionKey's
    # IPEndPoint.TryParse does, so Authentik always receives one bare address.
{{- $hops := int (dig "trustedProxies" "hops" 1 .Values.global) }}
{{- if not (has $hops (list 1 2)) }}
{{- fail "global.trustedProxies.hops must be 1 or 2: the Authentik tls-proxy selects only those positions" }}
{{- end }}
    geo $remote_addr $iverson_peer_trusted {
      default 0;
{{- range (dig "trustedProxies" "cidrs" (list) .Values.global) }}
      {{ . }} 1;
{{- end }}
    }
    map $http_x_forwarded_for $iverson_xff_entry {
      default "";
{{- if eq $hops 2 }}
      "~(?<e>[^,\s]+)\s*,\s*[^,\s]+\s*$" $e;
{{- else }}
      "~(?<e>[^,\s]+)\s*$" $e;
{{- end }}
    }
    map "$iverson_peer_trusted:$iverson_xff_entry" $iverson_client {
      default $remote_addr;
      "~^1:(?<c>.+)$" $c;
    }
    map $iverson_client $iverson_client_addr {
      "~^\[(?<a>[0-9A-Fa-f:.]+)\]$" $a;
      "~^\[(?<a>[0-9A-Fa-f:.]+)\]:[0-9]+$" $a;
      "~^(?<a>[0-9]{1,3}(?:\.[0-9]{1,3}){3}):[0-9]+$" $a;
      default $iverson_client;
    }
    server {
      listen 8443 ssl;
      ssl_certificate     /etc/iverson/tls/tls.crt;
      ssl_certificate_key /etc/iverson/tls/tls.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # In-cluster callers: the address is the caller itself.
        proxy_set_header X-Forwarded-For $remote_addr;
      }
    }
    # CSR round-10 #4: the public listener behind the Authentik Ingress. It forwards only the paths a
    # browser needs (login, MFA enrolment, recovery, logout, OIDC), overwrites X-Forwarded-Host, and
    # marks every request, so the admin-automation policy can tell public traffic from in-cluster
    # callers. Everything else, the admin interface and admin API included, answers 404 here.
    # CSR round-11 #4: TLS from the edge when iverson.backendTls is on for this Ingress class. Host is
    # the one name the Ingress routes here, not the request's: Application Gateway replaces Host with
    # its backend host name, and Authentik builds its issuer and URLs from Host.
    server {
{{- if $backendTls }}
      listen 9080 ssl;
      ssl_certificate     /etc/iverson/tls/tls.crt;
      ssl_certificate_key /etc/iverson/tls/tls.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
{{- else }}
      listen 9080;
{{- end }}
      proxy_set_header Host authentik.{{ .Values.global.ingressHost }};
      proxy_set_header X-Forwarded-Host authentik.{{ .Values.global.ingressHost }};
      proxy_set_header X-Iverson-Public-Ingress 1;
      proxy_set_header X-Forwarded-For $iverson_client_addr;
      location /application/ { proxy_pass http://127.0.0.1:9000; }
      location /if/flow/ { proxy_pass http://127.0.0.1:9000; }
      location /api/v3/flows/executor/ { proxy_pass http://127.0.0.1:9000; }
      location /flows/-/default/ { proxy_pass http://127.0.0.1:9000; }
      location /static/ { proxy_pass http://127.0.0.1:9000; }
      location = / { proxy_pass http://127.0.0.1:9000; }
      location = /-/health/live/ { proxy_pass http://127.0.0.1:9000; }
      location / { return 404; }
    }
