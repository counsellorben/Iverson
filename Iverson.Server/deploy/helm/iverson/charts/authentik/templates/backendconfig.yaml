{{- with .Values.ingress.securityPolicy }}
# CSR round-11 #5: the Cloud Armor policy (Terraform's authentik_security_policy_name) on the Authentik
# backend, attached by service.yaml's backend-config annotation.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ $.Release.Name }}-authentik
spec:
  securityPolicy:
    name: {{ . | quote }}
  {{- if and (eq $.Values.ingress.className "gce") (eq (include "authentik.backendTls" $) "true") }}
  {{- /* CSR round-11 #4: the public listener serves TLS; Authentik's / redirects, so the check uses the
  liveness path the tls-proxy forwards. */}}
  healthCheck:
    type: HTTPS
    port: 9080
    requestPath: /-/health/live/
  {{- end }}
{{- end }}
