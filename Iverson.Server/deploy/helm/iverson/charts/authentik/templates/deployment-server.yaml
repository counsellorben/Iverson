{{- $backendTls := eq (include "authentik.backendTls" .) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-authentik
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-authentik-server
  # The writable root filesystems of `wait-for-migration` and `server` are deliberate: see `server`'s securityContext.
  annotations:
    kube-score/ignore: container-security-context-readonlyrootfilesystem
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-authentik-server
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-authentik-server
    spec:
      serviceAccountName: {{ .Release.Name }}-authentik
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- if gt (.Values.server.replicas | int) 1 }}
      # CSR round-12 §2.1: spread the server replicas across nodes where the scheduler can.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Release.Name }}-authentik-server
                topologyKey: kubernetes.io/hostname
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # CSR round-12 §2.1: the worker pod migrates (deployment-worker.yaml); a server pod never does.
      # Each server pod waits here until the database is migrated for its own image's version.
      # Neither marker shows that alone (Verified assumption 72): lifecycle/migrate.py writes this
      # version's authentik_version_history row before migrate_schemas runs, and advisory lock 1000
      # is free until a migrator takes it. Both together do not either: a migrator killed after
      # writing the row leaves the row behind, and Postgres frees the lock. So the wait ends when the
      # row exists, no session holds or waits for lock 1000, and none of this image's Django
      # migrations is unapplied. That holds on a fresh install (no row until the worker's pass
      # starts) and on an upgrade (the old version's servers keep serving while the new ones wait).
      # It reads the database with the image's own Python and connection settings, and writes nothing.
      initContainers:
        - name: wait-for-migration
          image: {{ .Values.image | quote }}
          command:
            - python
            - -c
            - |
              import os
              import time

              # The pass's last state change is migrate_schemas (lifecycle/migrate.py), so the wait also
              # requires that none of this image's Django migrations is unapplied: a migrator killed after
              # writing this version's row leaves the row and a free lock behind, with migrations unapplied.
              # Django's settings need a secret key at import; this process only reads the migration state
              # and signs nothing, so it gets a placeholder rather than the real key.
              os.environ.setdefault("DJANGO_SETTINGS_MODULE", "authentik.root.settings")
              os.environ.setdefault("AUTHENTIK_SECRET_KEY", "wait-for-migration-reads-only")
              import django
              django.setup()
              from django.db import connection
              from django.db.migrations.executor import MigrationExecutor
              from psycopg import connect
              from authentik import authentik_build_hash, authentik_version
              from authentik.lib.config import CONFIG, postgresql_direct_connection_kwargs

              # lifecycle/migrate.py takes pg_advisory_lock(1000), one bigint key: classid 0,
              # objid 1000, objsubid 1 in pg_locks.
              LOCK_1000 = (
                  "SELECT EXISTS (SELECT 1 FROM pg_locks WHERE locktype = 'advisory'"
                  " AND database = (SELECT oid FROM pg_database WHERE datname = current_database())"
                  " AND classid = 0 AND objid = 1000 AND objsubid = 1)"
              )

              def migrated():
                  with connect(**postgresql_direct_connection_kwargs(CONFIG), autocommit=True) as conn:
                      cur = conn.cursor()
                      cur.execute(f"SET search_path = {CONFIG.get('postgresql.default_schema')}")
                      cur.execute("SELECT to_regclass('authentik_version_history') IS NOT NULL")
                      if not cur.fetchone()[0]:
                          return False
                      cur.execute(
                          "SELECT EXISTS (SELECT 1 FROM authentik_version_history"
                          " WHERE version = %s AND build = %s)",
                          (authentik_version(), authentik_build_hash()),
                      )
                      if not cur.fetchone()[0]:
                          return False
                      cur.execute(LOCK_1000)
                      if cur.fetchone()[0]:
                          return False
                  try:
                      executor = MigrationExecutor(connection)
                      return not executor.migration_plan(executor.loader.graph.leaf_nodes())
                  finally:
                      connection.close()

              while True:
                  try:
                      if migrated():
                          print("database migrated for", authentik_version(), flush=True)
                          break
                      print("waiting for the worker to migrate to", authentik_version(), flush=True)
                  except Exception as exc:
                      print("waiting for the database:", exc, flush=True)
                  time.sleep(5)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-authentik-config
          env:
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-postgres, key: password }
          resources:
            requests:
              cpu: {{ .Values.resources.server.requests.cpu | quote }}
              memory: {{ .Values.resources.server.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.server.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.server.limits.cpu | quote }}
              memory: {{ .Values.resources.server.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.server.limits "ephemeral-storage" | quote }}
          volumeMounts:
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
        # CSR round-12 §2.6: the orchestrator pin's TokenReview (orchestrator-federation.yaml) goes to the
        # Kubernetes API through this loopback relay, the worker's jwks-relay pattern. A native sidecar on
        # its own projected token, which the ClusterRole in clusterrole-tokenreview.yaml lets create
        # tokenreviews and nothing else. It forwards only POSTs to the tokenreviews path. No --www and no
        # startup probe: the server never waits on it, and a missing relay refuses the exchange.
        - name: tokenreview-relay
          image: {{ .Values.jwksRelay.image | quote }}
          restartPolicy: Always
          args:
            - proxy
            - --address=127.0.0.1
            - --port=8001
            - --accept-paths=^/apis/authentication.k8s.io/v1/tokenreviews$
            - --reject-methods=^(GET|PUT|PATCH|DELETE)$
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: {{ .Values.resources.jwksRelay.requests.cpu | quote }}
              memory: {{ .Values.resources.jwksRelay.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.jwksRelay.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.jwksRelay.limits.cpu | quote }}
              memory: {{ .Values.resources.jwksRelay.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.jwksRelay.limits "ephemeral-storage" | quote }}
          volumeMounts:
            - name: tokenreview-relay-credential
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      containers:
        - name: server
          image: {{ .Values.image | quote }}
          # `args`, not `command`: the image's own ENTRYPOINT already wraps every invocation in
          # its `ak` lifecycle script — `args: ["server"]` overrides only the CMD, matching the
          # official `command: server` docker-compose shorthand. Setting `command:` here instead
          # would replace the ENTRYPOINT entirely and break startup.
          args: ["server"]
          securityContext:
            allowPrivilegeEscalation: false
            # Not read-only: Authentik writes to its own working directories at runtime and
            # upstream doesn't document read-only-root-filesystem compatibility (unlike
            # Prometheus above, where this was independently confirmed safe).
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-authentik-config
          env:
            - name: AUTHENTIK_SKIP_MIGRATIONS
              value: "true"
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-app, key: secret-key }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-postgres, key: password }
          ports:
            - containerPort: 9000
              name: http
          resources:
            requests:
              cpu: {{ .Values.resources.server.requests.cpu | quote }}
              memory: {{ .Values.resources.server.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.server.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.server.limits.cpu | quote }}
              memory: {{ .Values.resources.server.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.server.limits "ephemeral-storage" | quote }}
          readinessProbe:
            httpGet: { path: /-/health/ready/, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /-/health/live/, port: 9000 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/custom
              readOnly: true
            - name: blueprints-service-clients
              mountPath: /blueprints/custom/service-clients
              readOnly: true
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
        # CSR round-10 #5: terminates TLS on 8443 for the API's discovery, JWKS and admin-API calls,
        # and (identity-plane change) also carries the public 9080 listener behind the Ingress.
        # Authentik's own 9443 listener serves a self-signed fallback and is never exposed.
        - name: tls-proxy
          image: {{ .Values.tlsProxy.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 9080
              name: http-public
          resources:
            requests:
              cpu: {{ .Values.resources.tlsProxy.requests.cpu | quote }}
              memory: {{ .Values.resources.tlsProxy.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.tlsProxy.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.tlsProxy.limits.cpu | quote }}
              memory: {{ .Values.resources.tlsProxy.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.tlsProxy.limits "ephemeral-storage" | quote }}
          # A probe on the public listener (CSR round-10 #4): GCE and AGIC derive the Ingress
          # backend's health check from the readiness probe on the port the container declares, and
          # 9080 needs no NetworkPolicy exception beyond its own rule. Both listeners share one nginx
          # process and config, so it vouches for 8443 too. Authentik's cheap /-/health/live/ path with
          # the server container's timeout and threshold keeps a slow Django response from taking the
          # only Authentik pod out of its Service. HTTPS when 9080 serves TLS (CSR round-11 #4): an
          # nginx ssl listener answers plain HTTP with 400.
          readinessProbe:
            httpGet: { path: /-/health/live/, port: 9080{{ if $backendTls }}, scheme: HTTPS{{ end }} }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: tls-proxy-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: internal-tls
              mountPath: /etc/iverson/tls
              readOnly: true
            - name: tls-proxy-tmp
              mountPath: /tmp
      volumes:
        - name: blueprints
          configMap:
            name: {{ .Release.Name }}-authentik-blueprints
        - name: blueprints-service-clients
          secret:
            secretName: {{ .Release.Name }}-authentik-blueprints-service-clients
        - name: tls-proxy-config
          configMap:
            name: {{ .Release.Name }}-authentik-tls-proxy
        - name: internal-tls
          secret:
            secretName: {{ .Release.Name }}-authentik-internal-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tls-proxy-tmp
          emptyDir: {}
        - name: tokenreview-relay-credential
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
        - name: postgres-tls
          secret:
            secretName: {{ .Release.Name }}-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
