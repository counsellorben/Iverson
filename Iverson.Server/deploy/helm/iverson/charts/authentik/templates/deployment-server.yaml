apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-authentik
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-authentik-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-authentik-server
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-authentik-server
    spec:
      serviceAccountName: {{ .Release.Name }}-authentik
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # The ONE process that migrates the authentik database on this release. The server and worker
      # containers both run with AUTHENTIK_SKIP_MIGRATIONS=true so neither migrates concurrently.
      #
      # Why: `ak server` and `ak worker` BOTH run lifecycle/migrate.py on startup. That module opens
      # its own psycopg connection, takes pg_advisory_lock(1000) on it, then hands the actual
      # migrating to Django on a SEPARATE connection — while its own connection sits holding an
      # uncommitted implicit transaction from the `SET search_path` and version-history reads it
      # performs between the lock and the Django call. A second migrator's Django connection blocks
      # on a table lock that idle transaction holds, and Postgres cannot report it as a deadlock
      # because the idle backend is not itself waiting on anything. Observed on the compose stack
      # 2026-08-22: the wedge left a PARTIALLY MIGRATED schema that no retry repaired — an index
      # existed with no Django ledger row, every blueprint apply then failed, zero OAuth2 providers
      # were created, and only DROP DATABASE recovered it. In Kubernetes the liveness probes turn
      # that into restart churn, and a restart landing mid-ALTER TABLE is one way the corruption is
      # produced.
      #
      # `python -m lifecycle.migrate` is the full sequence: lifecycle/system_migrations/*,
      # `migrate_schemas`, the tenant-template pass, and Django's deploy checks. `ak migrate` is NOT
      # equivalent — the image entrypoint routes it to `manage migrate`, skipping the system
      # migrations and schema passes. The entrypoint is overridden because that routing swallows any
      # bare command. Idempotent: a re-run exits 0 with "No migrations to apply."
      initContainers:
        - name: migrate
          image: "ghcr.io/goauthentik/server:{{ .Values.imageTag }}"
          command: ["python", "-m", "lifecycle.migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-authentik-config
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-app, key: secret-key }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-postgres, key: password }
            # CSR round-2 finding #11: Redis now requires auth (charts/redis's --requirepass) —
            # this must match the password in that Secret exactly.
            - name: AUTHENTIK_REDIS__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-redis, key: password }
          resources:
            requests:
              cpu: {{ .Values.resources.server.requests.cpu | quote }}
              memory: {{ .Values.resources.server.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.server.limits.cpu | quote }}
              memory: {{ .Values.resources.server.limits.memory | quote }}
      containers:
        - name: server
          image: "ghcr.io/goauthentik/server:{{ .Values.imageTag }}"
          # `args`, not `command`: the image's own ENTRYPOINT already wraps every invocation in
          # its `ak` lifecycle script — `args: ["server"]` overrides only the CMD, matching the
          # official `command: server` docker-compose shorthand. Setting `command:` here instead
          # would replace the ENTRYPOINT entirely and break startup.
          args: ["server"]
          securityContext:
            allowPrivilegeEscalation: false
            # Not read-only: Authentik writes to its own working directories at runtime and
            # upstream doesn't document read-only-root-filesystem compatibility (unlike
            # Prometheus/Redis above, where this was independently confirmed safe).
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-authentik-config
          env:
            - name: AUTHENTIK_SKIP_MIGRATIONS
              value: "true"
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-app, key: secret-key }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-postgres, key: password }
            # CSR round-2 finding #11: Redis now requires auth (charts/redis's --requirepass) —
            # this must match the password in that Secret exactly.
            - name: AUTHENTIK_REDIS__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-redis, key: password }
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-app, key: bootstrap-password }
            - name: AUTHENTIK_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-app, key: bootstrap-token }
          ports:
            - containerPort: 9000
              name: http
          resources:
            requests:
              cpu: {{ .Values.resources.server.requests.cpu | quote }}
              memory: {{ .Values.resources.server.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.server.limits.cpu | quote }}
              memory: {{ .Values.resources.server.limits.memory | quote }}
          readinessProbe:
            httpGet: { path: /-/health/ready/, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /-/health/live/, port: 9000 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/custom
              readOnly: true
            - name: blueprints-service-clients
              mountPath: /blueprints/custom/service-clients
              readOnly: true
        # CSR round-10 #5: terminates TLS on 8443 for the API's discovery, JWKS and admin-API calls.
        # Authentik's own 9443 listener serves a self-signed fallback and is never exposed.
        - name: tls-proxy
          image: "nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 9080
              name: http-public
          resources:
            requests:
              cpu: {{ .Values.resources.tlsProxy.requests.cpu | quote }}
              memory: {{ .Values.resources.tlsProxy.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.tlsProxy.limits.cpu | quote }}
              memory: {{ .Values.resources.tlsProxy.limits.memory | quote }}
          # An HTTP probe on the public listener (CSR round-10 #4): GCE and AGIC derive the Ingress
          # backend's health check from the readiness probe on the port the container declares, and
          # 9080 needs no NetworkPolicy exception beyond its own rule. Both listeners share one nginx
          # process and config, so it vouches for 8443 too. Authentik's cheap /-/health/live/ path with
          # the server container's timeout and threshold keeps a slow Django response from taking the
          # only Authentik pod out of its Service.
          readinessProbe:
            httpGet: { path: /-/health/live/, port: 9080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: tls-proxy-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: internal-tls
              mountPath: /etc/iverson/tls
              readOnly: true
            - name: tls-proxy-tmp
              mountPath: /tmp
      volumes:
        - name: blueprints
          configMap:
            name: {{ .Release.Name }}-authentik-blueprints
        - name: blueprints-service-clients
          secret:
            secretName: {{ .Release.Name }}-authentik-blueprints-service-clients
        - name: tls-proxy-config
          configMap:
            name: {{ .Release.Name }}-authentik-tls-proxy
        - name: internal-tls
          secret:
            secretName: {{ .Release.Name }}-authentik-internal-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tls-proxy-tmp
          emptyDir: {}
