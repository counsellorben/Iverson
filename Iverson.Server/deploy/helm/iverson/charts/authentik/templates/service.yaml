apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-authentik
spec:
  selector:
    app: {{ .Release.Name }}-authentik-server
  ports:
    - name: http
      port: 9000
    - name: https
      port: 8443
    - name: http-public
      port: 9080
      {{- /* CSR round 12 §4.5: the GKE Gateway speaks HTTPS to the public listener (its appProtocol). */}}
      {{- if eq (dig "gateway" "class" "" .Values.global) "gke-l7-global-external-managed" }}
      appProtocol: HTTPS
      {{- end }}
