apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-authentik-blueprints
data:
{{- /* CSR round-10 #4/#16: the console URL is written into recovery-flow.yaml here, not read from the
   worker's environment. Authentik resolves !Env in whichever worker applies a file, and re-applies a
   file only when its content changes, so an environment value can stick at the default during a
   rolling upgrade and never follow a host change. Only recovery-flow.yaml is rewritten; every other
   blueprint is emitted unchanged. */}}
{{- $consoleUrl := printf "%s://%s/admin/" .Values.global.externalScheme .Values.global.ingressHost }}
{{- range $path, $bytes := .Files.Glob "blueprints/*.yaml" }}
  {{ base $path }}: |
{{- $content := $.Files.Get $path }}
{{- if eq (base $path) "recovery-flow.yaml" }}
{{- $content = $content | replace "!Env [IVERSON_CONSOLE_URL, \"http://localhost:5173/\"]" ($consoleUrl | quote) }}
{{- end }}
{{ $content | indent 4 }}
{{- end }}
  {{- /* CSR round-10 #4 (C2): rendered here, not kept under blueprints/, because compose and the
     Api.Tests fixture mount that directory (where nothing serves the JWKS) and the pinned subject
     needs the release namespace and name. A file of its own because one failing entry stops a
     whole blueprint: if the relay cannot fetch the JWKS, only federation waits for the hourly
     re-apply. */}}
  orchestrator-federation.yaml: |
    version: 1
    metadata:
      name: Iverson - orchestrator workload identity
    entries:
      # Every accepted assertion maps to the one pre-created user (service-clients.yaml). Runs only
      # after both policies below have passed.
      - id: workload-username
        model: authentik_sources_oauth.oauthsourcepropertymapping
        identifiers:
          name: "Iverson: k8s workload username"
        attrs:
          expression: 'return {"username": "iverson-admin-orchestrator-workload"}'
      # Trust anchor only: the cluster's service-account keys, through the worker's JWKS relay. No
      # login or enrolment flow.
      - id: k8s-workload-source
        model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: iverson-k8s-workload
        attrs:
          name: iverson-k8s-workload
          provider_type: openidconnect
          enabled: true
          # The OAuth source serializer requires these two; a JWT-federation-only source never uses them.
          consumer_key: iverson-k8s-workload
          consumer_secret: unused
          authorization_url: ""
          access_token_url: ""
          profile_url: ""
          oidc_jwks_url: http://127.0.0.1:8001/openid/v1/jwks
          user_property_mappings:
            - !KeyOf workload-username
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-admin-orchestrator
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: iverson-admin-orchestrator
          redirect_uris: []
          grant_types: ["client_credentials"]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
          access_token_validity: "minutes=5"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, goauthentik.io/api]]
          jwt_federation_sources:
            - !KeyOf k8s-workload-source
      # all, not the default any: both bindings must pass.
      - id: orchestrator-app
        model: authentik_core.application
        identifiers:
          slug: iverson-admin-orchestrator
        attrs:
          name: iverson-admin-orchestrator
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, iverson-admin-orchestrator]]
          policy_engine_mode: all
      # Authentik checks only a federated JWT's signature and expiry, so the subject and audience are
      # pinned here. The user check refuses every exchange until service-clients.yaml has pre-created
      # the user, so no exchange can create it (one created that way has an expiry and no group).
      # CSR round-11 #7: it also bounds the token's lifetime to 600 s, which with Authentik's expiry
      # check bounds its usable age, and requires the kubelet's pod binding, which `kubectl create
      # token` without a bound pod lacks.
      - id: orchestrator-workload
        model: authentik_policies_expression.expressionpolicy
        identifiers:
          name: iverson-admin-orchestrator-workload
        attrs:
          expression: |
            jwt = request.context.get("oauth_jwt") or {}
            aud = jwt.get("aud")
            auds = aud if isinstance(aud, list) else [aud]
            iat = jwt.get("iat")
            exp = jwt.get("exp")
            k8s = jwt.get("kubernetes.io") or {}
            user = ak_user_by(username="iverson-admin-orchestrator-workload")
            return (
                jwt.get("sub") == "system:serviceaccount:{{ .Release.Namespace }}:{{ .Release.Name }}-api"
                and "iverson-authentik-orchestrator" in auds
                and isinstance(iat, int) and isinstance(exp, int)
                and exp - iat <= 600
                and "pod" in k8s
                and user is not None
                and ak_is_group_member(user, name="iverson-admin-orchestrators")
            )
      # Refuses exchanges that came through the public listener. The same rule as the
      # admin-automation policy, kept as its own object so this blueprint does not depend on
      # service-clients.yaml's apply order.
      - id: orchestrator-in-cluster-only
        model: authentik_policies_expression.expressionpolicy
        identifiers:
          name: iverson-admin-orchestrator-in-cluster-only
        attrs:
          expression: |
            return "HTTP_X_IVERSON_PUBLIC_INGRESS" not in request.http_request.META
      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf orchestrator-workload
          target: !KeyOf orchestrator-app
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf orchestrator-in-cluster-only
          target: !KeyOf orchestrator-app
          order: 1
  {{- /* CSR round-11 #9: Helm only. Compose and the Api.Tests fixture mount blueprints/, keep akadmin
     and log in with it, and the fixture's OrchestratorGroup_IsNotASuperuserGroup forbids a superuser
     group in the service-clients blueprints. The deny bindings !Find flows other files define
     (default-authentication-flow, iverson-recovery), so apply this file after those. */}}
  superusers.yaml: |
    version: 1
    metadata:
      name: Iverson - Superusers and break-glass
    entries:
      # Declared here because the stock events blueprint can create the group without the flag.
      - id: admins
        model: authentik_core.group
        identifiers:
          name: authentik Admins
        attrs:
          is_superuser: true
      # The named break-glass admin. No password: it gets one, and enrols TOTP, only through a recovery
      # link an operator generates in the worker (docs/runbooks/csr11-identity-plane.md).
      - model: authentik_core.user
        identifiers:
          username: iverson-breakglass
        attrs:
          username: iverson-breakglass
          name: Iverson break-glass admin
          is_active: true
          groups:
            - !KeyOf admins
      # Bootstrap's own admin, never used after install. Inactive, it cannot log in; whichever of
      # bootstrap and this file runs first, it ends inactive.
      - model: authentik_core.user
        identifiers:
          username: akadmin
        attrs:
          name: authentik Default Admin
          is_active: false
      # True for a superuser on the public listener, whose tls-proxy marks every request. A deny stage
      # runs only when its policy passes; evaluated at execution (evaluate_on_plan false,
      # re_evaluate_policies true), it sees the identified or recovering user.
      - id: superuser-on-public-listener
        model: authentik_policies_expression.expressionpolicy
        identifiers:
          name: iverson-superuser-on-public-listener
        attrs:
          expression: |
            return request.user.is_superuser and "HTTP_X_IVERSON_PUBLIC_INGRESS" in request.http_request.META
      - id: refuse-superuser
        model: authentik_stages_deny.denystage
        identifiers:
          name: iverson-refuse-superuser-on-public-listener
        attrs:
          deny_message: Administrators sign in through the in-cluster route.
      # Login: after identification (10), before password (20), so a superuser's password is never
      # checked on the public listener.
      - id: login-refuse-binding
        model: authentik_flows.flowstagebinding
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          stage: !KeyOf refuse-superuser
        attrs:
          order: 15
          evaluate_on_plan: false
          re_evaluate_policies: true
      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf superuser-on-public-listener
          target: !KeyOf login-refuse-binding
          order: 0
      # Recovery: first, before any password or device is written.
      - id: recovery-refuse-binding
        model: authentik_flows.flowstagebinding
        identifiers:
          target: !Find [authentik_flows.flow, [slug, iverson-recovery]]
          stage: !KeyOf refuse-superuser
        attrs:
          order: 0
          evaluate_on_plan: false
          re_evaluate_policies: true
      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf superuser-on-public-listener
          target: !KeyOf recovery-refuse-binding
          order: 0
