{{- /*
CSR round-3 finding #15: this file used to be two separate template files —
this Secret-emitting file, and blueprints-secret-service-clients.yaml — each
independently doing its own `lookup`-or-`randAlphaNum` for the SAME 10 logical
credentials. Helm renders every templates/*.yaml file as its own root template
execution with no shared scope between files, so on a genuinely fresh install
(no existing Secret for `lookup` to find) each file's independent `randAlphaNum`
call drew a DIFFERENT random value for what was supposed to be one credential —
the Secret handed to the api Deployment didn't match what the blueprint
provisioned in Authentik, and auth failed until a second `helm upgrade`
converged them via `lookup` finding the now-real Secret both sides agreed on
(see docs/runbooks/grpc-admin-auth-cutover.md's former "two-pass helm upgrade
requirement", now obsolete).

Fixed by computing each credential's value exactly ONCE, in ONE file, and
having both consumers (the Secret resources below, and the blueprint Secret's
YAML content further down) reference that single computed value — the only way
to guarantee two Helm-rendered documents actually see the identical value
without either (a) a second render pass Helm doesn't have within one
install/upgrade, since `lookup` only ever sees cluster state from BEFORE this
operation started, or (b) deriving the fallback from public/guessable inputs
(e.g. a hash of .Release.Name), which would make the FIRST-install value of a
`resource-policy: keep` Secret permanently predictable instead of genuinely
random. Merging into one file avoids both: still a real `randAlphaNum` draw on
first install, just drawn once and reused everywhere it's needed.
*/}}
{{- $ns := .Release.Namespace }}
{{- $rel := .Release.Name }}
{{- $issuer := include "authentik.serviceAccountIssuer" . }}

{{- $loadtestExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-loadtest-client" $rel) }}
{{- $loadtestClientId := "" }}
{{- $loadtestClientSecret := "" }}
{{- if $loadtestExisting }}
{{- $loadtestClientId = index $loadtestExisting.data "client-id" | b64dec }}
{{- $loadtestClientSecret = index $loadtestExisting.data "client-secret" | b64dec }}
{{- else }}
{{- $loadtestClientId = randAlphaNum 40 }}
{{- $loadtestClientSecret = randAlphaNum 50 }}
{{- end }}

{{- $webtestExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-webtest-client" $rel) }}
{{- $webtestClientId := "" }}
{{- $webtestClientSecret := "" }}
{{- if $webtestExisting }}
{{- $webtestClientId = index $webtestExisting.data "client-id" | b64dec }}
{{- $webtestClientSecret = index $webtestExisting.data "client-secret" | b64dec }}
{{- else }}
{{- $webtestClientId = randAlphaNum 40 }}
{{- $webtestClientSecret = randAlphaNum 50 }}
{{- end }}

{{- /* CSR round-11 #9: admin-automation keeps its stable client-id and has no client secret here;
   callers authenticate with a service-account token (admin-automation.yaml below). */}}
{{- $adminAutoExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-admin-automation-client" $rel) }}
{{- $adminAutoClientId := "" }}
{{- if and $adminAutoExisting (hasKey (default dict $adminAutoExisting.data) "client-id") }}
{{- $adminAutoClientId = index $adminAutoExisting.data "client-id" | b64dec }}
{{- else }}
{{- $adminAutoClientId = randAlphaNum 40 }}
{{- end }}

{{- $humanOidcExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-human-oidc-client" $rel) }}
{{- $humanOidcClientId := "" }}
{{- if $humanOidcExisting }}
{{- $humanOidcClientId = index $humanOidcExisting.data "client-id" | b64dec }}
{{- else }}
{{- $humanOidcClientId = randAlphaNum 40 }}
{{- end }}

{{- $loadtestHumanExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-loadtest-human-client" $rel) }}
{{- $loadtestHumanClientId := "" }}
{{- if $loadtestHumanExisting }}
{{- $loadtestHumanClientId = index $loadtestHumanExisting.data "client-id" | b64dec }}
{{- else }}
{{- $loadtestHumanClientId = randAlphaNum 40 }}
{{- end }}

{{- $smokeTestUserExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-smoke-test-user" $rel) }}
{{- $smokeTestPassword := "" }}
{{- if $smokeTestUserExisting }}
{{- $smokeTestPassword = index $smokeTestUserExisting.data "password" | b64dec }}
{{- else }}
{{- $smokeTestPassword = randAlphaNum 32 }}
{{- end }}

{{- $bypassUserExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-bypass-user" $rel) }}
{{- $bypassPassword := "" }}
{{- if $bypassUserExisting }}
{{- $bypassPassword = index $bypassUserExisting.data "password" | b64dec }}
{{- else }}
{{- $bypassPassword = randAlphaNum 32 }}
{{- end }}

{{- $actingUserExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-acting-user-client" $rel) }}
{{- $actingUserClientId := "" }}
{{- if $actingUserExisting }}
{{- $actingUserClientId = index $actingUserExisting.data "client-id" | b64dec }}
{{- else }}
{{- $actingUserClientId = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-loadtest-client
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  client-id: {{ $loadtestClientId | b64enc }}
  client-secret: {{ $loadtestClientSecret | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-webtest-client
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  client-id: {{ $webtestClientId | b64enc }}
  client-secret: {{ $webtestClientSecret | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-admin-automation-client
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  client-id: {{ $adminAutoClientId | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-human-oidc-client
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  client-id: {{ $humanOidcClientId | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-loadtest-human-client
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  client-id: {{ $loadtestHumanClientId | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-smoke-test-user
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  password: {{ $smokeTestPassword | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-bypass-user
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  password: {{ $bypassPassword | b64enc }}
---
# Public OIDC client-id for the PRODUCTION acting-user identity. Ungated (present on every profile)
# so Authentication__ActingUser__ValidAudiences__0 always has a real audience -- without it the
# acting-user path binds an empty audience list with ValidateAudience=true and every acting-user
# call returns Unauthenticated. A public client has no secret, only a stable client-id.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-acting-user-client
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  client-id: {{ $actingUserClientId | b64enc }}
---
# This blueprint carries credential material -- OAuth2 client secrets and user passwords -- so it
# is delivered to Authentik's blueprint loader as a Secret, NOT a ConfigMap. Kubernetes' stock
# `view` RBAC role can read ConfigMaps but not Secrets, so a ConfigMap carrier would expose the
# highest-value credential in the stack to a read-only principal. The non-secret structural
# blueprints stay in blueprints-configmap.yaml.
#
# CSR round-3 finding #15: every credential value below is one of the $-variables computed once at
# the top of this file (shared with the real Secrets above), NOT an independent lookup-or-random —
# see this file's opening comment for why that's the fix, not just a refactor.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-blueprints-service-clients
type: Opaque
stringData:
  service-clients.yaml: |
    version: 1
    metadata:
      name: Service/automation OAuth2 clients and full human-provider definition
    entries:
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: admin
        attrs:
          name: "Iverson: admin operator scope"
          description: Grants operator-tier access to Iverson's admin endpoints
          expression: "return {}"
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: schema_admin
        attrs:
          name: "Iverson: schema admin scope"
          description: Grants rights to register/redefine entity schemas
          expression: "return {}"
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: groups
        attrs:
          name: "Iverson: group membership"
          description: Exposes the authenticated user's Authentik group names
          # Must return a DICT — a scope mapping's returned mapping is merged into the token's
          # claims, so a bare list emits no "groups" claim and RowFieldAuthorizationEvaluator's
          # FindAll("groups") finds nothing, denying every role-gated read and write.
          expression: 'return {"groups": [group.name for group in user.ak_groups.all()]}'
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: tenant_id
        attrs:
          name: "Iverson: tenant id"
          description: The caller's tenant identifier for data isolation
          expression: 'return {"tenant_id": request.user.attributes.get("tenant_id")}'
{{- if .Values.global.provisionTestIdentities }}
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: tenant_id_loadtest
        attrs:
          name: "Iverson: loadtest tenant id"
          description: Fixed tenant identifier issued to the loadtest service client
          expression: 'return {"tenant_id": "tenant_loadtest"}'
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: tenant_id_webtest
        attrs:
          name: "Iverson: webtest tenant id"
          description: Fixed tenant identifier issued to the webtest service client
          expression: 'return {"tenant_id": "tenant_webtest"}'
{{- end }}
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: tenant_id_admin
        attrs:
          name: "Iverson: admin automation tenant id"
          description: Fixed tenant identifier issued to the admin-automation service client
          expression: 'return {"tenant_id": "tenant_admin"}'
{{- range $name := list "loadtest" "webtest" }}
{{- if $.Values.global.provisionTestIdentities }}
{{- $clientId := index (dict "loadtest" $loadtestClientId "webtest" $webtestClientId) $name }}
{{- $clientSecret := index (dict "loadtest" $loadtestClientSecret "webtest" $webtestClientSecret) $name }}
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-{{ $name }}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: {{ $clientId }}
          client_secret: {{ $clientSecret }}
          redirect_uris: []
          grant_types: ["client_credentials"]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
{{- if eq $name "loadtest" }}
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, schema_admin]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id_loadtest]]
{{- else if eq $name "webtest" }}
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id_webtest]]
{{- end }}
      - model: authentik_core.application
        identifiers:
          slug: iverson-{{ $name }}
        attrs:
          name: iverson-{{ $name }}
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, iverson-{{ $name }}]]
{{- end }}
{{- end }}
      # CSR round-10 #4: nothing uses the bootstrap superuser's API token after first boot, and the
      # chart no longer provisions one; this removes the token an earlier release created.
      - model: authentik_core.token
        state: absent
        identifiers:
          identifier: authentik-bootstrap-token
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-oidc-default
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          # default-provider-invalidation-flow has no stages bound (no UserLogoutStage) -- it's a
          # no-op that never actually ends the Authentik-level browser session, only the app-level
          # OIDC session. default-invalidation-flow is the one with a real UserLogoutStage.
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: public
          redirect_uris:
            - matching_mode: strict
              url: "{{ .Values.global.externalScheme }}://{{ .Values.global.ingressHost }}/admin/callback"
              redirect_uri_type: authorization
{{- if .Values.global.provisionTestIdentities }}
            - matching_mode: strict
              url: "http://localhost:5173/callback"
              redirect_uri_type: authorization
{{- end }}
            - matching_mode: strict
              url: "{{ .Values.global.externalScheme }}://{{ .Values.global.ingressHost }}/admin/"
              redirect_uri_type: logout
{{- if .Values.global.provisionTestIdentities }}
            - matching_mode: strict
              url: "http://localhost:5173/"
              redirect_uri_type: logout
{{- end }}
          client_id: {{ $humanOidcClientId }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
          # CSR round-10 #12: the console never asks for a refresh token (Iverson.AdminUI's
          # AuthProvider requests no offline_access), so this provider issues none.
          grant_types: ["authorization_code"]
          access_token_validity: "hours=1"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id]]
      - model: authentik_core.application
        identifiers:
          slug: iverson-api
        attrs:
          name: iverson-api
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, iverson-oidc-default]]
      # PRODUCTION acting-user OIDC client. Ungated (like iverson-oidc-default above) so
      # Authentication__ActingUser__ValidAudiences__0 has a real audience on EVERY profile, not
      # just when provisionTestIdentities is true. Requests the groups + tenant_id scope mappings
      # the acting-user authorization path requires (RowFieldAuthorizationEvaluator reads the
      # "groups" claim, and tenant isolation reads "tenant_id"). The test-only acting-user client
      # (iverson-loadtest-human) remains gated below.
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-acting-user
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: public
          redirect_uris:
            - matching_mode: strict
              url: "{{ .Values.global.externalScheme }}://{{ .Values.global.ingressHost }}/admin/acting-user/callback"
              redirect_uri_type: authorization
          client_id: {{ $actingUserClientId }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
          grant_types: ["authorization_code", "refresh_token"]
          access_token_validity: "hours=2"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id]]
      - model: authentik_core.application
        identifiers:
          slug: iverson-acting-user
        attrs:
          name: iverson-acting-user
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, iverson-acting-user]]
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          branding_title: "Iverson"
          branding_custom_css: |
            :root, html[data-theme=dark] {
              color-scheme: dark;
              --pf-global--primary-color--100: #006BB6;
              --pf-global--primary-color--200: #006BB6;
              --pf-global--primary-color--300: #006BB6;
              --pf-global--primary-color--dark-100: #006BB6;
              --pf-global--primary-color--light-100: #006BB6;
              --pf-global--secondary-color--100: #ED174C;
              --pf-global--BackgroundColor--100: #141414;
              --pf-global--BackgroundColor--light-100: #141414;
              --pf-global--BackgroundColor--dark-100: #141414;
              --ak-c-login__main--Color: #F5F5F5;
              --pf-global--Color--100: #F5F5F5;
              --pf-global--Color--dark-100: #F5F5F5;
              --ak-dark-background: #010101;
              --ak-dark-background-light: #0A0A0A;
              --ak-dark-background-lighter: #141414;
              --ak-font-family-sans-serif: 'Fraunces', serif;
              --ak-generic-display: 'Fraunces', serif;
            }
            /* branding_logo/branding_default_flow_background are validated FileFields that
               reject arbitrary strings (including data: URIs), so the stock authentik logo
               and background photo are removed here via CSS instead of the Brand model fields. */
            body {
              background-color: #010101 !important;
            }
            body::before {
              background-image: none !important;
            }
            ak-flow-executor::part(branding) {
              display: none !important;
            }
      - model: authentik_flows.flow
        identifiers:
          slug: default-authentication-flow
        attrs:
          title: "Welcome to Iverson!"
      - model: authentik_flows.flow
        identifiers:
          slug: default-source-authentication
        attrs:
          title: "Welcome to Iverson!"
      - model: authentik_flows.flow
        identifiers:
          slug: default-source-enrollment
        attrs:
          title: "Welcome to Iverson! Please select a username."
      - model: authentik_flows.flow
        identifiers:
          slug: initial-setup
        attrs:
          title: "Welcome to Iverson!"
{{- if .Values.global.provisionTestIdentities }}
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-loadtest-human
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          redirect_uris:
            - matching_mode: strict
              url: "https://{{ .Values.global.ingressHost }}/placeholder-callback"
              redirect_uri_type: authorization
          client_id: {{ $loadtestHumanClientId }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
          grant_types: ["authorization_code", "refresh_token"]
          access_token_validity: "hours=2"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id]]
      - model: authentik_core.application
        identifiers:
          slug: iverson-loadtest-human
        attrs:
          name: iverson-loadtest-human
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, iverson-loadtest-human]]
      - model: authentik_core.user
        identifiers:
          username: iverson-acting-user-smoke-test
        attrs:
          username: iverson-acting-user-smoke-test
          name: "Iverson Acting-User Smoke Test"
          email: iverson-acting-user-smoke-test@example.invalid
          password: {{ $smokeTestPassword }}
          is_active: true
          attributes:
            tenant_id: "tenant_smoke_test"
      - model: authentik_core.group
        identifiers:
          name: iverson-loadtest-bypass
        attrs: {}
      - model: authentik_core.user
        identifiers:
          username: iverson-loadtest-bypass-user
        attrs:
          username: iverson-loadtest-bypass-user
          name: "Iverson LoadTest Bypass"
          email: iverson-loadtest-bypass-user@example.invalid
          password: {{ $bypassPassword }}
          is_active: true
          attributes:
            tenant_id: "tenant_bypass"
          groups:
            - !Find [authentik_core.group, [name, iverson-loadtest-bypass]]
{{- end }}
      - model: authentik_core.group
        identifiers:
          name: tenant-admins
        attrs: {}
      # Scoped RBAC role for the iverson-admin-orchestrator service identity. Grants EXACTLY the
      # Authentik Admin API surface Iverson.Api/Tenancy/IdpAdminClient.cs calls, and nothing more.
      # Replaces the former is_superuser: true grant on the orchestrator user.
      #
      # CSR round-3 finding #1 remediation: everything in `permissions` below is a GLOBAL model
      # permission -- it applies to every user/group in the IdP, not just the ones this service
      # created. Round 1 put all eight verbs here, which meant a leaked orchestrator token could
      # reset the password of any account (including `operators` and `authentik Admins` members)
      # and add any user to any group. Only the three verbs that genuinely need to see the whole
      # object space stay global; the account-takeover verbs are now object-scoped (see the
      # initialpermissions entry below), and the two group-membership verbs are gone entirely.
      #
      # What each retained global permission is for, verified against the shipped
      # goauthentik/server:2026.5.3 image's own source (not inferred from docs):
      #   POST /api/v3/core/users/         -> authentik_core.add_user   (creation cannot be
      #                                       object-scoped: the object does not exist yet)
      #   GET  /api/v3/core/users/         -> authentik_core.view_user  (ListUsersByTenantAsync
      #                                       pages the whole user list and filters client-side)
      #   GET  /api/v3/core/groups/?name=  -> authentik_core.view_group (ResolveGroupPkAsync
      #                                       looks up `tenant-admins` by name)
      #
      # DROPPED and why:
      #   authentik_core.change_group           -- dead grant. IdpAdminClient never PATCHes a
      #                                            group; it only GETs one by name. No caller.
      #   authentik_core.add_user_to_group      -- these gate POST /core/groups/{pk}/add_user/
      #   authentik_core.remove_user_from_group    and /remove_user/, and core/api/groups.py's
      #                                            `permission_required` short-circuits on the
      #                                            GLOBAL permission, so holding them means "add
      #                                            ANY user to ANY group" -- including
      #                                            `authentik Admins` (superuser) and
      #                                            `operators`. Note that groups.py's add_user
      #                                            action has NO enable_group_superuser check,
      #                                            unlike the user serializer, so this was a
      #                                            direct path to superuser. IdpAdminClient's
      #                                            AddGroupAsync/RemoveGroupAsync no longer call
      #                                            those endpoints at all -- they now PATCH the
      #                                            user's own `groups` list, which is gated by
      #                                            the object-scoped change_user below AND by
      #                                            authentik's own enable_group_superuser check
      #                                            (which this role does not hold), so a leaked
      #                                            token can neither touch a user it did not
      #                                            create nor move anyone into a superuser group.
      #
      # RESIDUAL, recorded deliberately: `add_user` is global by necessity, and authentik's
      # UserSerializer.validate_groups only refuses NEW members of *superuser* groups. A leaked
      # token can therefore still CREATE a brand-new user directly into a non-superuser group
      # such as `operators`. Closing that needs an authentik-side "add_user scoped to group X"
      # permission, which 2026.5.3 does not have. It is out of scope for this finding, which is
      # about not being able to take over accounts that already exist.
      - model: authentik_rbac.role
        identifiers:
          name: iverson-admin-orchestrator
        attrs:
          permissions:
            - authentik_core.add_user
            - authentik_core.view_user
            - authentik_core.view_group
      # Object-scoping for the two account-takeover verbs. authentik's InitialPermissions model
      # (authentik/rbac/models.py + rbac/middleware.py) hooks post_save for the duration of an
      # API request: when a principal holding `role` creates an object, every permission listed
      # here whose content_type matches that object is assigned to the ROLE **on that object**.
      # So the orchestrator gets change_user + reset_user_password on the users it creates, and
      # on nothing else -- which is exactly the "users this service account created" scope the
      # review asked for, expressed declaratively with no per-object bookkeeping.
      #
      #   PATCH /api/v3/core/users/{id}/          -> authentik_core.change_user
      #                                              (DeactivateUserAsync; AddGroupAsync /
      #                                              RemoveGroupAsync's groups write)
      #   POST  /api/v3/core/users/{id}/recovery/ -> authentik_core.reset_user_password
      #
      # reset_user_password is RE-CONFIRMED, not inherited from round 2's assumption: round 2
      # justified it via /set_password/, a call that no longer exists. The permission is still
      # required because authentik/core/api/users.py decorates the `recovery` action with
      # @permission_required("authentik_core.reset_user_password") -- read directly from the
      # 2026.5.3 image, and exercised live by the AuthentikRecoveryFlowIntegrationTests
      # suite, which asserts /recovery/ succeeds on an orchestrator-created user and is refused
      # on a user it did not create.
      #
      # UPGRADE NOTE: InitialPermissions only fires at creation time, so users provisioned
      # BEFORE this blueprint lands carry no object-level grant and can no longer be deactivated
      # or re-invited by the orchestrator. On a fresh install this is a no-op; on an existing
      # deployment those users need a one-off object-permission assignment (POST
      # /api/v3/rbac/permissions/assigned_by_roles/{role_uuid}/assign with object_pk) or simple
      # re-creation. There is no such deployment today -- this blueprint's recovery flow was
      # first shipped in this same remediation branch.
      - model: authentik_rbac.initialpermissions
        identifiers:
          name: iverson-admin-orchestrator-created-users
        attrs:
          role: !Find [authentik_rbac.role, [name, iverson-admin-orchestrator]]
          permissions:
            - !Find [auth.permission, [codename, change_user], [content_type__app_label, authentik_core]]
            - !Find [auth.permission, [codename, reset_user_password], [content_type__app_label, authentik_core]]
      # RBAC roles bind to groups (not directly to users) in Authentik, so the orchestrator user
      # inherits the scoped role through membership in this group.
      #
      # is_superuser is pinned to false EXPLICITLY rather than just omitted: blueprint attrs are
      # a partial update, so on a release whose database predates the scoped role the group would
      # otherwise keep a stale is_superuser: true and the role below would be decorative.
      - model: authentik_core.group
        identifiers:
          name: iverson-admin-orchestrators
        attrs:
          is_superuser: false
          roles:
            - !Find [authentik_rbac.role, [name, iverson-admin-orchestrator]]
      # CSR round-10 #4 (C2): the API authenticates with its Kubernetes service-account token, which
      # orchestrator-federation.yaml maps to this user. Pre-created here, in the blueprint that never
      # depends on the JWKS relay: a user the token exchange created would get an expiry and no group.
      # No password, so Authentik stores an unusable one. NOT is_superuser: the
      # iverson-admin-orchestrators group binds the scoped role above.
      - model: authentik_core.user
        identifiers:
          username: iverson-admin-orchestrator-workload
        attrs:
          username: iverson-admin-orchestrator-workload
          name: "Iverson Admin Orchestrator (workload identity)"
          email: iverson-admin-orchestrator@example.invalid
          is_active: true
          groups:
            - !Find [authentik_core.group, [name, iverson-admin-orchestrators]]
      # The former static, never-expiring orchestrator token and its password-bearing user. Their
      # Secrets carry resource-policy: keep, so the cutover runbook deletes them after the upgrade.
      - model: authentik_core.token
        state: absent
        identifiers:
          identifier: iverson-admin-orchestrator-token
      - model: authentik_core.user
        state: absent
        identifiers:
          username: iverson-admin-orchestrator
  # CSR round-11 #9: everything admin-automation needs, in one file with no reference to another chart
  # blueprint, because a missing cross-file referent fails a whole file and apply order across files is
  # not guaranteed. Callers exchange a short-lived token of the <release>-admin-automation
  # ServiceAccount (client_credentials with a jwt-bearer client assertion) for a 1-hour Operator token.
  # The client secret is a fresh random value on every render: the assertion grant never checks it, a
  # blank one would leave the client unauthenticated, and the pin policy refuses a secret grant (it
  # carries no assertion). Moved entries keep their identifiers, so they update the existing objects.
  admin-automation.yaml: |
    version: 1
    metadata:
      name: Iverson - admin-automation workload identity
    entries:
      # Every accepted assertion maps to the one pre-created user below. A property mapping applies to
      # its whole source, so admin-automation has its own source rather than sharing the orchestrator's.
      - id: workload-username
        model: authentik_sources_oauth.oauthsourcepropertymapping
        identifiers:
          name: "Iverson: k8s admin-automation username"
        attrs:
          expression: 'return {"username": "iverson-admin-automation-workload"}'
      # Trust anchor only: the cluster's service-account keys, through the worker's JWKS relay.
      - id: k8s-admin-automation-source
        model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: iverson-k8s-admin-automation
        attrs:
          name: iverson-k8s-admin-automation
          provider_type: openidconnect
          enabled: true
          consumer_key: iverson-k8s-admin-automation
          consumer_secret: unused
          authorization_url: ""
          access_token_url: ""
          profile_url: ""
          oidc_jwks_url: http://127.0.0.1:8001/openid/v1/jwks
          user_property_mappings:
            - !KeyOf workload-username
      # Pre-created: a user the token exchange created would get an expiry. No password.
      - model: authentik_core.user
        identifiers:
          username: iverson-admin-automation-workload
        attrs:
          username: iverson-admin-automation-workload
          name: "Iverson admin automation (workload identity)"
          email: iverson-admin-automation@example.invalid
          is_active: true
      # The same three scope mappings service-clients.yaml declares, identical, so this file never
      # waits on that one's apply.
      - id: scope-admin
        model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: admin
        attrs:
          name: "Iverson: admin operator scope"
          description: Grants operator-tier access to Iverson's admin endpoints
          expression: "return {}"
      - id: scope-schema-admin
        model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: schema_admin
        attrs:
          name: "Iverson: schema admin scope"
          description: Grants rights to register/redefine entity schemas
          expression: "return {}"
      - id: scope-tenant-id-admin
        model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: tenant_id_admin
        attrs:
          name: "Iverson: admin automation tenant id"
          description: Fixed tenant identifier issued to the admin-automation service client
          expression: 'return {"tenant_id": "tenant_admin"}'
      - id: admin-automation-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-admin-automation
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: {{ $adminAutoClientId }}
          client_secret: {{ randAlphaNum 64 }}
          redirect_uris: []
          grant_types: ["client_credentials"]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
          access_token_validity: "hours=1"
          property_mappings:
            - !KeyOf scope-admin
            - !KeyOf scope-schema-admin
            - !KeyOf scope-tenant-id-admin
          jwt_federation_sources:
            - !KeyOf k8s-admin-automation-source
      # all, not the default any: both bindings must pass.
      - id: admin-automation-app
        model: authentik_core.application
        identifiers:
          slug: iverson-admin-automation
        attrs:
          name: iverson-admin-automation
          provider: !KeyOf admin-automation-provider
          policy_engine_mode: all
      # CSR round-10 #4: Operator tokens mint only from inside the cluster. The tls-proxy's public
      # listener marks every request it forwards; a request without the marker did not come through
      # the Ingress.
      - id: admin-automation-in-cluster-only
        model: authentik_policies_expression.expressionpolicy
        identifiers:
          name: iverson-admin-automation-in-cluster-only
        attrs:
          expression: |
            return "HTTP_X_IVERSON_PUBLIC_INGRESS" not in request.http_request.META
      # Authentik checks only a federated JWT's signature and expiry. This pins the issuer (CSR round-12
      # §2.6: authentik.serviceAccountIssuer), the ServiceAccount and audience, and bounds the token's
      # lifetime to 600 s (so its usable age too). No pod claim: these tokens are minted with kubectl
      # and are not pod-bound.
      - id: admin-automation-workload
        model: authentik_policies_expression.expressionpolicy
        identifiers:
          name: iverson-admin-automation-workload
        attrs:
          expression: |
            jwt = request.context.get("oauth_jwt") or {}
            aud = jwt.get("aud")
            auds = aud if isinstance(aud, list) else [aud]
            iat = jwt.get("iat")
            exp = jwt.get("exp")
            return (
                jwt.get("iss") == "{{ $issuer }}"
                and jwt.get("sub") == "system:serviceaccount:{{ .Release.Namespace }}:{{ .Release.Name }}-admin-automation"
                and "iverson-authentik-admin-automation" in auds
                and isinstance(iat, int) and isinstance(exp, int)
                and exp - iat <= 600
            )
      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf admin-automation-in-cluster-only
          target: !KeyOf admin-automation-app
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          policy: !KeyOf admin-automation-workload
          target: !KeyOf admin-automation-app
          order: 1
