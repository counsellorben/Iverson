# Public OIDC client-id for the PRODUCTION acting-user identity. Ungated (present on every profile)
# so Authentication__ActingUser__ValidAudiences__0 always has a real audience -- without it the
# acting-user path binds an empty audience list with ValidateAudience=true and every acting-user
# call returns Unauthenticated. A public client has no secret, only a stable client-id.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-acting-user-client
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  client-id: {{ $actingUserClientId | b64enc }}
---
# This blueprint carries credential material -- the iverson-admin-orchestrator API token, OAuth2
# client secrets, and user passwords -- so it is delivered to Authentik's blueprint loader as a
# Secret, NOT a ConfigMap. Kubernetes' stock `view` RBAC role can read ConfigMaps but not Secrets,
# so a ConfigMap carrier would expose the highest-value credential in the stack to a read-only
# principal. The non-secret structural blueprints stay in blueprints-configmap.yaml.
#
# CSR round-3 finding #15: every credential value below is one of the $-variables computed once at
# the top of this file (shared with the real Secrets above), NOT an independent lookup-or-random —
# see this file's opening comment for why that's the fix, not just a refactor.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authentik-blueprints-service-clients
type: Opaque
stringData:
  service-clients.yaml: |
    version: 1
    metadata:
      name: Service/automation OAuth2 clients and full human-provider definition
    entries:
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: admin
        attrs:
          name: "Iverson: admin operator scope"
          description: Grants operator-tier access to Iverson's admin endpoints
          expression: "return {}"
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: schema_admin
        attrs:
          name: "Iverson: schema admin scope"
          description: Grants rights to register/redefine entity schemas
          expression: "return {}"
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: groups
        attrs:
          name: "Iverson: group membership"
          description: Exposes the authenticated user's Authentik group names
          # Must return a DICT — a scope mapping's returned mapping is merged into the token's
          # claims, so a bare list emits no "groups" claim and RowFieldAuthorizationEvaluator's
          # FindAll("groups") finds nothing, denying every role-gated read and write.
          expression: 'return {"groups": [group.name for group in user.ak_groups.all()]}'
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: tenant_id
        attrs:
          name: "Iverson: tenant id"
          description: The caller's tenant identifier for data isolation
          expression: 'return {"tenant_id": request.user.attributes.get("tenant_id")}'
{{- if .Values.global.provisionTestIdentities }}
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: tenant_id_loadtest
        attrs:
          name: "Iverson: loadtest tenant id"
          description: Fixed tenant identifier issued to the loadtest service client
          expression: 'return {"tenant_id": "tenant_loadtest"}'
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: tenant_id_webtest
        attrs:
          name: "Iverson: webtest tenant id"
          description: Fixed tenant identifier issued to the webtest service client
          expression: 'return {"tenant_id": "tenant_webtest"}'
{{- end }}
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          scope_name: tenant_id_admin
        attrs:
          name: "Iverson: admin automation tenant id"
          description: Fixed tenant identifier issued to the admin-automation service client
          expression: 'return {"tenant_id": "tenant_admin"}'
{{- range $name := list "loadtest" "webtest" "admin-automation" }}
{{- if or (eq $name "admin-automation") $.Values.global.provisionTestIdentities }}
{{- $clientId := index (dict "loadtest" $loadtestClientId "webtest" $webtestClientId "admin-automation" $adminAutoClientId) $name }}
{{- $clientSecret := index (dict "loadtest" $loadtestClientSecret "webtest" $webtestClientSecret "admin-automation" $adminAutoClientSecret) $name }}
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-{{ $name }}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: {{ $clientId }}
          client_secret: {{ $clientSecret }}
          redirect_uris: []
          grant_types: ["client_credentials"]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
{{- if eq $name "admin-automation" }}
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, admin]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, schema_admin]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id_admin]]
{{- else if eq $name "loadtest" }}
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, schema_admin]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id_loadtest]]
{{- else if eq $name "webtest" }}
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id_webtest]]
{{- end }}
      - model: authentik_core.application
        identifiers:
          slug: iverson-{{ $name }}
        attrs:
          name: iverson-{{ $name }}
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, iverson-{{ $name }}]]
{{- end }}
{{- end }}
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-oidc-default
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          # default-provider-invalidation-flow has no stages bound (no UserLogoutStage) -- it's a
          # no-op that never actually ends the Authentik-level browser session, only the app-level
          # OIDC session. default-invalidation-flow is the one with a real UserLogoutStage.
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: public
          redirect_uris:
            - matching_mode: strict
              url: "{{ .Values.global.externalScheme }}://{{ .Values.global.ingressHost }}/admin/callback"
              redirect_uri_type: authorization
{{- if .Values.global.provisionTestIdentities }}
            - matching_mode: strict
              url: "http://localhost:5173/callback"
              redirect_uri_type: authorization
{{- end }}
            - matching_mode: strict
              url: "{{ .Values.global.externalScheme }}://{{ .Values.global.ingressHost }}/admin/"
              redirect_uri_type: logout
{{- if .Values.global.provisionTestIdentities }}
            - matching_mode: strict
              url: "http://localhost:5173/"
              redirect_uri_type: logout
{{- end }}
          client_id: {{ $humanOidcClientId }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
          grant_types: ["authorization_code", "refresh_token"]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      - model: authentik_core.application
        identifiers:
          slug: iverson-api
        attrs:
          name: iverson-api
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, iverson-oidc-default]]
      # PRODUCTION acting-user OIDC client. Ungated (like iverson-oidc-default above) so
      # Authentication__ActingUser__ValidAudiences__0 has a real audience on EVERY profile, not
      # just when provisionTestIdentities is true. Requests the groups + tenant_id scope mappings
      # the acting-user authorization path requires (RowFieldAuthorizationEvaluator reads the
      # "groups" claim, and tenant isolation reads "tenant_id"). The test-only acting-user client
      # (iverson-loadtest-human) remains gated below.
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-acting-user
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          client_type: public
          redirect_uris:
            - matching_mode: strict
              url: "{{ .Values.global.externalScheme }}://{{ .Values.global.ingressHost }}/admin/acting-user/callback"
              redirect_uri_type: authorization
          client_id: {{ $actingUserClientId }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
          grant_types: ["authorization_code", "refresh_token"]
          access_token_validity: "hours=2"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id]]
      - model: authentik_core.application
        identifiers:
          slug: iverson-acting-user
        attrs:
          name: iverson-acting-user
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, iverson-acting-user]]
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          branding_title: "Iverson"
          branding_custom_css: |
            :root, html[data-theme=dark] {
              color-scheme: dark;
              --pf-global--primary-color--100: #006BB6;
              --pf-global--primary-color--200: #006BB6;
              --pf-global--primary-color--300: #006BB6;
              --pf-global--primary-color--dark-100: #006BB6;
              --pf-global--primary-color--light-100: #006BB6;
              --pf-global--secondary-color--100: #ED174C;
              --pf-global--BackgroundColor--100: #141414;
              --pf-global--BackgroundColor--light-100: #141414;
              --pf-global--BackgroundColor--dark-100: #141414;
              --ak-c-login__main--Color: #F5F5F5;
              --pf-global--Color--100: #F5F5F5;
              --pf-global--Color--dark-100: #F5F5F5;
              --ak-dark-background: #010101;
              --ak-dark-background-light: #0A0A0A;
              --ak-dark-background-lighter: #141414;
              --ak-font-family-sans-serif: 'Fraunces', serif;
              --ak-generic-display: 'Fraunces', serif;
            }
            /* branding_logo/branding_default_flow_background are validated FileFields that
               reject arbitrary strings (including data: URIs), so the stock authentik logo
               and background photo are removed here via CSS instead of the Brand model fields. */
            body {
              background-color: #010101 !important;
            }
            body::before {
              background-image: none !important;
            }
            ak-flow-executor::part(branding) {
              display: none !important;
            }
      - model: authentik_flows.flow
        identifiers:
          slug: default-authentication-flow
        attrs:
          title: "Welcome to Iverson!"
      - model: authentik_flows.flow
        identifiers:
          slug: default-source-authentication
        attrs:
          title: "Welcome to Iverson!"
      - model: authentik_flows.flow
        identifiers:
          slug: default-source-enrollment
        attrs:
          title: "Welcome to Iverson! Please select a username."
      - model: authentik_flows.flow
        identifiers:
          slug: initial-setup
        attrs:
          title: "Welcome to Iverson!"
{{- if .Values.global.provisionTestIdentities }}
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: iverson-loadtest-human
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          redirect_uris:
            - matching_mode: strict
              url: "https://{{ .Values.global.ingressHost }}/placeholder-callback"
              redirect_uri_type: authorization
          client_id: {{ $loadtestHumanClientId }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          issuer_mode: global
          grant_types: ["authorization_code", "refresh_token"]
          access_token_validity: "hours=2"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, tenant_id]]
      - model: authentik_core.application
        identifiers:
          slug: iverson-loadtest-human
        attrs:
          name: iverson-loadtest-human
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, iverson-loadtest-human]]
      - model: authentik_core.user
        identifiers:
          username: iverson-acting-user-smoke-test
        attrs:
          username: iverson-acting-user-smoke-test
          name: "Iverson Acting-User Smoke Test"
          email: iverson-acting-user-smoke-test@example.invalid
          password: {{ $smokeTestPassword }}
          is_active: true
          attributes:
            tenant_id: "tenant_smoke_test"
      - model: authentik_core.group
        identifiers:
          name: iverson-loadtest-bypass
        attrs: {}
      - model: authentik_core.user
        identifiers:
          username: iverson-loadtest-bypass-user
        attrs:
          username: iverson-loadtest-bypass-user
          name: "Iverson LoadTest Bypass"
          email: iverson-loadtest-bypass-user@example.invalid
          password: {{ $bypassPassword }}
          is_active: true
          attributes:
            tenant_id: "tenant_bypass"
          groups:
            - !Find [authentik_core.group, [name, iverson-loadtest-bypass]]
{{- end }}
      - model: authentik_core.group
        identifiers:
          name: tenant-admins
        attrs: {}
      # Scoped RBAC role for the iverson-admin-orchestrator service identity. Grants EXACTLY the
      # Authentik Admin API surface Iverson.Api/Tenancy/IdpAdminClient.cs calls, and nothing more.
      # Replaces the former is_superuser: true grant on the orchestrator user.
      #
      # CSR round-3 finding #1 remediation: everything in `permissions` below is a GLOBAL model
      # permission -- it applies to every user/group in the IdP, not just the ones this service
      # created. Round 1 put all eight verbs here, which meant a leaked orchestrator token could
      # reset the password of any account (including `operators` and `authentik Admins` members)
      # and add any user to any group. Only the three verbs that genuinely need to see the whole
      # object space stay global; the account-takeover verbs are now object-scoped (see the
      # initialpermissions entry below), and the two group-membership verbs are gone entirely.
      #
      # What each retained global permission is for, verified against the shipped
      # goauthentik/server:2026.5.3 image's own source (not inferred from docs):
      #   POST /api/v3/core/users/         -> authentik_core.add_user   (creation cannot be
      #                                       object-scoped: the object does not exist yet)
      #   GET  /api/v3/core/users/         -> authentik_core.view_user  (ListUsersByTenantAsync
      #                                       pages the whole user list and filters client-side)
      #   GET  /api/v3/core/groups/?name=  -> authentik_core.view_group (ResolveGroupPkAsync
      #                                       looks up `tenant-admins` by name)
      #
      # DROPPED and why:
      #   authentik_core.change_group           -- dead grant. IdpAdminClient never PATCHes a
      #                                            group; it only GETs one by name. No caller.
      #   authentik_core.add_user_to_group      -- these gate POST /core/groups/{pk}/add_user/
      #   authentik_core.remove_user_from_group    and /remove_user/, and core/api/groups.py's
      #                                            `permission_required` short-circuits on the
      #                                            GLOBAL permission, so holding them means "add
      #                                            ANY user to ANY group" -- including
      #                                            `authentik Admins` (superuser) and
      #                                            `operators`. Note that groups.py's add_user
      #                                            action has NO enable_group_superuser check,
      #                                            unlike the user serializer, so this was a
      #                                            direct path to superuser. IdpAdminClient's
      #                                            AddGroupAsync/RemoveGroupAsync no longer call
      #                                            those endpoints at all -- they now PATCH the
      #                                            user's own `groups` list, which is gated by
      #                                            the object-scoped change_user below AND by
      #                                            authentik's own enable_group_superuser check
      #                                            (which this role does not hold), so a leaked
      #                                            token can neither touch a user it did not
      #                                            create nor move anyone into a superuser group.
      #
      # RESIDUAL, recorded deliberately: `add_user` is global by necessity, and authentik's
      # UserSerializer.validate_groups only refuses NEW members of *superuser* groups. A leaked
      # token can therefore still CREATE a brand-new user directly into a non-superuser group
      # such as `operators`. Closing that needs an authentik-side "add_user scoped to group X"
      # permission, which 2026.5.3 does not have. It is out of scope for this finding, which is
      # about not being able to take over accounts that already exist.
      - model: authentik_rbac.role
        identifiers:
          name: iverson-admin-orchestrator
        attrs:
          permissions:
            - authentik_core.add_user
            - authentik_core.view_user
            - authentik_core.view_group
      # Object-scoping for the two account-takeover verbs. authentik's InitialPermissions model
      # (authentik/rbac/models.py + rbac/middleware.py) hooks post_save for the duration of an
      # API request: when a principal holding `role` creates an object, every permission listed
      # here whose content_type matches that object is assigned to the ROLE **on that object**.
      # So the orchestrator gets change_user + reset_user_password on the users it creates, and
      # on nothing else -- which is exactly the "users this service account created" scope the
      # review asked for, expressed declaratively with no per-object bookkeeping.
      #
      #   PATCH /api/v3/core/users/{id}/          -> authentik_core.change_user
      #                                              (DeactivateUserAsync; AddGroupAsync /
      #                                              RemoveGroupAsync's groups write)
      #   POST  /api/v3/core/users/{id}/recovery/ -> authentik_core.reset_user_password
      #
      # reset_user_password is RE-CONFIRMED, not inherited from round 2's assumption: round 2
      # justified it via /set_password/, a call that no longer exists. The permission is still
      # required because authentik/core/api/users.py decorates the `recovery` action with
      # @permission_required("authentik_core.reset_user_password") -- read directly from the
      # 2026.5.3 image, and exercised live by the AuthentikRecoveryFlowIntegrationTests
      # suite, which asserts /recovery/ succeeds on an orchestrator-created user and is refused
      # on a user it did not create.
      #
      # UPGRADE NOTE: InitialPermissions only fires at creation time, so users provisioned
      # BEFORE this blueprint lands carry no object-level grant and can no longer be deactivated
      # or re-invited by the orchestrator. On a fresh install this is a no-op; on an existing
      # deployment those users need a one-off object-permission assignment (POST
      # /api/v3/rbac/permissions/assigned_by_roles/{role_uuid}/assign with object_pk) or simple
      # re-creation. There is no such deployment today -- this blueprint's recovery flow was
      # first shipped in this same remediation branch.
      - model: authentik_rbac.initialpermissions
        identifiers:
          name: iverson-admin-orchestrator-created-users
        attrs:
          role: !Find [authentik_rbac.role, [name, iverson-admin-orchestrator]]
          permissions:
            - !Find [auth.permission, [codename, change_user], [content_type__app_label, authentik_core]]
            - !Find [auth.permission, [codename, reset_user_password], [content_type__app_label, authentik_core]]
      # RBAC roles bind to groups (not directly to users) in Authentik, so the orchestrator user
      # inherits the scoped role through membership in this group.
      #
      # is_superuser is pinned to false EXPLICITLY rather than just omitted: blueprint attrs are
      # a partial update, so on a release whose database predates the scoped role the group would
      # otherwise keep a stale is_superuser: true and the role below would be decorative.
      - model: authentik_core.group
        identifiers:
          name: iverson-admin-orchestrators
        attrs:
          is_superuser: false
          roles:
            - !Find [authentik_rbac.role, [name, iverson-admin-orchestrator]]
      - model: authentik_core.user
        identifiers:
          username: iverson-admin-orchestrator
        attrs:
          username: iverson-admin-orchestrator
          name: "Iverson Admin Orchestrator"
          email: iverson-admin-orchestrator@example.invalid
          password: {{ $adminOrchestratorPassword }}
          is_active: true
          # NOT is_superuser. Least privilege comes from the iverson-admin-orchestrators group,
          # which binds the scoped iverson-admin-orchestrator role above.
          groups:
            - !Find [authentik_core.group, [name, iverson-admin-orchestrators]]
      - model: authentik_core.token
        identifiers:
          identifier: iverson-admin-orchestrator-token
        attrs:
          key: {{ $adminOrchestratorTokenKey }}
          user: !Find [authentik_core.user, [username, iverson-admin-orchestrator]]
          intent: api
          # Non-expiring by design. The token is consumed by the long-running Iverson.Api service
          # (Authentik__AdminToken) and this repo ships no rotation/refresh infrastructure, so an
          # expiring token would silently break tenant provisioning at expiry with nothing to
          # renew it. authentik's Token.expiring defaults to true and, for intent=api, rotates the
          # KEY on expiry (invalidating the fixed key held in the Secret), so this must be set
          # explicitly. ROTATION GAP: rotating this credential currently requires a manual
          # Secret + blueprint update and an Iverson.Api restart; there is no automated rotation.
          expiring: false
