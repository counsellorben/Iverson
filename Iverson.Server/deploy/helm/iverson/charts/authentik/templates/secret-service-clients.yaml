{{- /*
CSR round-3 finding #15: this file used to be two separate template files —
this Secret-emitting file, and blueprints-secret-service-clients.yaml — each
independently doing its own `lookup`-or-`randAlphaNum` for the SAME 10 logical
credentials. Helm renders every templates/*.yaml file as its own root template
execution with no shared scope between files, so on a genuinely fresh install
(no existing Secret for `lookup` to find) each file's independent `randAlphaNum`
call drew a DIFFERENT random value for what was supposed to be one credential —
the Secret handed to the api Deployment didn't match what the blueprint
provisioned in Authentik, and auth failed until a second `helm upgrade`
converged them via `lookup` finding the now-real Secret both sides agreed on
(see docs/runbooks/grpc-admin-auth-cutover.md's former "two-pass helm upgrade
requirement", now obsolete).

Fixed by computing each credential's value exactly ONCE, in ONE file, and
having both consumers (the Secret resources below, and the blueprint Secret's
YAML content further down) reference that single computed value — the only way
to guarantee two Helm-rendered documents actually see the identical value
without either (a) a second render pass Helm doesn't have within one
install/upgrade, since `lookup` only ever sees cluster state from BEFORE this
operation started, or (b) deriving the fallback from public/guessable inputs
(e.g. a hash of .Release.Name), which would make the FIRST-install value of a
`resource-policy: keep` Secret permanently predictable instead of genuinely
random. Merging into one file avoids both: still a real `randAlphaNum` draw on
first install, just drawn once and reused everywhere it's needed.
*/}}
{{- $ns := .Release.Namespace }}
{{- $rel := .Release.Name }}

{{- $loadtestExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-loadtest-client" $rel) }}
{{- $loadtestClientId := "" }}
{{- $loadtestClientSecret := "" }}
{{- if $loadtestExisting }}
{{- $loadtestClientId = index $loadtestExisting.data "client-id" | b64dec }}
{{- $loadtestClientSecret = index $loadtestExisting.data "client-secret" | b64dec }}
{{- else }}
{{- $loadtestClientId = randAlphaNum 40 }}
{{- $loadtestClientSecret = randAlphaNum 50 }}
{{- end }}

{{- $webtestExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-webtest-client" $rel) }}
{{- $webtestClientId := "" }}
{{- $webtestClientSecret := "" }}
{{- if $webtestExisting }}
{{- $webtestClientId = index $webtestExisting.data "client-id" | b64dec }}
{{- $webtestClientSecret = index $webtestExisting.data "client-secret" | b64dec }}
{{- else }}
{{- $webtestClientId = randAlphaNum 40 }}
{{- $webtestClientSecret = randAlphaNum 50 }}
{{- end }}

{{- $adminAutoExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-admin-automation-client" $rel) }}
{{- $adminAutoClientId := "" }}
{{- $adminAutoClientSecret := "" }}
{{- if $adminAutoExisting }}
{{- $adminAutoClientId = index $adminAutoExisting.data "client-id" | b64dec }}
{{- $adminAutoClientSecret = index $adminAutoExisting.data "client-secret" | b64dec }}
{{- else }}
{{- $adminAutoClientId = randAlphaNum 40 }}
{{- $adminAutoClientSecret = randAlphaNum 50 }}
{{- end }}

{{- $humanOidcExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-human-oidc-client" $rel) }}
{{- $humanOidcClientId := "" }}
{{- if $humanOidcExisting }}
{{- $humanOidcClientId = index $humanOidcExisting.data "client-id" | b64dec }}
{{- else }}
{{- $humanOidcClientId = randAlphaNum 40 }}
{{- end }}

{{- $loadtestHumanExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-loadtest-human-client" $rel) }}
{{- $loadtestHumanClientId := "" }}
{{- if $loadtestHumanExisting }}
{{- $loadtestHumanClientId = index $loadtestHumanExisting.data "client-id" | b64dec }}
{{- else }}
{{- $loadtestHumanClientId = randAlphaNum 40 }}
{{- end }}

{{- $smokeTestUserExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-smoke-test-user" $rel) }}
{{- $smokeTestPassword := "" }}
{{- if $smokeTestUserExisting }}
{{- $smokeTestPassword = index $smokeTestUserExisting.data "password" | b64dec }}
{{- else }}
{{- $smokeTestPassword = randAlphaNum 32 }}
{{- end }}

{{- $bypassUserExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-bypass-user" $rel) }}
{{- $bypassPassword := "" }}
{{- if $bypassUserExisting }}
{{- $bypassPassword = index $bypassUserExisting.data "password" | b64dec }}
{{- else }}
{{- $bypassPassword = randAlphaNum 32 }}
{{- end }}

{{- $adminOrchestratorUserExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-admin-orchestrator-user" $rel) }}
{{- $adminOrchestratorPassword := "" }}
{{- if $adminOrchestratorUserExisting }}
{{- $adminOrchestratorPassword = index $adminOrchestratorUserExisting.data "password" | b64dec }}
{{- else }}
{{- $adminOrchestratorPassword = randAlphaNum 32 }}
{{- end }}

{{- $adminOrchestratorTokenExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-admin-orchestrator-token" $rel) }}
{{- $adminOrchestratorTokenKey := "" }}
{{- if $adminOrchestratorTokenExisting }}
{{- $adminOrchestratorTokenKey = index $adminOrchestratorTokenExisting.data "token-key" | b64dec }}
{{- else }}
{{- $adminOrchestratorTokenKey = randAlphaNum 50 }}
{{- end }}

{{- $actingUserExisting := lookup "v1" "Secret" $ns (printf "%s-authentik-acting-user-client" $rel) }}
{{- $actingUserClientId := "" }}
{{- if $actingUserExisting }}
{{- $actingUserClientId = index $actingUserExisting.data "client-id" | b64dec }}
{{- else }}
{{- $actingUserClientId = randAlphaNum 40 }}
{{- end }}
