apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-authentik-worker
  # The writable root filesystems of `migrate` and `worker` are deliberate, as for the server: see deployment-server.yaml.
  annotations:
    kube-score/ignore: container-security-context-readonlyrootfilesystem
spec:
  replicas: 1
  # CSR round-12 §2.1: this pod's `migrate` init container is the release's only migrator, so the
  # old pod is gone before a new one starts and two migrators never overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-authentik-worker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-authentik-worker
    spec:
      serviceAccountName: {{ .Release.Name }}-authentik
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # CSR round-10 #4 (C2): serves the cluster's service-account signing keys (JWKS) on loopback, for
      # the iverson-k8s-workload source in orchestrator-federation.yaml. A native sidecar, so it is
      # listening before the worker applies blueprints. It authenticates with its own projected token
      # (the default issuer-discovery binding lets any service account read the JWKS) and answers only
      # the JWKS path. The startup probe reads /ready/, which kubectl proxy serves from the empty
      # jwks-relay-www volume, so a refusing or unreachable API server delays only federation, never
      # the worker's start. That volume must stay empty: --www is not filtered by --accept-paths.
      initContainers:
        - name: jwks-relay
          image: {{ .Values.jwksRelay.image | quote }}
          restartPolicy: Always
          args:
            - proxy
            - --address=127.0.0.1
            - --port=8001
            - --accept-paths=^/openid/v1/jwks$
            - --reject-methods=^(POST|PUT|PATCH|DELETE)$
            - --www=/www
            - --www-prefix=/ready/
          startupProbe:
            exec: { command: ["kubectl", "--server=http://127.0.0.1:8001", "get", "--raw", "/ready/"] }
            periodSeconds: 1
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: {{ .Values.resources.jwksRelay.requests.cpu | quote }}
              memory: {{ .Values.resources.jwksRelay.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.jwksRelay.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.jwksRelay.limits.cpu | quote }}
              memory: {{ .Values.resources.jwksRelay.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.jwksRelay.limits "ephemeral-storage" | quote }}
          volumeMounts:
            - name: jwks-relay-credential
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: jwks-relay-www
              mountPath: /www
              readOnly: true
        # CSR round-12 §2.1: the ONE process that migrates the authentik database on this release. It
        # moved here from the server Deployment so the server can run more than one replica: this
        # Deployment stays at one replica with strategy Recreate, so two migrators never overlap, and
        # each server pod waits for this pass (deployment-server.yaml's wait-for-migration). The server
        # and worker containers both run with AUTHENTIK_SKIP_MIGRATIONS=true.
        #
        # Why only one: `ak server` and `ak worker` BOTH run lifecycle/migrate.py on startup. That
        # module opens its own psycopg connection, takes pg_advisory_lock(1000) on it, then hands the
        # actual migrating to Django on a SEPARATE connection — while its own connection sits holding
        # an uncommitted implicit transaction from the `SET search_path` and version-history reads it
        # performs between the lock and the Django call. A second migrator's Django connection blocks
        # on a table lock that idle transaction holds, and Postgres cannot report it as a deadlock
        # because the idle backend is not itself waiting on anything. Observed on the compose stack
        # 2026-08-22: the wedge left a PARTIALLY MIGRATED schema that no retry repaired — an index
        # existed with no Django ledger row, every blueprint apply then failed, zero OAuth2 providers
        # were created, and only DROP DATABASE recovered it. An init container has no liveness probe,
        # so nothing restarts it mid-ALTER TABLE, which is one way that corruption is produced.
        #
        # `python -m lifecycle.migrate` is the full sequence: lifecycle/system_migrations/*,
        # `migrate_schemas`, the tenant-template pass, and Django's deploy checks. `ak migrate` is NOT
        # equivalent — the image entrypoint routes it to `manage migrate`, skipping the system
        # migrations and schema passes. The entrypoint is overridden because that routing swallows any
        # bare command. Idempotent: a re-run exits 0 with "No migrations to apply."
        - name: migrate
          image: {{ .Values.image | quote }}
          command: ["python", "-m", "lifecycle.migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-authentik-config
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-app, key: secret-key }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-postgres, key: password }
          resources:
            requests:
              cpu: {{ .Values.resources.worker.requests.cpu | quote }}
              memory: {{ .Values.resources.worker.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.worker.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.worker.limits.cpu | quote }}
              memory: {{ .Values.resources.worker.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.worker.limits "ephemeral-storage" | quote }}
          volumeMounts:
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
      containers:
        - name: worker
          image: {{ .Values.image | quote }}
          args: ["worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-authentik-config
          # Migrations are owned by this pod's `migrate` init container, which has finished before
          # this container starts. The worker process itself must never migrate: two concurrent
          # migrators wedge on an idle-in-transaction backend holding pg_advisory_lock(1000), which
          # Postgres cannot break as a deadlock (see the `migrate` init container above).
          env:
            - name: AUTHENTIK_SKIP_MIGRATIONS
              value: "true"
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-app, key: secret-key }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-postgres, key: password }
          resources:
            requests:
              cpu: {{ .Values.resources.worker.requests.cpu | quote }}
              memory: {{ .Values.resources.worker.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.worker.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.worker.limits.cpu | quote }}
              memory: {{ .Values.resources.worker.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.worker.limits "ephemeral-storage" | quote }}
          # No readiness probe: no Service selects this pod, so readiness would gate no traffic, and
          # repeating the liveness check would only report a hung worker twice.
          livenessProbe:
            exec: { command: ["ak", "healthcheck"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/custom
              readOnly: true
            - name: blueprints-service-clients
              mountPath: /blueprints/custom/service-clients
              readOnly: true
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
      volumes:
        - name: blueprints
          configMap:
            name: {{ .Release.Name }}-authentik-blueprints
        - name: blueprints-service-clients
          secret:
            secretName: {{ .Release.Name }}-authentik-blueprints-service-clients
        - name: jwks-relay-credential
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
        - name: jwks-relay-www
          emptyDir: {}
        - name: postgres-tls
          secret:
            secretName: {{ .Release.Name }}-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
