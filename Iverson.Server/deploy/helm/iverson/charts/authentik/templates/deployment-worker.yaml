apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-authentik-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-authentik-worker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-authentik-worker
    spec:
      serviceAccountName: {{ .Release.Name }}-authentik
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # CSR round-10 #4 (C2): serves the cluster's service-account signing keys (JWKS) on loopback, for
      # the iverson-k8s-workload source in orchestrator-federation.yaml. A native sidecar, so it is
      # listening before the worker applies blueprints. It authenticates with its own projected token
      # (the default issuer-discovery binding lets any service account read the JWKS) and answers only
      # the JWKS path. The startup probe reads /ready/, which kubectl proxy serves from the empty
      # jwks-relay-www volume, so a refusing or unreachable API server delays only federation, never
      # the worker's start. That volume must stay empty: --www is not filtered by --accept-paths.
      initContainers:
        - name: jwks-relay
          image: {{ .Values.jwksRelay.image | quote }}
          restartPolicy: Always
          args:
            - proxy
            - --address=127.0.0.1
            - --port=8001
            - --accept-paths=^/openid/v1/jwks$
            - --reject-methods=^(POST|PUT|PATCH|DELETE)$
            - --www=/www
            - --www-prefix=/ready/
          startupProbe:
            exec: { command: ["kubectl", "--server=http://127.0.0.1:8001", "get", "--raw", "/ready/"] }
            periodSeconds: 1
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: {{ .Values.resources.jwksRelay.requests.cpu | quote }}
              memory: {{ .Values.resources.jwksRelay.requests.memory | quote }}
            limits:
              memory: {{ .Values.resources.jwksRelay.limits.memory | quote }}
          volumeMounts:
            - name: jwks-relay-credential
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: jwks-relay-www
              mountPath: /www
              readOnly: true
      containers:
        - name: worker
          image: {{ .Values.image | quote }}
          args: ["worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-authentik-config
          # Migrations are owned by the server Deployment's `migrate` initContainer. This role must
          # never migrate: two concurrent migrators wedge on an idle-in-transaction backend holding
          # pg_advisory_lock(1000), which Postgres cannot break as a deadlock, and the observed
          # outcome was a partially migrated schema no retry repaired. See deployment-server.yaml.
          #
          # Known trade-off: on a FRESH install this pod may start before migrations finish and
          # crash-loop briefly against an incomplete schema. That is noisy but safe — it never
          # migrates, so it cannot corrupt — and it resolves as soon as the initContainer completes.
          # Gating it on the server's readiness would remove the churn at the cost of coupling the
          # worker's pod start to the server being up.
          env:
            - name: AUTHENTIK_SKIP_MIGRATIONS
              value: "true"
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-app, key: secret-key }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-postgres, key: password }
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-app, key: bootstrap-password }
          resources:
            requests:
              cpu: {{ .Values.resources.worker.requests.cpu | quote }}
              memory: {{ .Values.resources.worker.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.worker.limits.cpu | quote }}
              memory: {{ .Values.resources.worker.limits.memory | quote }}
          readinessProbe:
            exec: { command: ["ak", "healthcheck"] }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec: { command: ["ak", "healthcheck"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/custom
              readOnly: true
            - name: blueprints-service-clients
              mountPath: /blueprints/custom/service-clients
              readOnly: true
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
      volumes:
        - name: blueprints
          configMap:
            name: {{ .Release.Name }}-authentik-blueprints
        - name: blueprints-service-clients
          secret:
            secretName: {{ .Release.Name }}-authentik-blueprints-service-clients
        - name: jwks-relay-credential
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
        - name: jwks-relay-www
          emptyDir: {}
        - name: postgres-tls
          secret:
            secretName: {{ .Release.Name }}-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
