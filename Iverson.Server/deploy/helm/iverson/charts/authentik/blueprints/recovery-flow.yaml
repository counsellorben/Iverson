version: 1
metadata:
  name: Iverson - Recovery flow (admin-initiated password set)
# Provides the recovery flow that IdpAdminClient.CreateUserAsync depends on:
# POST /api/v3/core/users/{id}/recovery/ returns a recovery link ONLY when the
# active brand has flow_recovery set. authentik ships no recovery flow by default,
# so passwordless onboarding fails at runtime ("No recovery flow set.") without this.
#
# This is an admin-link-initiated recovery flow: the recovery token identifies the
# pending user, so no identification or email stage is required. The user sets a new
# password (validated by the password policy), presents the MFA factor they have
# enrolled or enrols TOTP if they have none, and is logged in.
#
# CSR round-3 finding #2 remediation: this flow is bound brand-wide
# (authentik_brands.brand -> flow_recovery below), so it is the recovery flow for EVERY
# account in the IdP, including accounts with TOTP/WebAuthn enrolled by
# mfa-enforcement.yaml. Without an authenticator-validation stage, anyone holding a
# recovery link could set a password and reach an authenticated session without the
# second factor ever being consulted -- the MFA bypass half of the report's worst attack
# chain. iverson-recovery-mfa-validation (order 2, below) closes that.
entries:
  # CSR round-11 #5: configuration_stages below finds the stock TOTP setup stage, which Authentik's own
  # blueprints create in no fixed order relative to this file. Applying that stock blueprint first,
  # inside this file's validation, makes the !Find resolve on every apply, a cold start included.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-authenticator-totp-setup.yaml
      required: true

  # CSR round-3 finding #2, defence-in-depth half: checked 2026-09-13 against the review's
  # stated floor (length_min >= 8 AND zxcvbn_score_threshold >= 2). This policy already met
  # it exactly, so it is left as-is rather than "strengthened" to the same values.
  - id: iverson-recovery-password-policy
    model: authentik_policies_password.passwordpolicy
    identifiers:
      name: iverson-recovery-password-policy
    attrs:
      check_static_rules: true
      check_zxcvbn: true
      length_min: 8
      password_field: password
      zxcvbn_score_threshold: 2
      error_message: Password needs to be 8 characters or longer.

  - id: flow
    model: authentik_flows.flow
    identifiers:
      slug: iverson-recovery
    attrs:
      name: Iverson recovery flow
      title: Set your password
      designation: recovery
      authentication: require_unauthenticated

  # CSR round-12 §2.5: the login throttle. It is defined here, in the document that creates
  # iverson-recovery, so this flow never exists without it (§6, a gate in its target's document: this
  # file applies as a whole or not at all). reputation.yaml binds the same stage to the stock login flow.
  # True when the attempt must be refused, by either rule, for the client address Authentik records:
  # - pair: the rows whose identifier is the pending user's username or email sum to -5 or less;
  # - address: the negative rows sum to -50 or less. Each row is floored at -5, so this needs failures
  #   against at least ten identifiers; fewer accounts are stopped by the pair rule first.
  # A failed identification, password or MFA code lowers its row and a successful login raises it,
  # each by one and within -5..+5 (an unknown username scores at identification too). A row expires
  # an hour after it is created (AUTHENTIK_REPUTATION__EXPIRY).
  - id: login-throttle
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: iverson-login-throttle
    attrs:
      expression: |
        from django.db.models import Sum
        from authentik.policies.reputation.models import Reputation
        ip = str(ak_client_ip)
        user = request.user
        identifiers = [i for i in (getattr(user, "username", None), getattr(user, "email", None)) if i]
        pair = Reputation.objects.filter(ip=ip, identifier__in=identifiers).aggregate(total=Sum("score"))["total"] or 0
        address = Reputation.objects.filter(ip=ip, score__lt=0).aggregate(total=Sum("score"))["total"] or 0
        return pair <= -5 or address <= -50
  - id: login-throttled
    model: authentik_stages_deny.denystage
    identifiers:
      name: iverson-login-throttled
    attrs:
      deny_message: Too many failed attempts. Try again later.
  # A deny stage runs only when its policy passes. Evaluated when the stage is reached
  # (evaluate_on_plan false, re_evaluate_policies true), so it sees the pending user. First, before any
  # prompt, device or password write. Stage-level, not flow-level: a recovery link carries a pre-built
  # plan, which skips flow-level policies.
  - id: recovery-throttle-binding
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf login-throttled
    attrs:
      order: 0
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf login-throttle
      target: !KeyOf recovery-throttle-binding
      order: 0

  - id: prompt-field-password
    model: authentik_stages_prompt.prompt
    identifiers:
      name: iverson-recovery-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      order: 0
      placeholder_expression: false

  - id: prompt-field-password-repeat
    model: authentik_stages_prompt.prompt
    identifiers:
      name: iverson-recovery-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      order: 1
      placeholder_expression: false

  - id: iverson-recovery-prompt
    model: authentik_stages_prompt.promptstage
    identifiers:
      name: iverson-recovery-prompt
    attrs:
      fields:
        - !KeyOf prompt-field-password
        - !KeyOf prompt-field-password-repeat
      validation_policies:
        - !KeyOf iverson-recovery-password-policy

  # Second factor, consulted between "choose a new password" and "write it / log in".
  #
  # CSR round-11 #5: not_configured_action: configure. An account with no device (an invitee, a new
  # tenant admin, the break-glass admin) enrols TOTP here, before its password is written, so the
  # second factor belongs to whoever completes the recovery link. Under the former `skip`, the first
  # password login enrolled it, for whoever signed in first. An account that HAS a TOTP/WebAuthn
  # device must present it before the reset is written, so a leaked recovery link alone is not
  # sufficient.
  #
  # device_classes mirrors mfa-enforcement.yaml's default-authentication-mfa-validation stage
  # exactly (totp + webauthn). That alignment is intentional: the recovery path must accept
  # precisely the factor classes the authentication path enrols, no more (a class listed here but
  # never enrolled is dead weight) and no fewer (a class enrolled there but missing here would make
  # this stage find "no allowed devices" for exactly the users who did enrol a factor).
  #
  # configuration_stages names only the stock TOTP setup stage (the one mfa-enforcement.yaml also
  # offers): with exactly one, Authentik goes straight to it instead of asking which to set up, and
  # LoadTest's recovery client (AuthentikFlowExecutorClient) handles exactly that stage.
  - id: iverson-recovery-mfa-validation
    model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: iverson-recovery-mfa-validation
    attrs:
      not_configured_action: configure
      device_classes:
        - totp
        - webauthn
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]

  - id: iverson-recovery-user-write
    model: authentik_stages_user_write.userwritestage
    identifiers:
      name: iverson-recovery-user-write
    attrs:
      user_creation_mode: never_create

  - id: iverson-recovery-user-login
    model: authentik_stages_user_login.userloginstage
    identifiers:
      name: iverson-recovery-user-login

  # Stage chain: prompt (1) -> MFA validation or TOTP enrolment (2) -> user_write (3) -> user_login (4)
  # -> redirect to the console (5). Order 0 holds the login throttle (above) and, on Helm, the refusal
  # of superusers on the public listener (templates/blueprints-configmap.yaml, superusers.yaml).
  #
  # `order` lives in attrs, NOT in identifiers (authentik's own default blueprints put it in
  # identifiers, but they only ever APPEND stages at sparse orders). Inserting the MFA stage
  # shifted user_write 1->2 and user_login 2->3; with `order` in the identifiers, an existing
  # deployment's `(flow, user_write, order=1)` row would not match `(flow, user_write,
  # order=2)` and the importer would CREATE a second binding rather than move the existing
  # one -- leaving the flow with user_write bound twice. Keying on (target, stage) instead
  # updates the existing row's order in place, so a fresh install and an upgrade converge on
  # the same five bindings.
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf iverson-recovery-prompt
    attrs:
      order: 1

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf iverson-recovery-mfa-validation
    attrs:
      order: 2

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf iverson-recovery-user-write
    attrs:
      order: 3

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf iverson-recovery-user-login
    attrs:
      order: 4

  # CSR round-10 #4/#16: end the flow on the console, not on Authentik's user interface, which the
  # public listener does not serve. Helm renders the profile's console URL in place of this !Env
  # (blueprints-configmap.yaml); compose and the test fixture resolve the default, compose's console.
  - id: iverson-recovery-redirect-console
    model: authentik_stages_redirect.redirectstage
    identifiers:
      name: iverson-recovery-redirect-console
    attrs:
      mode: static
      target_static: !Env [IVERSON_CONSOLE_URL, "http://localhost:5173/"]

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf iverson-recovery-redirect-console
    attrs:
      order: 5

  # Partial update of the existing default brand: attrs carries only flow_recovery,
  # which authentik merges, leaving flow_authentication/flow_invalidation/etc intact.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
      default: true
    attrs:
      flow_recovery: !KeyOf flow
