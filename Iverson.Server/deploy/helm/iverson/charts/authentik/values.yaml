image: "ghcr.io/goauthentik/server:2026.5.3"
tlsProxy:
  # Was digest-pinned; an exact tag lets Dependabot's helm updater (it skips digest pins) track
  # it, trading immutability for automated updates (spec §4d).
  # No docker.io/ prefix: the helm updater would query docker.io as a registry host and fail.
  image: "nginxinc/nginx-unprivileged:1.30.5-alpine"
revokeCrossDb:
  image: "postgres:18.4"
resources:
  server:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }
  worker:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }
  tlsProxy:
    requests: { cpu: "10m", memory: "16Mi" }
    limits: { cpu: "100m", memory: "64Mi" }
nodeSelector: {}
bootstrapEmail: "admin@iverson.local"
ingress:
  className: "nginx"
  annotations: {}
  tlsSecretName: ""
