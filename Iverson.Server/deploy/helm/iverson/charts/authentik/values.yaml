image: "ghcr.io/goauthentik/server:2026.8.5"
tlsProxy:
  # Was digest-pinned; an exact tag lets Dependabot's helm updater (it skips digest pins) track
  # it, trading immutability for automated updates (spec §4d).
  # No docker.io/ prefix: the helm updater would query docker.io as a registry host and fail.
  image: "nginxinc/nginx-unprivileged:1.31.6"
revokeCrossDb:
  image: "postgres:18.6"
# CSR round-10 #4 (C2): the worker's JWKS relay. A nested key named `image`, so Dependabot's helm
# updater tracks it.
jwksRelay:
  image: "registry.k8s.io/kubectl:v1.37.1"
resources:
  server:
    requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "256Mi" }
    limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
  worker:
    requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "256Mi" }
    limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
  tlsProxy:
    requests: { cpu: "10m", memory: "16Mi", ephemeral-storage: "32Mi" }
    limits: { cpu: "500m", memory: "64Mi", ephemeral-storage: "128Mi" }
  jwksRelay:
    requests: { cpu: "10m", memory: "32Mi", ephemeral-storage: "32Mi" }
    limits: { cpu: "100m", memory: "64Mi", ephemeral-storage: "128Mi" }
# CSR round-12 §2.1: Authentik server pods. Above 1, the chart also renders a PodDisruptionBudget
# (templates/pdb.yaml) and preferred host anti-affinity (deployment-server.yaml).
server:
  replicas: 1
nodeSelector: {}
bootstrapEmail: "admin@iverson.local"
# CSR round-12 §2.6: the `iss` of this cluster's service-account tokens. Both workload pins (the
# orchestrator's and admin-automation's) compare it byte for byte, and the render fails while it
# is empty: every overlay sets it.
serviceAccountIssuer: ""
ingress:
  className: "nginx"
  annotations: {}
  tlsSecretName: ""
  # CSR round-11 #5: the cloud edge rate limit on the login path, from the Terraform output of the
  # same name (docs/runbooks/csr11-identity-plane.md). templates/ingress.yaml refuses an empty value
  # for its className's cloud: alb needs wafAclArn (authentik_waf_acl_arn), azure-application-gateway
  # needs wafPolicyId (authentik_waf_policy_id). On GCP the GKE Gateway's GCPBackendPolicy carries
  # securityPolicy (authentik_security_policy_name), which the parent's _validate.tpl requires there.
  wafAclArn: ""
  securityPolicy: ""
  wafPolicyId: ""
  # CSR round-11 #4: on className azure-application-gateway, the name of the Application Gateway
  # trusted root holding this release's <release>-authentik-internal-tls ca.crt. Empty keeps the
  # gateway → Authentik 9080 hop plaintext; set, the tls-proxy serves TLS on 9080. Other classes
  # ignore it (iverson.backendTls in the parent's templates/_helpers.tpl).
  appgwTrustedRootCertificate: ""
