apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-ollama
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-ollama
  annotations:
    # Build inputs for this StatefulSet's image (deploy/kind/build-and-load-image.sh reads them).
    iverson.io/model: {{ .Values.global.generativeModel | quote }}
    iverson.io/model-digest: {{ required "global.generativeModelDigest must pin the full manifest digest (CSR round-2 finding #6)" .Values.global.generativeModelDigest | quote }}
spec:
  serviceName: {{ .Release.Name }}-ollama
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ollama
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ollama
    spec:
      serviceAccountName: {{ .Release.Name }}-ollama
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Release.Name }}-ollama
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ollama
          image: "{{ .Values.global.modelImageRegistry }}iverson-ollama-model:{{ .Values.global.generativeModel | replace ":" "-" | replace "/" "-" }}-{{ trunc 12 .Values.global.generativeModelDigest }}-{{ .Files.Get "model-image/Dockerfile" | sha256sum | trunc 12 }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 11434
          env:
            # The model is baked in at /models (the image's OLLAMA_MODELS); HOME only needs a
            # writable directory for Ollama's key pair.
            - { name: HOME, value: "/tmp" }
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.limits "ephemeral-storage" | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
