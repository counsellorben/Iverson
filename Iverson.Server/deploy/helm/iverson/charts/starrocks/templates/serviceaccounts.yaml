{{- /*
CSR round 12 §4.2: the StarRocks FE and BE pods' service accounts (starrockscluster.yaml's
starRocksFeSpec.serviceAccount and starRocksBeSpec.serviceAccount). They exist for the mesh identity
alone (cluster.local/ns/<namespace>/sa/<name>, which templates/mesh-policies.yaml names), so they mount
no token. The operator turns off token automounting on the pods as well: operator 1.11.5's
pkg/k8sutils/templates/pod/spec.go Spec() sets automountServiceAccountToken: false on every pod it builds.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-starrocks-fe
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-starrocks-be
automountServiceAccountToken: false
