apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-starrocks-create-user
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-starrocks-create-user
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-starrocks-create-user
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      # CSR round 11 #4: the CA that issued FE's certificate (secret-tls.yaml). That Secret is an
      # ordinary release resource, so it exists before this post-install/post-upgrade hook runs.
      volumes:
        - name: starrocks-tls
          secret:
            secretName: {{ .Release.Name }}-starrocks-tls
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: create-user
          image: {{ .Values.createUser.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "128Mi", ephemeral-storage: "256Mi" }
            limits: { cpu: "250m", memory: "256Mi", ephemeral-storage: "512Mi" }
          env:
            - name: ROOT_PW
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-starrocks-app, key: root-password } }
            - name: APP_PW
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-starrocks-app, key: app-password } }
            - name: PROVISIONER_PW
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-starrocks-provisioner, key: password } }
          volumeMounts:
            - name: starrocks-tls
              mountPath: /etc/starrocks-tls
              readOnly: true
          command: ["sh", "-c"]
          args:
            - |
              set -e
              FE_HOST="{{ .Release.Name }}-starrocks-fe-service"
              BE_REPLICAS="{{ .Values.be.replicas }}"
              # CSR round 11 #4: every call requires TLS and verifies FE's certificate against the
              # chart CA and FE_HOST, so the passwords below travel only inside TLS. An FE that
              # does not serve TLS yet (an upgrade before the FE pods restart) counts as not ready.
              # ROOT_HAS_PW is decided only by a connection that completed TLS: while the operator
              # rolls a multi-FE StatefulSet, the FE Service mixes restarted and plaintext pods.
              TLS="--ssl-mode=VERIFY_IDENTITY --ssl-ca=/etc/starrocks-tls/ca.crt"
              # fe: the mysql client with root's login; the password is quoted, never word-split.
              fe() {
                if [ "$ROOT_HAS_PW" = 1 ]; then mysql $TLS -h "$FE_HOST" -P 9030 -u root -p"$ROOT_PW" "$@"
                else mysql $TLS -h "$FE_HOST" -P 9030 -u root "$@"; fi
              }
              until
                if mysql $TLS -h "$FE_HOST" -P 9030 -u root -p"$ROOT_PW" -e "SELECT 1" >/dev/null 2>&1; then
                  ROOT_HAS_PW=1
                elif mysql $TLS -h "$FE_HOST" -P 9030 -u root -e "SELECT 1" >/dev/null 2>&1; then
                  ROOT_HAS_PW=0
                else
                  false
                fi
              do
                echo "waiting for FE..."; sleep 5
              done
              # BE's own entrypoint script registers itself with FE via
              # `mysql -u root` — hardcoded, no password, no way to configure — so changing
              # root's password (below) before every expected BE has joined permanently
              # locks any not-yet-joined BE out of the cluster (it only retries for ~15s
              # before giving up). Wait for BE_REPLICAS backends first, using the same ROOT_HAS_PW
              # so this is idempotent across upgrades where root already has a password.
              until [ "$(fe --skip-column-names --batch -e "SHOW BACKENDS;" 2>/dev/null | wc -l)" -ge "$BE_REPLICAS" ]; do
                echo "waiting for $BE_REPLICAS BE node(s) to register..."; sleep 5
              done
              fe -e "
                SET PASSWORD FOR 'root' = PASSWORD('$ROOT_PW');
                CREATE USER IF NOT EXISTS 'iverson_app'@'%' IDENTIFIED BY '$APP_PW';
                CREATE USER IF NOT EXISTS 'iverson_provisioner'@'%' IDENTIFIED BY '$PROVISIONER_PW';
                CREATE DATABASE IF NOT EXISTS iverson;
                GRANT OPERATE ON SYSTEM TO 'iverson_app'@'%';
                GRANT CREATE DATABASE ON CATALOG default_catalog TO 'iverson_provisioner'@'%';
                GRANT user_admin TO 'iverson_provisioner'@'%';
                REVOKE SELECT, INSERT, UPDATE, DELETE ON iverson.* FROM 'iverson_app'@'%';
                REVOKE CREATE TABLE, DROP, ALTER ON DATABASE iverson FROM 'iverson_app'@'%';
                REVOKE CREATE DATABASE ON CATALOG default_catalog FROM 'iverson_app'@'%';
                REVOKE user_admin FROM 'iverson_app'@'%';
                ALTER USER 'iverson_app' SET PROPERTIES ('session.query_timeout' = '180', 'session.exec_mem_limit' = '4294967296');
              "
              # CSR round 11 §3: two logins. iverson_app runs every query; iverson_provisioner
              # runs only tenant provisioning (EngagementRepository.EnsureTenantProvisionedAsync),
              # and only the worker is given its password.
              # iverson_app keeps one direct grant, OPERATE ON SYSTEM, needed for `SHOW BACKENDS`:
              # /health and every EngagementRepository's readiness gate run it as this user with
              # no role active, and without it they fail with "Access denied; you need (at least
              # one of) the OPERATE OR NODE privilege(s) on SYSTEM", confirmed empirically
              # against a live FE (4.1.1). It holds no tenant role (CSR round 12): see the revoke below.
              # iverson_provisioner holds user_admin and a direct CREATE DATABASE ON CATALOG
              # default_catalog. The catalog privilege must be direct: provisioning runs
              # `CREATE DATABASE IF NOT EXISTS` for each new tenant database, StarRocks checks the
              # privilege before checking whether the database exists, and a role granted to a
              # user is not active until SET ROLE names it.
              # The REVOKEs remove what earlier versions of this job granted iverson_app. A REVOKE
              # of a privilege or role the user does not hold succeeds silently, so they are safe
              # on every run. A database-scoped REVOKE naming a database that does not exist fails
              # and aborts the batch, so `CREATE DATABASE IF NOT EXISTS iverson` stays ahead of
              # them; the database itself is empty and nothing is granted on it.
              # CSR finding #6 (defense-in-depth): session.query_timeout/session.exec_mem_limit
              # cap how long a query may run and how much memory it may use PER QUERY PER BE,
              # cluster-side, as a backstop behind the app-layer output caps in
              # EngagementQueryLimitOptions (page size, aggregation size, GROUP BY/pipeline
              # limit) — those bound what a request may ASK FOR; these bound what StarRocks
              # will actually spend answering it even if some future caller reaches this user
              # without going through the app-layer checks. ALTER USER ... SET PROPERTIES
              # (session.* form) requires StarRocks >= 3.3.3; this chart pins 4.1.1. Values
              # are per-connection session defaults for this user, not global settings — every
              # other tenant/service is unaffected. Idempotent like the GRANTs above: reapplied
              # on every post-install/post-upgrade run of this job.
              # The batch above has just set root's password to ROOT_PW, so every fe call after it
              # must send it: on a fresh FE, ROOT_HAS_PW was 0 until now.
              ROOT_HAS_PW=1
              # CSR round 12 §7.5: iverson_app holds no tenant role any more. Every data
              # connection logs in as its tenant's own login (iverson_t_<suffix>), and
              # provisioning no longer grants the tenant role to iverson_app. This revokes every
              # role an earlier version granted it, hashed and legacy verbatim names alike, by
              # reading them back from SHOW GRANTS: a role grant is a row without " ON " (every
              # privilege grant names its object with ON). `public` is every user's implicit
              # role. It runs here, after the rollout: under `helm upgrade --wait`, no pod of the
              # previous release is left to re-grant a role or to read through one (without
              # --wait, Helm runs this hook as soon as the manifests are applied). Re-running the
              # upgrade re-runs the revoke. A role name outside [A-Za-z0-9_] stops the job
              # instead of being spliced into a statement.
              APP_GRANTS="$(fe --batch --skip-column-names -e "SHOW GRANTS FOR 'iverson_app'@'%';")"
              APP_ROLES="$(printf '%s\n' "$APP_GRANTS" | sed -n "/ ON /d; s/.*GRANT \(.*\) TO .*/\1/p" | tr -d "' \`" | tr ',' '\n')"
              set -f
              for ROLE in $APP_ROLES; do
                case "$ROLE" in
                  public) ;;
                  *[!A-Za-z0-9_]*) echo "unexpected role name granted to iverson_app: $ROLE" >&2; exit 1 ;;
                  *) echo "revoking role $ROLE from iverson_app"; fe -e "REVOKE $ROLE FROM 'iverson_app'@'%';" ;;
                esac
              done
