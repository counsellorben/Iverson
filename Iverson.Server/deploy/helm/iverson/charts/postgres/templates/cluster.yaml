apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  instances: {{ .Values.instances }}
  enableSuperuserAccess: false   # least privilege — api never authenticates as `postgres`, only the app user below
  storage:
    size: {{ .Values.storageSize }}
    storageClass: {{ .Values.storageClassName | quote }}
  resources:
    requests:
      cpu: {{ .Values.resources.requests.cpu | quote }}
      memory: {{ .Values.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.resources.limits.cpu | quote }}
      memory: {{ .Values.resources.limits.memory | quote }}
  affinity:
    nodeSelector:
      {{- toYaml .Values.nodeSelector | nindent 6 }}
    tolerations:
      {{- toYaml .Values.tolerations | nindent 6 }}
  bootstrap:
    initdb:
      database: iverson
      owner: iverson
      # Run once, as superuser, right after initdb. The API's startup (PostgresSchemaManager
      # .EnsureRuntimeRoleAsync) creates the NOLOGIN role `iverson_runtime` and later runs
      # `SET LOCAL ROLE iverson_runtime` for tenant-scoped writes. On docker-compose the app user is
      # the Postgres superuser, so both work implicitly; here enableSuperuserAccess is false and the
      # app user can neither CREATE ROLE (SqlState 42501) nor SET ROLE without membership. Creating
      # the role and granting membership at bootstrap makes the API's own CREATE a no-op.
      # An already-initialised cluster does not re-run this: apply the two statements by hand
      # (`kubectl cnpg psql <release>-postgres -- -d iverson`).
      postInitApplicationSQL:
        - CREATE ROLE iverson_runtime NOLOGIN
        - GRANT iverson_runtime TO iverson
  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: {{ .Release.Name }}-authentik-postgres
  postgresql:
    parameters:
      max_connections: "200"
      # No explicit `ssl` parameter: CNPG's validating webhook now rejects it as a
      # "fixed configuration parameter" — CNPG always enables and manages TLS
      # (cert/key auto-generated and mounted) itself, unconditionally.
