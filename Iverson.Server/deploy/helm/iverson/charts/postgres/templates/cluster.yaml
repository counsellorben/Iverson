apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName | quote }}
  enableSuperuserAccess: false   # least privilege — nothing authenticates as `postgres`: the worker and the hooks use the owner `iverson`, the api uses iverson_api below
  storage:
    size: {{ .Values.storageSize }}
    storageClass: {{ .Values.storageClassName | quote }}
  resources:
    requests:
      cpu: {{ .Values.resources.requests.cpu | quote }}
      memory: {{ .Values.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.resources.limits.cpu | quote }}
      memory: {{ .Values.resources.limits.memory | quote }}
  {{- /* CSR round 12 §4.3 #2: each renders only when non-empty. An empty nodeSelector or tolerations
     differs from the instance pod CNPG builds, so once the operator can read the status port it
     restarts the primary, and keeps restarting it. */}}
  {{- if or .Values.nodeSelector .Values.tolerations }}
  affinity:
    {{- with .Values.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  bootstrap:
    initdb:
      database: iverson
      owner: iverson
      # Run once, as superuser, right after initdb. The worker's startup (PostgresSchemaManager
      # .EnsureRolesAsync) creates two NOLOGIN roles and every entity-table access then runs under
      # one of them via `SET LOCAL ROLE`: `iverson_runtime` for tenant-scoped reads and writes
      # (owns nothing, holds no BYPASSRLS, so the tenant-isolation policy genuinely applies), and
      # `iverson_maintenance` for the deliberately cross-tenant reconciliation and tenant/owner
      # re-derivation paths (BYPASSRLS, since entity tables are now FORCE ROW LEVEL SECURITY and
      # the owner is no longer exempt).
      #
      # On docker-compose the app user is the Postgres superuser, so both creations work
      # implicitly; here enableSuperuserAccess is false and the app user can neither CREATE ROLE
      # (SqlState 42501) nor grant BYPASSRLS nor SET ROLE without membership. Creating both roles
      # and granting membership at bootstrap makes the worker's own CREATEs a no-op.
      #
      # An already-initialised cluster does not re-run this: apply the four statements by hand
      # (`kubectl cnpg psql <release>-postgres -- -d iverson`, as the operators group:
      # docs/runbooks/operators-group.md §2). EnsureRolesAsync fails startup with
      # the exact statement to run rather than a bare 42501 if you forget.
      postInitApplicationSQL:
        - CREATE ROLE iverson_runtime NOLOGIN
        - GRANT iverson_runtime TO iverson
        - CREATE ROLE iverson_maintenance NOLOGIN BYPASSRLS
        - GRANT iverson_maintenance TO iverson
  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: {{ .Release.Name }}-authentik-postgres
      # CSR round 12 §6.1: the api's own login. A member of iverson_runtime, which
      # postInitApplicationSQL above creates at initdb, so it exists before CNPG reconciles this.
      # No BYPASSRLS, no iverson_maintenance, owns nothing. CNPG creates it on an existing cluster
      # too. Its CONNECT and table grants come from the worker at startup, as the database owner.
      - name: iverson_api
        ensure: present
        login: true
        inRoles:
          - iverson_runtime
        passwordSecret:
          name: {{ .Release.Name }}-postgres-api
  postgresql:
    parameters:
      max_connections: "200"
      # No explicit `ssl` parameter: CNPG's validating webhook now rejects it as a
      # "fixed configuration parameter" — CNPG always enables and manages TLS
      # (cert/key auto-generated and mounted) itself, unconditionally.
