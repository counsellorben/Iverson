{{/*
Mirror the security-header block nginx.conf already serves from the admin-ui pod
itself, at the Ingress layer, for the controller classes that support it. There is
no portable response-header annotation across ingress controllers, so each class
gets its own mechanism:
  - nginx: a configuration-snippet using more_set_headers (which replaces rather
    than appends, avoiding duplicate headers) — requires the controller-wide
    `allow-snippet-annotations: true` setting, disabled by default since
    ingress-nginx v1.9. This is NOT an external prerequisite on the kind
    profile: `Iverson.Server/deploy/kind/setup.sh` is where this repo installs
    ingress-nginx, and it now passes `--set controller.allowSnippetAnnotations=true`
    for exactly this reason. On a cloud target that brings its own
    already-running ingress-nginx, the setting is still external to this chart.
  - azure-application-gateway: AGIC's rewrite-rule-set annotation references a
    named rule set; the header text itself cannot live in the annotation, and
    this repo's Terraform does not provision one (the AGIC add-on is enabled in
    `deploy/terraform/modules/cluster-azure/main.tf`, but no
    `azurerm_application_gateway_rewrite_rule_set` exists anywhere in
    `deploy/terraform`). Rather than have this chart provision Azure
    infrastructure, the annotation is opt-in: it is only emitted when
    `ingress.securityHeadersRuleSet` is set to the name of a rule set you have
    provisioned separately. Left at its default (empty), no such annotation is
    rendered and AGIC gets nothing to fail to resolve.
  - alb, gce: neither controller exposes a response-header annotation, so for
    these classes the headers come from the origin (this pod's own nginx) only.
*/}}
{{- $oidcOrigin := printf "%s://authentik.%s" .Values.global.externalScheme .Values.global.ingressHost }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-admin-ui
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq .Values.ingress.className "nginx" }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: no-referrer";
      more_set_headers "Content-Security-Policy: default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' {{ $oidcOrigin }}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
      {{- if eq .Values.global.externalScheme "https" }}
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      {{- end }}
    {{- else if and (eq .Values.ingress.className "azure-application-gateway") .Values.ingress.securityHeadersRuleSet }}
    appgw.ingress.kubernetes.io/rewrite-rule-set: {{ .Values.ingress.securityHeadersRuleSet | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
{{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.global.ingressHost | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
{{- end }}
  rules:
    - host: {{ .Values.global.ingressHost | quote }}
      http:
        paths:
          - path: /admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Release.Name }}-admin-ui
                port:
                  number: 8080
