replicas: 2
image:
  repository: "iverson-admin-ui"
  tag: "0.1.0"   # never "latest" — see Global Constraints
  pullPolicy: IfNotPresent
resources:
  requests: { cpu: "100m", memory: "128Mi" }
  limits: { cpu: "250m", memory: "256Mi" }

# API_BASE_URL has no value here: like OIDC_AUTHORITY, it is composed in the
# template — as admin-api.<global.ingressHost> — so it cannot drift from the
# admin-api Ingress host. Both are built in the template itself
# from global.externalScheme/global.ingressHost — a values-file entry can't
# carry the templated scheme, since Helm never renders values files as templates.

ingress:
  className: ""
  annotations: {}
  tlsSecretName: ""   # set per-environment; empty disables the tls: block (kind only — see values-local.yaml)
