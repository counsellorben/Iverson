replicas: 2
image:
  repository: "iverson-admin-ui"
  tag: "0.1.0"   # never "latest" — see Global Constraints
  pullPolicy: IfNotPresent
resources:
  requests: { cpu: "100m", memory: "128Mi" }
  limits: { cpu: "250m", memory: "256Mi" }

# apiBaseUrl is static per environment (no secret involved) — populated per
# environment in the parent chart's values*.yaml adminUi: block. Default below
# matches the kind profile. OIDC_AUTHORITY is composed in the template itself
# from global.externalScheme/global.ingressHost — a values-file entry can't
# carry the templated scheme, since Helm never renders values files as templates.
apiBaseUrl: "http://iverson.local"

ingress:
  className: ""
  annotations: {}
  tlsSecretName: ""   # set per-environment; empty disables the tls: block (kind only — see values-local.yaml)
