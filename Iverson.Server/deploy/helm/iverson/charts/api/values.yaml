replicas: 2
image:
  repository: "iverson-api"
  tag: "0.1.0"   # never "latest" — see Global Constraints
  pullPolicy: IfNotPresent
resources:
  requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
  limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilization: 70
ingress:
  className: ""
  annotations: {}
  # No `host` key here (CSR round-3 finding #11): charts/api/templates/ingress.yaml
  # templates directly off global.ingressHost — see that file's comment and
  # values.yaml's global.ingressHost comment. This subchart-local default was
  # missed in the first remediation pass even after every umbrella values-*.yaml
  # override was removed; left in place it would have been a silent no-op for
  # any operator who still (harmlessly but confusingly) set it.
  tlsSecretName: ""
# Backs the dedicated admin-api.<global.ingressHost> Ingress (Task 4) — the console's
# JSON/CORS-reachable origin, distinct from the h2c/gRPC host above. No `host` key here:
# the template computes it via printf from global.ingressHost, mirroring
# charts/authentik/templates/ingress.yaml. Defaults to nginx/no-TLS so local and laptop
# (which run ingress-nginx and never override this block) need no values of their own —
# same pattern as charts/authentik/values.yaml's own ingress default.
adminApiIngress:
  className: "nginx"
  annotations: {}
  tlsSecretName: ""
# Whether the admin console exists on this profile. The parent's adminUi.enabled can't be
# read here directly — a subchart sees only its own scope plus .Values.global — so this is
# a separate flag the parent must keep in sync (values-local/-aws/-azure/-gcp set it true;
# values-laptop.yaml, which sets adminUi.enabled: false, leaves it at this default).
#
# When true: the API gets AdminConsole__Origin = <global.externalScheme>://<global.ingressHost>
# (Program.cs's CORS registration) — that's the console's origin because main's admin-ui
# Ingress serves it at global.ingressHost — and the admin-api Ingress
# (templates/admin-api-ingress.yaml) renders admin-api.<global.ingressHost>.
#
# When false: Program.cs registers no CORS policy at all rather than falling back to
# something permissive, so cross-origin calls fail closed; and the admin-api Ingress does
# not render, so a console-less profile does not expose /admin, /health (ANONYMOUS) and
# /v1/traces on a public hostname for nobody to call.
adminConsoleEnabled: false
# CSR round-10 #3: the load-balancer or ingress ranges whose X-Forwarded-For the rate limiters
# trust, and which entry from the right holds the client (2 behind Google's load balancer, which
# appends "<client>,<lb-ip>"). No usable default: every profile sets its own, and
# templates/deployment.yaml fails the render while the list is empty, the same guard
# networkPolicy.clusterCidrs has.
trustedProxies:
  cidrs: []
  hops: 1
