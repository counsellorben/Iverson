{{- $trustedCidrs := dig "trustedProxies" "cidrs" (list) .Values.global }}
{{- if not $trustedCidrs }}
{{- fail "global.trustedProxies.cidrs must list at least one CIDR: the load-balancer or ingress ranges whose X-Forwarded-For the rate limiters and the Authentik tls-proxy trust" }}
{{- end }}
{{- range $trustedCidrs }}
{{- if not (trim .) }}
{{- fail "global.trustedProxies.cidrs contains a blank entry; every entry must be a CIDR" }}
{{- end }}
{{- end }}
{{- $operatorSubjects := dig "operatorSubjects" (list) .Values.global }}
{{- if and (not $operatorSubjects) (eq (dig "externalScheme" "http" .Values.global) "https") }}
{{- fail "global.operatorSubjects must list at least one operator's sub on an https (cloud) profile: the api grants Operator only to the subjects listed there (docs/runbooks/operator-access-onboarding.md)" }}
{{- end }}
{{- range $operatorSubjects }}
{{- if not (trim .) }}
{{- fail "global.operatorSubjects contains a blank entry; every entry must be an operator's sub" }}
{{- end }}
{{- end }}
{{- $backendTls := eq (include "api.backendTls" .) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  annotations:
    # kube-score's "Deployment has PodDisruptionBudget" check can never take its
    # <2-replicas skip path here (Spec.Replicas is always nil on this
    # HPA-controlled Deployment — see comment below), so it still reports
    # CRITICAL on values-local (hpa.minReplicas: 1, no PDB rendered) even though
    # a PDB would be a no-op at a true floor of 1. Harmless on values-aws/azure/gcp,
    # where a real PDB renders and this check passes anyway.
    kube-score/ignore: deployment-has-poddisruptionbudget
spec:
  # No static `replicas:` field here on purpose — this Deployment is HPA-controlled
  # (templates/hpa.yaml). Setting a static replica count on an HPA-targeted
  # Deployment causes Helm upgrades to reset the replica count to that static
  # value on every apply, fighting the autoscaler, and kube-score itself flags
  # that combination as CRITICAL ("Deployment targeted by HPA does not have
  # replicas configured"). One side effect: because `Spec.Replicas` is therefore
  # always nil, kube-score's "Deployment has PodDisruptionBudget" check can never
  # take the <2-replicas skip path it uses for StatefulSets with a static replica
  # count — so on the values-local overlay (hpa.minReplicas: 1, no PDB rendered
  # per templates/pdb.yaml's gate) that check still reports CRITICAL even though
  # a PDB would be a no-op at a true floor of 1. This is an inherent conflict
  # between kube-score's HPA-replicas check and its PDB check for any
  # HPA-controlled Deployment at minReplicas=1 — there is no single Deployment
  # shape that satisfies both checks simultaneously. Left as-is; see
  # helm-hardening-fix-report.md for the trade-off writeup.
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Release.Name }}-api
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8080
              name: grpc
            - containerPort: 8081
              name: http
            # CSR round 12 §3.3: /metrics and /build, for Prometheus only.
            - containerPort: 8082
              name: metrics
          env:
            # CSR round 12 §6.1: the api's own login, iverson_api (charts/postgres: the managed role
            # and <release>-postgres-api). It is not the owner, holds no BYPASSRLS and runs no DDL;
            # the owner's Secret, <release>-postgres-app, is the worker's and the hooks' only.
            - name: POSTGRES_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-api
                  key: password
            - name: ConnectionStrings__Postgres
              # CNPG's own `uri` secret key is a postgresql:// URI, which Npgsql's
              # connection-string parser rejects outright (it only accepts ADO.NET
              # key=value syntax, not libpq-style URIs) — composing it here mirrors the
              # ConnectionStrings__StarRocks pattern below.
              value: "Host={{ .Release.Name }}-postgres-rw;Port=5432;Database=iverson;Username=iverson_api;Password=$(POSTGRES_API_PASSWORD);SSL Mode=VerifyFull;Root Certificate=/etc/postgres-tls/ca.crt"
            {{- if .Values.global.engagementEnabled }}
            - name: STARROCKS_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-starrocks-app
                  key: app-password
            - name: ConnectionStrings__StarRocks
              value: "Server={{ .Release.Name }}-starrocks-fe-service;Port=9030;User Id=iverson_app;Password=$(STARROCKS_APP_PASSWORD);SslMode=VerifyFull;SslCa=/etc/starrocks-tls/ca.crt;"
            # CSR round 12 §7.1: every StarRocks data connection logs in as the caller's tenant,
            # iverson_t_<suffix>, whose password is derived from this key. iverson_app above is
            # left only /health and the readiness probes, and holds no tenant role.
            - name: StarRocks__TenantKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-starrocks-tenant-key
                  key: tenant-key
            {{- end }}
            - name: Engagement__Enabled
              value: {{ .Values.global.engagementEnabled | quote }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-qdrant-api-key
                  key: api-key
            - name: Qdrant__ApiKey
              value: "$(QDRANT_API_KEY)"
            - name: Qdrant__Host
              value: "{{ .Release.Name }}-qdrant"
            - name: Qdrant__Port
              value: "6334"
            - name: Qdrant__CertPath
              value: "/etc/qdrant-tls/cert.pem"
            - name: Kafka__BootstrapServers
              value: "{{ .Release.Name }}-kafka-kafka-bootstrap:9093"
            - name: Kafka__SecurityProtocol
              value: "SASL_SSL"
            - name: Kafka__SaslMechanism
              value: "SCRAM-SHA-512"
            - name: Kafka__SaslUsername
              value: "{{ .Release.Name }}-api"
            - name: Kafka__SaslPassword
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api
                  key: password
            - name: Kafka__SslCaLocation
              value: "/etc/kafka-ca/ca.crt"
            - name: Embeddings__BaseUrl
              value: {{ include "iverson.embeddingBaseUrl" . | quote }}
            {{- include "iverson.embeddingEnv" . | nindent 12 }}
            - name: Enrichment__BaseUrl
              value: "http://{{ .Release.Name }}-ollama:11434"
            - name: Enrichment__ModelId
              value: {{ .Values.global.generativeModel | quote }}
            {{- if .Values.global.tracingEnabled }}
            - name: Otel__Endpoint
              value: "http://{{ .Release.Name }}-jaeger:4317"
            {{- end }}
            {{- range $i, $cidr := $trustedCidrs }}
            - name: RateLimiting__TrustedProxies__Cidrs__{{ $i }}
              value: {{ $cidr | quote }}
            {{- end }}
            - name: RateLimiting__TrustedProxies__Hops
              value: {{ dig "trustedProxies" "hops" 1 .Values.global | quote }}
            # CSR round 12 §2.4: the subjects the api grants Operator (global.operatorSubjects).
            {{- range $i, $subject := $operatorSubjects }}
            - name: Authorization__OperatorSubjects__{{ $i }}
              value: {{ $subject | quote }}
            {{- end }}
            - name: Authentication__Authority
              value: "http://{{ .Release.Name }}-authentik:9000/application/o/iverson-api/"
            - name: Authentication__ExternalIssuer
              value: "{{ .Values.global.externalScheme }}://authentik.{{ .Values.global.ingressHost }}/"
            - name: Authentication__ValidAudiences__0
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-human-oidc-client, key: client-id }
            # The admin console's client id, from the same secret: /v1/traces accepts only its tokens.
            - name: Authentication__ConsoleAudience
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-human-oidc-client, key: client-id }
            {{- if .Values.global.provisionTestIdentities }}
            - name: Authentication__ValidAudiences__1
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-loadtest-client, key: client-id }
            - name: Authentication__ValidAudiences__2
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-webtest-client, key: client-id }
            # Mirrors compose's ValidAudiences__4: LoadTest's data-plane calls carry the tenant admin's
            # token, minted from the loadtest-human client. Renders only where test identities are provisioned.
            - name: Authentication__ValidAudiences__4
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-loadtest-human-client, key: client-id }
            {{- end }}
            - name: Authentication__ValidAudiences__3
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-admin-automation-client, key: client-id }
            - name: Authentication__ActingUser__Authority
              value: "http://{{ .Release.Name }}-authentik:9000/application/o/iverson-api/"
            # Production acting-user audience -- ungated so it renders on every profile. Without
            # this, ActingUser:ValidAudiences binds empty with ValidateAudience=true and every
            # acting-user call returns Unauthenticated on production profiles.
            - name: Authentication__ActingUser__ValidAudiences__0
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-acting-user-client, key: client-id }
            {{- if .Values.global.provisionTestIdentities }}
            - name: Authentication__ActingUser__ValidAudiences__1
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-authentik-loadtest-human-client, key: client-id }
            {{- end }}
            - name: Authentik__BaseUrl
              value: "https://{{ .Release.Name }}-authentik:8443"
            # CSR round-10 #16: the host invited users open recovery links on.
            - name: Authentik__PublicBaseUrl
              value: "{{ .Values.global.externalScheme }}://authentik.{{ .Values.global.ingressHost }}"
            # CSR round-10 #4 (C2): no static Authentik credential. The API exchanges the projected
            # service-account token below for a short-lived access token (AuthentikOrchestratorTokenHandler).
            - name: Authentik__OrchestratorAssertionPath
              value: "/var/run/secrets/iverson/authentik-orchestrator/token"
            - name: Authentik__OrchestratorClientId
              value: "iverson-admin-orchestrator"
            - name: Authentication__MetadataAddress
              value: "https://{{ .Release.Name }}-authentik:8443/application/o/iverson-api/.well-known/openid-configuration"
            - name: Authentication__ActingUser__MetadataAddress
              value: "https://{{ .Release.Name }}-authentik:8443/application/o/iverson-api/.well-known/openid-configuration"
            # The issuer in-cluster minters on 9000 stamp (Authentik's global issuer mode).
            - name: Authentication__InternalIssuer
              value: "http://{{ .Release.Name }}-authentik:9000/"
            - name: Authentik__CaCertificatePath
              value: "/etc/iverson/authentik-ca/ca.crt"
            {{- if .Values.global.tracingEnabled }}
            - name: Jaeger__OtlpHttpUrl
              value: "http://{{ .Release.Name }}-jaeger:4318"
            {{- end }}
            {{- if .Values.adminConsoleEnabled }}
            - name: AdminConsole__Origin
              value: "{{ .Values.global.externalScheme }}://{{ .Values.global.ingressHost }}"
            {{- end }}
            {{- if .Values.global.prometheusEnabled }}
            # The admin console's metrics proxy (/admin/console/metrics — Task 7). The Service
            # name/port are deterministic (charts/prometheus/templates/service.yaml), so no
            # per-profile URL value is needed — only whether the prometheus subchart is installed
            # at all. global.prometheusEnabled is the single source of truth for that (Chart.yaml's
            # subchart condition and both NetworkPolicy rules in templates/networkpolicies.yaml use
            # the same key) — a subchart template can only read its own values plus
            # `.Values.global`, which is why the flag lives under `global` at all.
            - name: Prometheus__BaseUrl
              value: "http://{{ .Release.Name }}-prometheus:9090"
            {{- end }}
            {{- if $backendTls }}
            # CSR round-11 #4: both endpoints serve TLS from <release>-api-internal-tls (the ingress,
            # Prometheus and the kubelet are their only callers). Overrides appsettings.json's http
            # URLs, which compose and local runs keep. All-TLS: a plaintext endpoint beside TLS ones
            # breaks UseHttpsRedirection.
            - name: Kestrel__Endpoints__Grpc__Url
              value: "https://*:8080"
            - name: Kestrel__Endpoints__Grpc__Certificate__Path
              value: "/etc/iverson/api-tls/tls.crt"
            - name: Kestrel__Endpoints__Grpc__Certificate__KeyPath
              value: "/etc/iverson/api-tls/tls.key"
            - name: Kestrel__Endpoints__Http__Url
              value: "https://*:8081"
            - name: Kestrel__Endpoints__Http__Certificate__Path
              value: "/etc/iverson/api-tls/tls.crt"
            - name: Kestrel__Endpoints__Http__Certificate__KeyPath
              value: "/etc/iverson/api-tls/tls.key"
            - name: Kestrel__Endpoints__Metrics__Url
              value: "https://*:8082"
            - name: Kestrel__Endpoints__Metrics__Certificate__Path
              value: "/etc/iverson/api-tls/tls.crt"
            - name: Kestrel__Endpoints__Metrics__Certificate__KeyPath
              value: "/etc/iverson/api-tls/tls.key"
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.limits "ephemeral-storage" | quote }}
          readinessProbe:
            httpGet:
              path: /health
              # 8080 is Http2-only (see appsettings.json's Kestrel:Endpoints:Grpc) — kubelet's
              # probe client speaks HTTP/1.1 and gets rejected with 400. 8081 is the dedicated
              # Http1 endpoint the same /health routes are also mapped to.
              port: 8081
              {{- if $backendTls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8081
              {{- if $backendTls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka-ca
              readOnly: true
            - name: qdrant-tls
              mountPath: /etc/qdrant-tls
              readOnly: true
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
            {{- if .Values.global.engagementEnabled }}
            # CSR round 11 #4: the CA ConnectionStrings__StarRocks verifies FE's certificate with.
            - name: starrocks-tls
              mountPath: /etc/starrocks-tls
              readOnly: true
            {{- end }}
            - name: authentik-ca
              mountPath: /etc/iverson/authentik-ca
              readOnly: true
            - name: authentik-orchestrator-token
              mountPath: /var/run/secrets/iverson/authentik-orchestrator
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $backendTls }}
            - name: api-tls
              mountPath: /etc/iverson/api-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: kafka-ca
          secret:
            secretName: {{ .Release.Name }}-kafka-cluster-ca-cert
        - name: qdrant-tls
          secret:
            secretName: {{ .Release.Name }}-qdrant-tls
            items:
              - key: cert.pem
                path: cert.pem
        - name: postgres-tls
          secret:
            secretName: {{ .Release.Name }}-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
        {{- if .Values.global.engagementEnabled }}
        - name: starrocks-tls
          secret:
            secretName: {{ .Release.Name }}-starrocks-tls
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        - name: authentik-ca
          secret:
            secretName: {{ .Release.Name }}-authentik-internal-tls
            items:
              - key: ca.crt
                path: ca.crt
        # The pod's only Kubernetes credential: audience-scoped, so the API server refuses it.
        - name: authentik-orchestrator-token
          projected:
            sources:
              - serviceAccountToken: { path: token, audience: iverson-authentik-orchestrator, expirationSeconds: 600 }
        - name: tmp
          emptyDir: {}
        {{- if $backendTls }}
        - name: api-tls
          secret:
            secretName: {{ .Release.Name }}-api-internal-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
