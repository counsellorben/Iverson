apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
      {{- /* CSR round 12 §4.5: the GKE Gateway speaks to each port by its appProtocol: HTTP/2 over TLS
         to gRPC, HTTPS to the HTTP/1.1 port. */}}
      {{- if eq (dig "gateway" "class" "" .Values.global) "gke-l7-global-external-managed" }}
      appProtocol: HTTP2
      {{- end }}
    - name: http
      port: 8081
      targetPort: 8081
      {{- if eq (dig "gateway" "class" "" .Values.global) "gke-l7-global-external-managed" }}
      appProtocol: HTTPS
      {{- end }}
    - name: metrics
      port: 8082
      targetPort: 8082
