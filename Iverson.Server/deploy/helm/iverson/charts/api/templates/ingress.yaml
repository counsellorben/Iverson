{{- if not (dig "gateway" "class" "" .Values.global) }}
{{- /* CSR round 12 §4.5: rendered only where the profile's own Ingress class is the edge (AWS's alb,
   Azure's Application Gateway); where global.gateway.class is set, the parent's gateway templates route
   this host instead. */}}
{{- include "iverson.refuseRetiredIngressClass" (dict "label" "api.ingress" "className" .Values.ingress.className) }}
{{- /* CSR round-11 #4, #6: the class's edge → API protocol and port-80 settings (iverson.edgeAnnotations,
   parent templates/_helpers.tpl), merged over the profile's annotations. On Azure the security headers
   admin-ui's own nginx serves are mirrored here through AGIC's rewrite rule set, opt-in via
   ingress.securityHeadersRuleSet (see charts/admin-ui/templates/ingress.yaml); ALB sets no response
   headers. This Ingress serves gRPC, which no browser renders as a document, but the same API is also
   reachable from the browser through grpc-web fetches. */}}
{{- $backendTls := eq (include "api.backendTls" .) "true" }}
{{- $edge := include "iverson.edgeAnnotations" (dict "className" .Values.ingress.className "backendTls" $backendTls "grpc" true "trustedRoot" .Values.ingress.appgwTrustedRootCertificate "host" (printf "%s-api" .Release.Name) "probePort" 8081 "probePath" "/health") | fromYaml }}
{{- $annotations := mergeOverwrite (deepCopy (default dict .Values.ingress.annotations)) $edge }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  annotations:
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (eq .Values.ingress.className "azure-application-gateway") .Values.ingress.securityHeadersRuleSet }}
    appgw.ingress.kubernetes.io/rewrite-rule-set: {{ .Values.ingress.securityHeadersRuleSet | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
{{- /* Templates directly off global.ingressHost (not a separate ingress.host value) —
   CSR round-3 finding #11: a duplicated api.ingress.host used to exist here and could
   drift from global.ingressHost with no enforcement. admin-ui's Ingress template
   already followed this single-source-of-truth pattern; api's now matches it. */}}
{{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.global.ingressHost | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
{{- end }}
  rules:
    - host: {{ .Values.global.ingressHost | quote }}
      http:
        paths:
          - path: /iverson.ObjectMappingService
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8080
          - path: /iverson.ObjectPersistenceService
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8080
          - path: /iverson.ObjectRetrievalService
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8080
          - path: /iverson.ObjectSearchService
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8080
          - path: /iverson.TenantLifecycleGrpcService
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8080
          - path: /iverson.TenantAdminGrpcService
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8080
{{- end }}
