# Azure AKS overlay — StorageClass names and node-pool labels match modules/operators
# and modules/cluster-azure's fixed naming exactly (see Tasks 2 and 4 of this plan).

# modules/cluster-azure's App Gateway (AGIC) subnet. Pods and nodes share 10.1.0.0/20
# (Azure CNI), so they are not admitted. See values.yaml's networkPolicy comment.
networkPolicy:
  clusterCidrs: ["10.1.16.0/24"]
  # The API Server VNet Integration subnet (modules/cluster-azure).
  apiServerCidrs: ["10.1.17.0/28"]

global:
  ingressHost: "iverson.example.com"
  prometheusEnabled: true   # single source of truth — see values.yaml's comment on this flag
  externalScheme: "https"
  # CSR round-10 #3: the Application Gateway subnet (modules/cluster-azure,
  # azurerm_subnet.appgw). It writes "ip:port", which the API accepts.
  trustedProxies:
    cidrs: ["10.1.16.0/24"]
    hops: 1

postgres:
  storageClassName: "iverson-postgres"
  nodeSelector:
    iverson.io/node-pool: postgres
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "postgres"
      effect: "NoSchedule"

kafka:
  storageClassName: "iverson-kafka"
  nodeSelector:
    iverson.io/node-pool: kafka
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "kafka"
      effect: "NoSchedule"

starrocks:
  storageClassName: "iverson-starrocks"
  fe:
    replicas: 3
    nodeSelector:
      iverson.io/node-pool: starrocks-fe
    tolerations:
      - key: "iverson.io/node-pool"
        operator: "Equal"
        value: "starrocks-fe"
        effect: "NoSchedule"
  be:
    nodeSelector:
      iverson.io/node-pool: starrocks-be
    tolerations:
      - key: "iverson.io/node-pool"
        operator: "Equal"
        value: "starrocks-be"
        effect: "NoSchedule"

qdrant:
  storageClassName: "iverson-qdrant"
  nodeSelector:
    iverson.io/node-pool: qdrant
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "qdrant"
      effect: "NoSchedule"

ollama:
  nodeSelector:
    iverson.io/node-pool: ollama
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "ollama"
      effect: "NoSchedule"

tei:
  nodeSelector:
    iverson.io/node-pool: tei
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "tei"
      effect: "NoSchedule"

api:
  ingress:
    className: "azure-application-gateway"
    annotations: {}
    # The gRPC paths on this Ingress still 400 here — AGIC/GCE need their own
    # gRPC-passthrough configuration, not yet done. See
    # docs/specs/2026-09-24-api-ingress-nginx-grpc-design.md.
    # AGIC terminates TLS from a standard Kubernetes Secret referenced via
    # the Ingress's tls: block (the api subchart's Ingress template already
    # renders one whenever tlsSecretName is set) — replace with a real
    # cert-manager-issued Secret name for the real host before applying.
    tlsSecretName: "iverson-api-tls"
    # CSR round-11 #4: name of the gateway trusted root (a key of the Terraform variable
    # appgw_backend_trusted_roots) that signs the API's internal certificate. Empty until the
    # runbook's phase 2; once set, the API's backend hops use TLS. A non-empty value is required
    # on every upgrade after <release>-api-internal-tls exists (docs/runbooks/csr11-transport-network.md).
    appgwTrustedRootCertificate: ""
  adminApiIngress:
    className: "azure-application-gateway"
    annotations: {}
    # A NEW Secret, distinct from iverson-api-tls above — its SAN must cover
    # admin-api.iverson.example.com, a different hostname, or AGIC's TLS handshake
    # fails on a name mismatch. Replace with a real cert-manager-issued Secret name
    # for the real host before applying.
    tlsSecretName: "iverson-admin-api-tls"
  adminConsoleEnabled: true

# worker/prometheus/redis/authentik: none of these get a dedicated node pool in
# modules/cluster-azure (only postgres/kafka/starrocks/qdrant/ollama do — confirmed
# against the Terraform node-pool map) — they land on the untainted "general" pool,
# same as api. Their resources below are unchanged from values.yaml's cloud-agnostic
# defaults; restated explicitly here (rather than left to silent inheritance) so this
# file is self-documenting and matches values-local.yaml's shape. Only authentik's
# bootstrapEmail actually differs from base, to match this environment's real host.
worker:
  replicas: 2
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

prometheus:
  storageSize: "20Gi"
  storageClassName: "iverson-prometheus"
  resources:
    requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
  nodeSelector: {}

redis:
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  nodeSelector: {}

authentik:
  resources:
    server:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
    worker:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
  nodeSelector: {}
  bootstrapEmail: "admin@iverson.example.com"
  ingress:
    className: "azure-application-gateway"
    # AGIC terminates TLS from a standard Kubernetes Secret referenced via
    # the Ingress's tls: block (the authentik subchart's Ingress template
    # already renders one whenever tlsSecretName is set) — replace with a
    # real cert-manager-issued Secret name for the real host before applying.
    tlsSecretName: "iverson-authentik-tls"
    # CSR round-11 #4: as api.ingress.appgwTrustedRootCertificate, for the Authentik pod's root.
    appgwTrustedRootCertificate: ""
    # CSR round-11 #5: Terraform output authentik_waf_policy_id (docs/runbooks/csr11-identity-plane.md).
    wafPolicyId: ""

adminUi:
  ingress:
    className: "azure-application-gateway"
    annotations: {}
    # AGIC terminates TLS from a standard Kubernetes Secret referenced via
    # the Ingress's tls: block, same as api/authentik above — replace with a
    # real cert-manager-issued Secret name for the real host before applying.
    tlsSecretName: "iverson-admin-ui-tls"

jaeger:
  nodeSelector: {}
