# Laptop profile — fits a 4-CPU / 9GB host by omitting what a developer least needs.
# values-local.yaml remains the full-fidelity profile for a >=16GB machine.
#
# SELF-CONTAINED, like every other overlay in this directory. Helm layers only the
# files passed on the command line, so `-f values-laptop.yaml` inherits values.yaml's
# PRODUCTION defaults (postgres 8 CPU x2, qdrant 8, ollama 8) unless the laptop sizing
# is restated here. The CI harness passes exactly one -f per overlay.
#
# Capacity (measured on kind 2026-10-24 on a 4-CPU / 9 GB host, with Istio ambient and its
# gateway): the release requests 1.43 CPU and 4.6 GiB (Ollama included); Istio's istiod, ztunnel,
# istio-cni and gateway 0.23 CPU and 0.4 GiB; Calico, the operators, metrics-server and kube-system
# 1.55 CPU and 1.0 GiB. Total 3.21 of 4.0 allocatable CPU (80%) of requests;
# `kubectl top node` showed 0.87 CPU in use once the release settled. Re-measure with
# `kubectl describe node` and `kubectl top` after deploying.
# The measured pods ran without Strimzi's entity operator and TEI: the full laptop profile, with both,
# saturated a 4-CPU host's 6.5 GB kind node at install, so these numbers are of the profile without them.
#
# kind has no load balancer: the edge gateway's namespace (iverson-edge) is admitted by namespace.
# clusterCidrs must still list at least one range (see values.yaml's networkPolicy comment), so it
# names kind's docker network, which nothing else needs.
networkPolicy:
  clusterCidrs: ["172.18.0.0/16"]
  # kind's node network under docker (172.18.0.0/16) and podman (its default pool,
  # 10.89.0.0/16); the control plane serves on 6443.
  apiServerCidrs: ["172.18.0.0/16", "10.89.0.0/16"]

# CSR round 12 §3.1: kind's operators group. kind's kubeconfig user is not in it, so deploy/kind/setup.sh's
# printed install command and the runbooks impersonate it (docs/runbooks/operators-group.md §1).
admission:
  operatorGroups: ["iverson-operators"]

global:
  engagementEnabled: false   # no StarRocks: vendor sizes FE at 8 CPU/16GB
  tracingEnabled: false      # no jaeger
  prometheusEnabled: false   # single source of truth (Chart.yaml condition, both prometheus
                              # NetworkPolicy rules, and api's Prometheus__BaseUrl env var)
  # One entry, served by the tei subchart. A profile list override REPLACES rather than merges, and
  # activeEmbeddingModel (inherited from values.yaml) must name an entry here. This list must still
  # contain every model any REGISTERED type's stored `_iverson_schema` row names — under TEI,
  # trimming a still-carried entry now surfaces as the API's /info identity guard, not an Ollama 404.
  # revision pins the Hub commit (CSR round-2 finding #6) — see values.yaml's
  # embeddingModels comment.
  embeddingModels:
    - name: BAAI/bge-base-en-v1.5
      slug: bge-base
      revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  # Laptop dev needs the Authentik test identities and legacy tenant seeding the production
  # default (values.yaml) turns off.
  provisionTestIdentities: true
  # CSR round-10 #3, round 12 §4.5: the edge gateway's pod reaches the API from a pod IP in kind's
  # pod CIDR (the tigera operator sizes Calico's pool from kubeadm's podSubnet, kind's default
  # 10.244.0.0/16), and through the mesh the API still sees that address. The gateway appends the
  # client address it saw to X-Forwarded-For, as its last entry. NetworkPolicy admits only the
  # gateway's namespace (iverson-edge) from pod IPs on 8080.
  trustedProxies:
    cidrs: ["10.244.0.0/16"]
    hops: 1
  # CSR round 12 §4.5: the Istio Gateway in iverson-edge (deploy/kind/edge-gateway.yaml) is the edge.
  gateway:
    class: istio

adminUi:
  enabled: false

postgres:
  instances: 1
  storageSize: 2Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

kafka:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

qdrant:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

ollama:
  replicas: 1
  resources:
    # Burst headroom, deliberately above values-local's 500m/2Gi. CPU-only generative
    # inference is slow here — the smoke test measured a two-token reply at 73s wall
    # clock, 55s of it model load. Requests are what the scheduler reserves, so raising
    # the LIMIT costs nothing against the 1.45 CPU budget; it just lets ollama use idle
    # capacity mid-generation instead of being throttled to half a core.
    requests: { cpu: "250m", memory: "2Gi" }
    limits: { cpu: "3", memory: "4Gi" }

tei:
  replicas: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1", memory: "2Gi" }

api:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa: { minReplicas: 1, maxReplicas: 2, targetCPUUtilization: 70 }
  ingress:
    className: "nginx"
    annotations: {}
    tlsSecretName: "iverson-api-tls"

worker:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa: { minReplicas: 1, maxReplicas: 2, targetCPUUtilization: 70 }

authentik:
  # CSR round-12 §2.6: the iss of kind's service-account tokens, which both workload pins compare.
  serviceAccountIssuer: "https://kubernetes.default.svc.cluster.local"
  resources:
    server:
      requests: { cpu: "100m", memory: "256Mi", ephemeral-storage: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi", ephemeral-storage: "1Gi" }
    worker:
      requests: { cpu: "100m", memory: "256Mi", ephemeral-storage: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi", ephemeral-storage: "1Gi" }
