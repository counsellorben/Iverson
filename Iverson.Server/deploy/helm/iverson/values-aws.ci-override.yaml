    wafAclArn: "arn:aws:wafv2:us-east-1:123456789012:regional/webacl/iverson-authentik-login/00000000-0000-0000-0000-000000000000"
    annotations:
      alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000"
adminUi:
  ingress:
    annotations:
      alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000"
