# GCP GKE overlay — StorageClass names and node-pool labels match modules/operators
# and modules/cluster-gcp's fixed naming exactly (see Tasks 2 and 5 of this plan).
# The edge is a GKE Gateway (global.gateway, templates/gateway-gke.yaml): no ingress controller to install.

# GCLB and its health checks connect straight to pod IPs from Google's fixed ranges
# (container-native load balancing). The node subnet is not needed: under the mesh the kubelet's
# probes arrive from 169.254.7.127, which every probed pod's ingress admits
# (templates/networkpolicies.yaml). See values.yaml's networkPolicy comment.
networkPolicy:
  clusterCidrs: ["130.211.0.0/22", "35.191.0.0/16"]
  # modules/cluster-gcp's master_ipv4_cidr_block (private cluster internal endpoint).
  apiServerCidrs: ["172.16.0.0/28"]

# CSR round 12 §3.1: the operators' Google Group (its email address), a member of the
# gke-security-groups group Terraform's rbac_security_group names (Google Groups for RBAC). Set before
# deploying: the render fails while the list is empty.
admission:
  operatorGroups: []

global:
  ingressHost: "iverson.example.com"
  prometheusEnabled: true   # single source of truth — see values.yaml's comment on this flag
  externalScheme: "https"
  # CSR round-11 #19: the model images are published to GHCR by
  # .github/workflows/publish-images.yml (docs/runbooks/csr11-clients-tooling-ci.md).
  modelImageRegistry: "ghcr.io/counsellorben/"
  # CSR round-10 #3: Google's front-end ranges. The load balancer appends "<client>,<lb-ip>", so
  # the client is the second entry from the right.
  trustedProxies:
    cidrs: ["130.211.0.0/22", "35.191.0.0/16"]
    hops: 2
  # CSR round 12 §4.5: a GKE Gateway (global external Application Load Balancer) replaces the four GCE
  # Ingresses, and verifies the api's and Authentik's pod certificates. addressName is the Terraform
  # output gateway_address_name (the Gateway's static address); the render fails while it is empty.
  gateway:
    class: gke-l7-global-external-managed
    addressName: ""

postgres:
  storageClassName: "iverson-postgres"
  nodeSelector:
    iverson.io/node-pool: postgres
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "postgres"
      effect: "NoSchedule"

kafka:
  storageClassName: "iverson-kafka"
  nodeSelector:
    iverson.io/node-pool: kafka
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "kafka"
      effect: "NoSchedule"

starrocks:
  storageClassName: "iverson-starrocks"
  fe:
    replicas: 3
    nodeSelector:
      iverson.io/node-pool: starrocks-fe
    tolerations:
      - key: "iverson.io/node-pool"
        operator: "Equal"
        value: "starrocks-fe"
        effect: "NoSchedule"
  be:
    nodeSelector:
      iverson.io/node-pool: starrocks-be
    tolerations:
      - key: "iverson.io/node-pool"
        operator: "Equal"
        value: "starrocks-be"
        effect: "NoSchedule"

qdrant:
  storageClassName: "iverson-qdrant"
  nodeSelector:
    iverson.io/node-pool: qdrant
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "qdrant"
      effect: "NoSchedule"

ollama:
  nodeSelector:
    iverson.io/node-pool: ollama
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "ollama"
      effect: "NoSchedule"

tei:
  nodeSelector:
    iverson.io/node-pool: tei
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "tei"
      effect: "NoSchedule"

api:
  # CSR round-11 #19: published to GHCR by .github/workflows/publish-images.yml. Set image.tag on
  # every deploy (docs/runbooks/csr11-clients-tooling-ci.md).
  image:
    repository: "ghcr.io/counsellorben/iverson-api"
  ingress:
    annotations: {}
    # The GKE Gateway's HTTPS listener for the main host serves this Secret (with
    # adminUi.ingress.tlsSecretName) — replace with a real cert-manager-issued Secret
    # name for the real host before applying.
    tlsSecretName: "iverson-api-tls"
  adminApiIngress:
    annotations: {}
    # A NEW Secret, distinct from iverson-api-tls above — its SAN must cover
    # admin-api.iverson.example.com, a different hostname, or the Gateway's TLS
    # handshake fails on a name mismatch. Replace with a real cert-manager-issued
    # Secret name for the real host before applying.
    tlsSecretName: "iverson-admin-api-tls"
  adminConsoleEnabled: true

# worker/prometheus/authentik: none of these get a dedicated node pool in
# modules/cluster-gcp (only postgres/kafka/starrocks/qdrant/ollama do — confirmed
# against the Terraform node-pool map) — they land on the untainted "general" pool,
# same as api. Their resources below are unchanged from values.yaml's cloud-agnostic
# defaults; restated explicitly here (rather than left to silent inheritance) so this
# file is self-documenting and matches values-local.yaml's shape. Only authentik's
# bootstrapEmail actually differs from base, to match this environment's real host.
worker:
  image:
    repository: "ghcr.io/counsellorben/iverson-api"   # the api image (api.image above)
  replicas: 2
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

prometheus:
  storageSize: "20Gi"
  storageClassName: "iverson-prometheus"
  resources:
    requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
  nodeSelector: {}

authentik:
  resources:
    server:
      requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "256Mi" }
      limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
    worker:
      requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "256Mi" }
      limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
  nodeSelector: {}
  bootstrapEmail: "admin@iverson.example.com"
  # CSR round-12 §2.6: the iss of this cluster's service-account tokens, which both workload pins
  # compare byte for byte. Terraform output service_account_issuer (modules/cluster-gcp; check it against the
  # cluster's /.well-known/openid-configuration at first deploy); the render fails
  # while it is empty.
  serviceAccountIssuer: ""
  # CSR round-12 §2.1: two server pods, with a PodDisruptionBudget and host anti-affinity.
  server:
    replicas: 2
  ingress:
    # The GKE Gateway's HTTPS listener for authentik.<host> serves this Secret —
    # replace with a real cert-manager-issued Secret name for the real host before
    # applying.
    tlsSecretName: "iverson-authentik-tls"
    # CSR round-11 #5: Terraform output authentik_security_policy_name (docs/runbooks/csr11-identity-plane.md),
    # attached to the Authentik backend by the Gateway's GCPBackendPolicy.
    securityPolicy: ""

adminUi:
  image:
    repository: "ghcr.io/counsellorben/iverson-admin-ui"   # published with the api image
  ingress:
    annotations: {}
    # Served for the main host by the GKE Gateway's HTTPS listener, with
    # api.ingress.tlsSecretName — replace with a real cert-manager-issued Secret
    # name for the real host before applying.
    tlsSecretName: "iverson-admin-ui-tls"

jaeger:
  nodeSelector: {}
