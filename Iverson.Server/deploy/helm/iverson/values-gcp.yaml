# GCP GKE overlay — StorageClass names and node-pool labels match modules/operators
# and modules/cluster-gcp's fixed naming exactly (see Tasks 2 and 5 of this plan).
# No separate ingress controller to install — GKE's built-in GCE ingress class is used directly.

# modules/cluster-gcp's VPC subnet CIDR covers the kubelet (node IPs) but NOT the
# GCE ingress: className is "gce" (below) with VPC-native networking and Dataplane
# V2 enabled (modules/cluster-gcp/main.tf), so GKE Ingress uses container-native
# load balancing — the GCLB and its health checks connect straight to pod IPs from
# Google's own fixed ranges, never from the node subnet. 130.211.0.0/22 and
# 35.191.0.0/16 are those fixed GCLB/health-check ranges (documented by Google for
# every GCP project; not specific to this VPC) and must be listed alongside the
# node subnet or every request through the GCE ingress is dropped and the backend
# health check never passes. AWS/Azure don't need this: their load balancers connect
# from inside the VPC/VNet the node-subnet CIDR already covers. See values.yaml's
# networkPolicy comment for why every profile sets this.
networkPolicy:
  clusterCidrs: ["10.2.0.0/20", "130.211.0.0/22", "35.191.0.0/16"]

# Keep in lockstep with api.ingress.host below — see values.yaml's global.ingressHost
# comment for why this is a separate key instead of a single source of truth.
global:
  ingressHost: "iverson.example.com"
  prometheusEnabled: true   # single source of truth — see values.yaml's comment on this flag

postgres:
  storageClassName: "iverson-postgres"
  nodeSelector:
    iverson.io/node-pool: postgres
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "postgres"
      effect: "NoSchedule"

kafka:
  storageClassName: "iverson-kafka"
  nodeSelector:
    iverson.io/node-pool: kafka
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "kafka"
      effect: "NoSchedule"

starrocks:
  storageClassName: "iverson-starrocks"
  fe:
    replicas: 3
    nodeSelector:
      iverson.io/node-pool: starrocks-fe
    tolerations:
      - key: "iverson.io/node-pool"
        operator: "Equal"
        value: "starrocks-fe"
        effect: "NoSchedule"
  be:
    nodeSelector:
      iverson.io/node-pool: starrocks-be
    tolerations:
      - key: "iverson.io/node-pool"
        operator: "Equal"
        value: "starrocks-be"
        effect: "NoSchedule"

qdrant:
  storageClassName: "iverson-qdrant"
  nodeSelector:
    iverson.io/node-pool: qdrant
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "qdrant"
      effect: "NoSchedule"

ollama:
  storageClassName: "iverson-ollama"
  nodeSelector:
    iverson.io/node-pool: ollama
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "ollama"
      effect: "NoSchedule"

tei:
  storageClassName: "iverson-tei"
  nodeSelector:
    iverson.io/node-pool: tei
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "tei"
      effect: "NoSchedule"

api:
  ingress:
    className: "gce"
    annotations: {}
    host: "iverson.example.com"
    # GCE ingress terminates TLS from a standard Kubernetes Secret
    # referenced via the Ingress's tls: block, same as Azure above — replace
    # with a real cert-manager-issued Secret name for the real host before
    # applying.
    tlsSecretName: "iverson-api-tls"
  adminApiIngress:
    className: "gce"
    annotations: {}
    # A NEW Secret, distinct from iverson-api-tls above — its SAN must cover
    # admin-api.iverson.example.com, a different hostname, or the GCE ingress's TLS
    # handshake fails on a name mismatch. Replace with a real cert-manager-issued
    # Secret name for the real host before applying.
    tlsSecretName: "iverson-admin-api-tls"
  adminConsoleOrigin: "https://iverson.example.com"

# worker/prometheus/redis/authentik: none of these get a dedicated node pool in
# modules/cluster-gcp (only postgres/kafka/starrocks/qdrant/ollama do — confirmed
# against the Terraform node-pool map) — they land on the untainted "general" pool,
# same as api. Their resources below are unchanged from values.yaml's cloud-agnostic
# defaults; restated explicitly here (rather than left to silent inheritance) so this
# file is self-documenting and matches values-local.yaml's shape. Only authentik's
# bootstrapEmail actually differs from base, to match this environment's real host.
worker:
  replicas: 2
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

prometheus:
  imageTag: "v2.55.1"
  storageSize: "20Gi"
  storageClassName: "iverson-prometheus"
  resources:
    requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
  nodeSelector: {}

redis:
  imageTag: "7.4-alpine"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  nodeSelector: {}

authentik:
  imageTag: "2026.5.3"
  resources:
    server:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
    worker:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
  nodeSelector: {}
  bootstrapEmail: "admin@iverson.example.com"
  ingress:
    className: "gce"
    # GCE ingress terminates TLS from a standard Kubernetes Secret
    # referenced via the Ingress's tls: block, same as Azure above — replace
    # with a real cert-manager-issued Secret name for the real host before
    # applying.
    tlsSecretName: "iverson-authentik-tls"

adminUi:
  # https, matching authentik.ingress above — that Ingress sets tlsSecretName, so it
  # renders a tls: block and the GCE ingress terminates TLS for authentik.iverson.example.com.
  # This console is itself an https:// page (adminUi.ingress below sets tlsSecretName
  # too), and an https:// page may not make OIDC calls to an http:// authority — the
  # browser blocks them as mixed content and login never completes. Keep the scheme
  # here in lockstep with authentik.ingress.tlsSecretName.
  oidcAuthority: "https://authentik.iverson.example.com/application/o/iverson-api/"
  apiBaseUrl: "https://admin-api.iverson.example.com"
  ingress:
    className: "gce"
    annotations: {}
    # GCE ingress terminates TLS from a standard Kubernetes Secret
    # referenced via the Ingress's tls: block, same as Azure above — replace
    # with a real cert-manager-issued Secret name for the real host before
    # applying.
    tlsSecretName: "iverson-admin-ui-tls"

jaeger:
  nodeSelector: {}
