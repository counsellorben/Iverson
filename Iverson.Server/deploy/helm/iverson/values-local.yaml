# kind local profile — laptop-sized resources, kind's built-in StorageClass,
# ingress-nginx instead of a cloud LB controller.
#
# tlsSecretName is intentionally left empty here: local dev has no
# cert-manager/ACME issuer, so the api Ingress renders without a tls: block
# and is reached over plain HTTP at https://iverson.local — acceptable only
# because this profile never leaves localhost. Every cloud overlay in the
# companion Terraform plan sets a real tlsSecretName.

# 172.18.0.0/16 is kind's Docker bridge network — the *node* IP range the
# kubelet probes api from, not kind's pod CIDR (10.244.0.0/16) or service CIDR
# (10.96.0.0/12); pod IPs come from Calico's own pool (deploy/kind/setup.sh
# installs it), not this range. See values.yaml's networkPolicy comment for
# why every profile must set this itself.
networkPolicy:
  clusterCidrs: ["172.18.0.0/16"]

global:
  # Restated explicitly even though it matches values.yaml's own default (true) — this profile
  # runs the prometheus subchart (unlike values-laptop.yaml), and Task 7's Prometheus__BaseUrl
  # env var (charts/api/templates/deployment.yaml) is gated on this flag.
  prometheusEnabled: true
  # One entry, served by the tei subchart. A profile list override REPLACES rather than merges, and
  # activeEmbeddingModel (inherited from values.yaml) must name an entry here. This list must still
  # contain every model any REGISTERED type's stored `_iverson_schema` row names — under TEI,
  # trimming a still-carried entry now surfaces as the API's /info identity guard, not an Ollama 404.
  # revision pins the Hub commit (CSR round-2 finding #6) — see values.yaml's
  # embeddingModels comment.
  embeddingModels:
    - name: BAAI/bge-base-en-v1.5
      slug: bge-base
      revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  # Local dev needs the Authentik test identities and legacy tenant seeding the production
  # default (values.yaml) turns off.
  provisionTestIdentities: true

postgres:
  instances: 1
  storageSize: 2Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

kafka:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

# StarRocks dev floor. The vendor sizes FE at 8 CPU / 16GB and BE at 16 CPU / 64GB;
# there is no laptop-viable sizing, so this profile assumes a machine with >=16GB.
# These values are a starting point to confirm empirically, not vendor minimums.
# For a laptop, use values-laptop.yaml, which omits StarRocks entirely.
starrocks:
  storageClassName: "standard"
  fe:
    replicas: 1
    storageSize: 1Gi
    resources:
      requests: { cpu: "1", memory: "4Gi" }
      limits:   { cpu: "2", memory: "6Gi" }
  be:
    replicas: 1
    storageSize: 2Gi
    resources:
      requests: { cpu: "1", memory: "4Gi" }
      limits:   { cpu: "2", memory: "6Gi" }

qdrant:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

ollama:
  replicas: 1
  # ollama renders as a StatefulSet, so this feeds volumeClaimTemplates. Raising it on an
  # existing install will make `helm upgrade` fail (those fields are immutable) — first run
  # `kubectl delete sts iverson-ollama --cascade=orphan` (keeps the pod/PVC), or also delete
  # the PVC for a clean re-pull.
  storageSize: 8Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "500m", memory: "2Gi" }

tei:
  replicas: 1
  # tei renders as a StatefulSet, so this feeds volumeClaimTemplates. Raising it on an
  # existing install will make `helm upgrade` fail (those fields are immutable) — first run
  # `kubectl delete sts iverson-tei-bge-base --cascade=orphan` (keeps the pod/PVC), or also
  # delete the PVC for a clean re-pull.
  storageSize: 2Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1", memory: "2Gi" }

api:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70
  ingress:
    className: "nginx"
    annotations: {}
    tlsSecretName: ""
  # Stated explicitly (even though it matches the api subchart's own nginx/no-TLS
  # default) for the same self-contained-overlay reason api.ingress above is
  # restated in full: an operator reading this file shouldn't have to open
  # charts/api/values.yaml to know what admin-api.iverson.local resolves to.
  adminApiIngress:
    className: "nginx"
    annotations: {}
    tlsSecretName: ""
  adminConsoleOrigin: "http://iverson.local"

worker:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70

jaeger:
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

prometheus:
  storageSize: "2Gi"
  storageClassName: "standard"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

redis:
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "100m", memory: "128Mi" }

authentik:
  resources:
    server:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    worker:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

adminUi:
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "100m", memory: "128Mi" }
  apiBaseUrl: "http://iverson.local"
  ingress:
    className: "nginx"
    annotations: {}
    tlsSecretName: ""
