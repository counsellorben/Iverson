# kind local profile — laptop-sized resources, kind's built-in StorageClass, and an Istio
# gateway (global.gateway.class istio; deploy/kind/setup.sh creates it) instead of a cloud LB
# controller. The chart renders routes for the gateway in place of the four Ingresses, so the
# ingress blocks' className values below are inert here.
#
# api.ingress.tlsSecretName is a self-signed dev cert (deploy/kind/setup.sh generates it), which
# the gateway's HTTPS listener serves for iverson.local: external gRPC clients need HTTP/2 over
# TLS from the first byte. Everything else on this profile stays plain HTTP on the gateway's
# port-80 listeners (admin-api, authentik, and the console under iverson.local/admin).
# global.externalScheme is untouched, still "http".

# kind has no load balancer: the edge gateway's namespace (iverson-edge) is admitted by namespace.
# clusterCidrs must still list at least one range (see values.yaml's networkPolicy comment), so it
# names kind's docker network, which nothing else needs.
networkPolicy:
  clusterCidrs: ["172.18.0.0/16"]
  # kind's node network under docker (172.18.0.0/16) and podman (its default pool,
  # 10.89.0.0/16); the control plane serves on 6443.
  apiServerCidrs: ["172.18.0.0/16", "10.89.0.0/16"]

# CSR round 12 §3.1: kind's operators group. kind's kubeconfig user is not in it, so deploy/kind/setup.sh's
# printed install command and the runbooks impersonate it (docs/runbooks/operators-group.md §1).
admission:
  operatorGroups: ["iverson-operators"]

global:
  # Restated explicitly even though it matches values.yaml's own default (true) — this profile
  # runs the prometheus subchart (unlike values-laptop.yaml), and Task 7's Prometheus__BaseUrl
  # env var (charts/api/templates/deployment.yaml) is gated on this flag.
  prometheusEnabled: true
  # One entry, served by the tei subchart. A profile list override REPLACES rather than merges, and
  # activeEmbeddingModel (inherited from values.yaml) must name an entry here. This list must still
  # contain every model any REGISTERED type's stored `_iverson_schema` row names — under TEI,
  # trimming a still-carried entry now surfaces as the API's /info identity guard, not an Ollama 404.
  # revision pins the Hub commit (CSR round-2 finding #6) — see values.yaml's
  # embeddingModels comment.
  embeddingModels:
    - name: BAAI/bge-base-en-v1.5
      slug: bge-base
      revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  # Local dev needs the Authentik test identities and legacy tenant seeding the production
  # default (values.yaml) turns off.
  provisionTestIdentities: true
  # CSR round-10 #3, round 12 §4.5: the edge gateway's pod reaches the API from a pod IP in kind's
  # pod CIDR (the tigera operator sizes Calico's pool from kubeadm's podSubnet, kind's default
  # 10.244.0.0/16), and through the mesh the API still sees that address. The gateway appends the
  # client address it saw to X-Forwarded-For, as its last entry. NetworkPolicy admits only the
  # gateway's namespace (iverson-edge) from pod IPs on 8080.
  trustedProxies:
    cidrs: ["10.244.0.0/16"]
    hops: 1
  # CSR round 12 §4.5: the Istio Gateway in iverson-edge (deploy/kind/edge-gateway.yaml) is the edge.
  gateway:
    class: istio

postgres:
  instances: 1
  storageSize: 2Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

kafka:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

# StarRocks dev floor. The vendor sizes FE at 8 CPU / 16GB and BE at 16 CPU / 64GB;
# there is no laptop-viable sizing, so this profile assumes a machine with >=16GB.
# These values are a starting point to confirm empirically, not vendor minimums.
# For a laptop, use values-laptop.yaml, which omits StarRocks entirely.
starrocks:
  storageClassName: "standard"
  fe:
    replicas: 1
    storageSize: 1Gi
    resources:
      requests: { cpu: "1", memory: "4Gi" }
      limits:   { cpu: "2", memory: "6Gi" }
  be:
    replicas: 1
    storageSize: 2Gi
    resources:
      requests: { cpu: "1", memory: "4Gi" }
      limits:   { cpu: "2", memory: "6Gi" }

qdrant:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

ollama:
  replicas: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "500m", memory: "2Gi" }

tei:
  replicas: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1", memory: "2Gi" }

api:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70
  ingress:
    className: "nginx"
    annotations: {}
    tlsSecretName: "iverson-api-tls"
  # Stated explicitly (even though it matches the api subchart's own nginx/no-TLS
  # default) for the same self-contained-overlay reason api.ingress above is
  # restated in full: an operator reading this file shouldn't have to open
  # charts/api/values.yaml to know what admin-api.iverson.local resolves to.
  adminApiIngress:
    className: "nginx"
    annotations: {}
    tlsSecretName: ""
  adminConsoleEnabled: true

worker:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70

jaeger:
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

prometheus:
  storageSize: "2Gi"
  storageClassName: "standard"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

authentik:
  # CSR round-12 §2.6: the iss of kind's service-account tokens, which both workload pins compare.
  serviceAccountIssuer: "https://kubernetes.default.svc.cluster.local"
  resources:
    server:
      requests: { cpu: "100m", memory: "256Mi", ephemeral-storage: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi", ephemeral-storage: "1Gi" }
    worker:
      requests: { cpu: "100m", memory: "256Mi", ephemeral-storage: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi", ephemeral-storage: "1Gi" }

adminUi:
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "64Mi", ephemeral-storage: "64Mi" }
    limits: { cpu: "100m", memory: "128Mi", ephemeral-storage: "256Mi" }
  ingress:
    className: "nginx"
    annotations: {}
    tlsSecretName: ""
