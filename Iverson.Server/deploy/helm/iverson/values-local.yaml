# kind local profile — laptop-sized resources, kind's built-in StorageClass,
# ingress-nginx instead of a cloud LB controller.
#
# tlsSecretName is intentionally left empty here: local dev has no
# cert-manager/ACME issuer, so the api Ingress renders without a tls: block
# and is reached over plain HTTP at https://iverson.local — acceptable only
# because this profile never leaves localhost. Every cloud overlay in the
# companion Terraform plan sets a real tlsSecretName.

global:
  # One model only: the PVC is 8Gi and ollama's CPU request is 250m, so a second buys nothing
  # here. A profile list override REPLACES rather than merges, so one entry is sufficient —
  # PROVIDED no registered type's stored schema names a model outside this list. This list
  # must contain every model any registered type's `_iverson_schema` row names, not merely
  # the active one: switching this entry (and activeEmbeddingModel to match) after types are
  # already registered under the old model does not migrate those types — it strands them.
  # Their descriptors still name the old model, Ollama no longer has it pulled, and every
  # embed call against them returns Unavailable/404 until the old model is restored or those
  # types' schema rows and collections are cleared. See the `embeddingModels` comment in the
  # parent chart's values.yaml for the full invariant.
  embeddingModels:
    - name: nomic-embed-text

postgres:
  instances: 1
  storageSize: 2Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

kafka:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

# StarRocks dev floor. The vendor sizes FE at 8 CPU / 16GB and BE at 16 CPU / 64GB;
# there is no laptop-viable sizing, so this profile assumes a machine with >=16GB.
# These values are a starting point to confirm empirically, not vendor minimums.
# For a laptop, use values-laptop.yaml, which omits StarRocks entirely.
starrocks:
  storageClassName: "standard"
  fe:
    replicas: 1
    storageSize: 1Gi
    resources:
      requests: { cpu: "1", memory: "4Gi" }
      limits:   { cpu: "2", memory: "6Gi" }
  be:
    replicas: 1
    storageSize: 2Gi
    resources:
      requests: { cpu: "1", memory: "4Gi" }
      limits:   { cpu: "2", memory: "6Gi" }

qdrant:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

ollama:
  replicas: 1
  # ollama renders as a StatefulSet, so this feeds volumeClaimTemplates. Raising it on an
  # existing install will make `helm upgrade` fail (those fields are immutable) — first run
  # `kubectl delete sts iverson-ollama --cascade=orphan` (keeps the pod/PVC), or also delete
  # the PVC for a clean re-pull.
  storageSize: 8Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "500m", memory: "2Gi" }

api:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70
  ingress:
    className: "nginx"
    annotations: {}
    host: "iverson.local"
    tlsSecretName: ""

worker:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70

jaeger:
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

prometheus:
  storageSize: "2Gi"
  storageClassName: "standard"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

redis:
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "100m", memory: "128Mi" }

authentik:
  resources:
    server:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    worker:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

adminUi:
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "100m", memory: "128Mi" }
  oidcAuthority: "http://authentik.iverson.local/application/o/iverson-api/"
  apiBaseUrl: "http://iverson.local"
  ingress:
    className: "nginx"
    annotations: {}
    tlsSecretName: ""
