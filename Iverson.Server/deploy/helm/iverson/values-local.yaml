# kind local profile — laptop-sized resources, kind's built-in StorageClass,
# ingress-nginx instead of a cloud LB controller.
#
# tlsSecretName is now a real self-signed dev cert (deploy/kind/setup.sh
# generates it), because external gRPC clients need genuine HTTP/2 from the
# first byte, which ingress-nginx never offers over a plaintext connection —
# see docs/specs/2026-09-24-api-ingress-nginx-grpc-design.md. Everything else
# on this profile still stays plain HTTP: admin-api/authentik are on
# different hostnames with no certificate, and admin-ui's Ingress carries its
# own ssl-redirect: "false" annotation to stay off the redirect this
# certificate would otherwise trigger on their shared iverson.local host.
# global.externalScheme is untouched, still "http".

# kind has no load balancer: ingress-nginx is admitted by namespace. clusterCidrs must still
# list at least one range (see values.yaml's networkPolicy comment), so it names kind's docker
# network, which nothing else needs.
networkPolicy:
  clusterCidrs: ["172.18.0.0/16"]
  # kind's node network under docker (172.18.0.0/16) and podman (its default pool,
  # 10.89.0.0/16); the control plane serves on 6443.
  apiServerCidrs: ["172.18.0.0/16", "10.89.0.0/16"]

global:
  # Restated explicitly even though it matches values.yaml's own default (true) — this profile
  # runs the prometheus subchart (unlike values-laptop.yaml), and Task 7's Prometheus__BaseUrl
  # env var (charts/api/templates/deployment.yaml) is gated on this flag.
  prometheusEnabled: true
  # One entry, served by the tei subchart. A profile list override REPLACES rather than merges, and
  # activeEmbeddingModel (inherited from values.yaml) must name an entry here. This list must still
  # contain every model any REGISTERED type's stored `_iverson_schema` row names — under TEI,
  # trimming a still-carried entry now surfaces as the API's /info identity guard, not an Ollama 404.
  # revision pins the Hub commit (CSR round-2 finding #6) — see values.yaml's
  # embeddingModels comment.
  embeddingModels:
    - name: BAAI/bge-base-en-v1.5
      slug: bge-base
      revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  # Local dev needs the Authentik test identities and legacy tenant seeding the production
  # default (values.yaml) turns off.
  provisionTestIdentities: true

postgres:
  instances: 1
  storageSize: 2Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

kafka:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

# StarRocks dev floor. The vendor sizes FE at 8 CPU / 16GB and BE at 16 CPU / 64GB;
# there is no laptop-viable sizing, so this profile assumes a machine with >=16GB.
# These values are a starting point to confirm empirically, not vendor minimums.
# For a laptop, use values-laptop.yaml, which omits StarRocks entirely.
starrocks:
  storageClassName: "standard"
  fe:
    replicas: 1
    storageSize: 1Gi
    resources:
      requests: { cpu: "1", memory: "4Gi" }
      limits:   { cpu: "2", memory: "6Gi" }
  be:
    replicas: 1
    storageSize: 2Gi
    resources:
      requests: { cpu: "1", memory: "4Gi" }
      limits:   { cpu: "2", memory: "6Gi" }

qdrant:
  replicas: 1
  storageSize: 1Gi
  storageClassName: "standard"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

ollama:
  replicas: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "500m", memory: "2Gi" }

tei:
  replicas: 1
  resources:
    requests: { cpu: "250m", memory: "1Gi" }
    limits: { cpu: "1", memory: "2Gi" }

api:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70
  ingress:
    className: "nginx"
    annotations: {}
    tlsSecretName: "iverson-api-tls"
  # Stated explicitly (even though it matches the api subchart's own nginx/no-TLS
  # default) for the same self-contained-overlay reason api.ingress above is
  # restated in full: an operator reading this file shouldn't have to open
  # charts/api/values.yaml to know what admin-api.iverson.local resolves to.
  adminApiIngress:
    className: "nginx"
    annotations: {}
    tlsSecretName: ""
  adminConsoleEnabled: true
  # CSR round-10 #3: ingress-nginx reaches the API from a pod IP in kind's pod CIDR (the tigera
  # operator sizes Calico's pool from kubeadm's podSubnet, kind's default 10.244.0.0/16), and its
  # defaults replace X-Forwarded-For with the address it saw. NetworkPolicy admits only the
  # ingress-nginx namespace from pod IPs on 8080.
  trustedProxies:
    cidrs: ["10.244.0.0/16"]
    hops: 1

worker:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 70

jaeger:
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

prometheus:
  storageSize: "2Gi"
  storageClassName: "standard"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

redis:
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "100m", memory: "128Mi" }

authentik:
  resources:
    server:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
    worker:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "512Mi" }

adminUi:
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "100m", memory: "128Mi" }
  ingress:
    className: "nginx"
    annotations: {}
    tlsSecretName: ""
