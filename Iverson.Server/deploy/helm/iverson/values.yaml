# Cloud-agnostic defaults. Cloud/environment identity (StorageClass names,
# ingress class/annotations, node-selector labels) is intentionally left
# empty/unset here — it is supplied by values-local.yaml (this plan) or
# values-{aws,azure,gcp}.yaml (companion Terraform plan), never hardcoded
# in a subchart template.
#
# networkPolicy.enabled gates the default-deny NetworkPolicy baseline
# (templates/networkpolicies.yaml) plus every per-component allow rule in
# the subcharts below. Leave this true unless the target cluster's CNI
# cannot enforce NetworkPolicy at all — disabling it removes network
# segmentation entirely rather than degrading gracefully, so treat "false"
# as an explicit, logged exception, not a default anyone should ship with.
networkPolicy:
  enabled: true

# global values are visible to every subchart (unlike top-level keys like `api:`,
# which are scoped only to the matching subchart) — used here so the authentik
# subchart's blueprint (the human OIDC provider's redirect_uri) AND the api
# subchart's Ingress (charts/api/templates/ingress.yaml) both reference this one
# hostname directly, with no separate api.ingress.host to fall out of lockstep
# (CSR round-3 finding #11 — a values.yaml/values-*.yaml duplicate of this key used
# to exist and had no enforcement against drifting).
global:
  ingressHost: "iverson.local"
  # Scheme alone (http/https), not a URL and not an origin — templated onto the
  # external-facing URLs (OIDC authority, external issuer, redirect URIs) that a
  # values file cannot compose itself, since Helm never renders values files as
  # templates. Default matches the kind/local profile; cloud profiles set "https".
  externalScheme: "http"
  # The generative model used for ingest enrichment. Lives under `global` (not under
  # `ollama:`) because two subcharts must agree on it: the ollama subchart PULLS it, and
  # the api/worker subcharts REQUEST it via Enrichment__ModelId. Scoping it to one subchart
  # would let the pulled model and the requested model drift apart, which fails at runtime
  # with a 404 from Ollama on every generative call.
  generativeModel: "qwen2.5:3b"
  # Pins the model-registry pull above (CSR round-2 finding #6): the ollama subchart's
  # pull-model initContainer pulls the floating tag "qwen2.5:3b" (registry.ollama.ai has no
  # supported CLI/API syntax to pull by digest directly — Ollama's own model-name parser
  # documents digest support as removed pending a future re-add), so instead it verifies the
  # digest the registry actually served against this pinned value and refuses to start on a
  # mismatch. This is the manifest digest reported by the registry for "qwen2.5:3b" as of
  # 2026-09-10 (also the short ID `ollama list` reports locally): confirmed against
  # registry.ollama.ai/v2/library/qwen2.5/manifests/3b (Ollama-Content-Digest response
  # header). Bump this deliberately if the upstream tag is ever intentionally re-pointed.
  generativeModelDigest: "357c53fb659c5076de1d65ccb0b397446227b71a42be9d1603d46168015c9e4b"
  # Every entry is served by the tei subchart (one StatefulSet + headless Service per entry). `slug`
  # is the DNS-safe suffix of that entry's objects: <release>-tei-<slug>. The prefix keys stay
  # three-state (omitted = derive from the model family; "" = deliberately none).
  # This list must still contain every model any REGISTERED type's stored `_iverson_schema`
  # row names, not merely the active one — under TEI, trimming a still-carried entry now
  # surfaces as the API's /info identity guard, not an Ollama 404.
  #
  # `revision` pins the model-registry pull (CSR round-2 finding #6): TEI's `--model-id` names
  # only org/repo, a floating pointer the Hub owner can repoint at any time — `revision` passes
  # TEI's own `--revision` flag (an exact commit SHA, not a branch/tag) so the weights actually
  # served are the ones this value names. Confirmed against
  # huggingface.co/api/models/<name> ("sha" field) as of 2026-09-10.
  embeddingModels:
    - name: BAAI/bge-base-en-v1.5
      slug: bge-base
      revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  # The default model api and worker request for any registered type that does not declare its
  # own. Must name an entry above; a mismatch renders cleanly and surfaces as an identity mismatch
  # from the backend's /info naming the unpulled model on the first embed call, not at deploy.
  activeEmbeddingModel: BAAI/bge-base-en-v1.5
  # Drives the starrocks subchart's condition AND the api/worker env guards AND
  # Engagement__Enabled. One flag, because two flags that must agree can disagree —
  # and the disagreeing state renders a secretKeyRef against a Secret that no longer
  # exists. Same reasoning as generativeModel above.
  engagementEnabled: true
  # Drives the jaeger subchart's condition AND the api/worker OTLP env vars.
  tracingEnabled: true
  # Gates the Authentik blueprint's dev-only test identities (smoke-test user, loadtest-bypass
  # user/group, loadtest/webtest service clients, the loadtest-human provider, and the
  # localhost:5173 redirect URIs) AND Tenancy__SeedLegacyTenants (the five-tenant legacy seeding
  # loop in Program.cs). Default false so no production install provisions test credentials or
  # seeds placeholder tenants; values-local.yaml and values-laptop.yaml set this true.
  provisionTestIdentities: false

postgres:
  enabled: true
  instances: 2
  storageSize: 1500Gi
  storageClassName: ""
  resources:
    requests: { cpu: "8", memory: "64Gi" }
    limits: { cpu: "8", memory: "64Gi" }
  nodeSelector: {}
  tolerations: []

kafka:
  enabled: true
  replicas: 3
  storageSize: 200Gi
  storageClassName: ""
  resources:
    requests: { cpu: "2", memory: "8Gi" }
    limits: { cpu: "2", memory: "8Gi" }
  nodeSelector: {}
  tolerations: []

starrocks:
  storageClassName: ""
  fe:
    image: "starrocks/fe-ubuntu:4.1.1"
    replicas: 1
    storageSize: 50Gi
    resources:
      requests: { cpu: "4", memory: "32Gi" }
      limits: { cpu: "4", memory: "32Gi" }
    nodeSelector: {}
    tolerations: []
  be:
    image: "starrocks/be-ubuntu:4.1.1"
    replicas: 2
    storageSize: 500Gi
    resources:
      requests: { cpu: "8", memory: "64Gi" }
      limits: { cpu: "8", memory: "64Gi" }
    nodeSelector: {}
    tolerations: []

qdrant:
  enabled: true
  replicas: 2
  storageSize: 500Gi
  storageClassName: ""
  imageTag: "v1.18.2"
  resources:
    requests: { cpu: "8", memory: "64Gi", ephemeral-storage: "2Gi" }
    limits: { cpu: "8", memory: "64Gi", ephemeral-storage: "4Gi" }
  nodeSelector: {}
  tolerations: []

ollama:
  enabled: true
  replicas: 2
  storageSize: 20Gi
  storageClassName: ""
  imageTag: "0.12.11"
  resources:
    requests: { cpu: "8", memory: "16Gi", ephemeral-storage: "2Gi" }
    limits: { cpu: "8", memory: "16Gi", ephemeral-storage: "4Gi" }
  nodeSelector: {}
  tolerations: []

tei:
  enabled: true
  replicas: 2
  storageSize: 2Gi            # bge-base weights are 0.44 GB
  storageClassName: ""
  imageTag: "cpu-1.8"
  resources:
    requests: { cpu: "2", memory: "2Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "4", memory: "4Gi", ephemeral-storage: "2Gi" }
  nodeSelector: {}
  tolerations: []

api:
  enabled: true
  replicas: 2
  image:
    repository: "iverson-api"
    tag: "0.1.0"   # never "latest" — CI/the image-build pipeline must supply a real, immutable tag
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
  ingress:
    className: ""
    annotations: {}
    # No `host` key here (CSR round-3 finding #11): it used to duplicate
    # global.ingressHost, which could drift out of lockstep with no enforcement.
    # charts/api/templates/ingress.yaml now templates directly off
    # global.ingressHost, the single source of truth (see that comment there,
    # and the values.yaml global.ingressHost comment above).
    tlsSecretName: ""   # set per-environment; empty disables the tls: block (kind only — see values-local.yaml)
    securityHeadersRuleSet: ""   # name of a pre-provisioned azurerm_application_gateway_rewrite_rule_set
                                 # carrying the security-header rewrite rules; only used when
                                 # className is "azure-application-gateway". This repo's Terraform
                                 # does not provision one — leave empty unless you have provisioned
                                 # it yourself, otherwise AGIC references a rule set that does not exist.

worker:
  enabled: true
  replicas: 2
  image:
    repository: "iverson-api"
    tag: "0.1.0"   # never "latest" — CI/the image-build pipeline must supply a real, immutable tag
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

jaeger:
  imageTag: "1.62.0"
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  nodeSelector: {}

prometheus:
  enabled: true
  imageTag: "v2.55.1"
  storageSize: "20Gi"
  storageClassName: ""
  resources:
    requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
  nodeSelector: {}

redis:
  enabled: true
  imageTag: "7.4-alpine"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  nodeSelector: {}

adminUi:
  enabled: true
  replicas: 2
  image:
    repository: "iverson-admin-ui"
    tag: "0.1.0"   # never "latest" — CI/the image-build pipeline must supply a real, immutable tag
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  apiBaseUrl: "http://iverson.local"
  ingress:
    className: ""
    annotations: {}
    tlsSecretName: ""   # set per-environment; empty disables the tls: block (kind only — see values-local.yaml)
    securityHeadersRuleSet: ""   # see api.ingress.securityHeadersRuleSet above — same opt-in, same default.

authentik:
  enabled: true
  imageTag: "2026.5.3"
  resources:
    server:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
    worker:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
  nodeSelector: {}
  bootstrapEmail: "admin@iverson.local"
