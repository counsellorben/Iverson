# Cloud-agnostic defaults. Cloud/environment identity (StorageClass names,
# ingress class/annotations, node-selector labels) is intentionally left
# empty/unset here — it is supplied by values-local.yaml (this plan) or
# values-{aws,azure,gcp}.yaml (companion Terraform plan), never hardcoded
# in a subchart template.
#
# networkPolicy.enabled gates the default-deny NetworkPolicy baseline
# (templates/networkpolicies.yaml) plus every per-component allow rule in
# the subcharts below. Leave this true unless the target cluster's CNI
# cannot enforce NetworkPolicy at all — disabling it removes network
# segmentation entirely rather than degrading gracefully, so treat "false"
# as an explicit, logged exception, not a default anyone should ship with.
networkPolicy:
  enabled: true

# global values are visible to every subchart (unlike top-level keys like `api:`,
# which are scoped only to the matching subchart) — used here so the authentik
# subchart's blueprint (the human OIDC provider's redirect_uri) can reference the
# same hostname as api.ingress.host without duplicating it out of sync. Keep this
# in lockstep with api.ingress.host in every values-*.yaml file.
global:
  ingressHost: "iverson.local"
  # The generative model used for ingest enrichment. Lives under `global` (not under
  # `ollama:`) because two subcharts must agree on it: the ollama subchart PULLS it, and
  # the api/worker subcharts REQUEST it via Enrichment__ModelId. Scoping it to one subchart
  # would let the pulled model and the requested model drift apart, which fails at runtime
  # with a 404 from Ollama on every generative call.
  generativeModel: "qwen2.5:3b"
  # The embedding models Ollama pulls. Under `global` for the same reason generativeModel is:
  # the ollama subchart PULLS these and the api/worker subcharts REQUEST one of them, so
  # scoping them to one subchart would let the pulled and requested sets drift apart.
  #
  # The prefix keys are three-state and the distinction is load-bearing. Omitting a key leaves
  # the C# property null, which means "derive from the model family"; setting it to "" means
  # "deliberately no prefix". Arctic's document prefix IS the empty string, so "" cannot
  # double as unset — which is why the templates use `hasKey`, not `default`.
  #
  # This list must contain every model any REGISTERED type's stored `_iverson_schema` row
  # names, not merely the currently-active one. A type registered under a model keeps that
  # model pinned in its stored descriptor indefinitely — re-registering it under a different
  # model is refused by the SchemaRegistrationOrchestrator guard. Removing an entry a
  # registered type still carries takes ingest and search for that type down (Unavailable
  # from the probe, then 404s from Ollama) until either the model is restored here, or that
  # type's schema row and Qdrant collections are cleared out from under it.
  embeddingModels:
    - name: nomic-embed-text
      # prefixes omitted -> EmbeddingPrefixes derives them from the model family
    - name: snowflake-arctic-embed:s
      documentPrefix: ""
      queryPrefix: "Represent this sentence for searching relevant passages: "
  # The default model api and worker request for any registered type that does not declare its
  # own. Must name an entry above; a mismatch renders cleanly and surfaces as a 404 from Ollama
  # naming the unpulled model on the first embed call, not at deploy.
  activeEmbeddingModel: nomic-embed-text
  # Drives the starrocks subchart's condition AND the api/worker env guards AND
  # Engagement__Enabled. One flag, because two flags that must agree can disagree —
  # and the disagreeing state renders a secretKeyRef against a Secret that no longer
  # exists. Same reasoning as generativeModel above.
  engagementEnabled: true
  # Drives the jaeger subchart's condition AND the api/worker OTLP env vars.
  tracingEnabled: true

postgres:
  enabled: true
  instances: 2
  storageSize: 1500Gi
  storageClassName: ""
  resources:
    requests: { cpu: "8", memory: "64Gi" }
    limits: { cpu: "8", memory: "64Gi" }
  nodeSelector: {}
  tolerations: []

kafka:
  enabled: true
  replicas: 3
  storageSize: 200Gi
  storageClassName: ""
  resources:
    requests: { cpu: "2", memory: "8Gi" }
    limits: { cpu: "2", memory: "8Gi" }
  nodeSelector: {}
  tolerations: []

starrocks:
  storageClassName: ""
  fe:
    image: "starrocks/fe-ubuntu:4.1.1"
    replicas: 1
    storageSize: 50Gi
    resources:
      requests: { cpu: "4", memory: "32Gi" }
      limits: { cpu: "4", memory: "32Gi" }
    nodeSelector: {}
    tolerations: []
  be:
    image: "starrocks/be-ubuntu:4.1.1"
    replicas: 2
    storageSize: 500Gi
    resources:
      requests: { cpu: "8", memory: "64Gi" }
      limits: { cpu: "8", memory: "64Gi" }
    nodeSelector: {}
    tolerations: []

qdrant:
  enabled: true
  replicas: 2
  storageSize: 500Gi
  storageClassName: ""
  imageTag: "v1.18.2"
  resources:
    requests: { cpu: "8", memory: "64Gi", ephemeral-storage: "2Gi" }
    limits: { cpu: "8", memory: "64Gi", ephemeral-storage: "4Gi" }
  nodeSelector: {}
  tolerations: []

ollama:
  enabled: true
  replicas: 2
  storageSize: 20Gi
  storageClassName: ""
  imageTag: "0.12.11"
  resources:
    requests: { cpu: "8", memory: "16Gi", ephemeral-storage: "2Gi" }
    limits: { cpu: "8", memory: "16Gi", ephemeral-storage: "4Gi" }
  nodeSelector: {}
  tolerations: []

api:
  enabled: true
  replicas: 2
  image:
    repository: "iverson-api"
    tag: "0.1.0"   # never "latest" — CI/the image-build pipeline must supply a real, immutable tag
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
  ingress:
    className: ""
    annotations: {}
    host: "iverson.local"
    tlsSecretName: ""   # set per-environment; empty disables the tls: block (kind only — see values-local.yaml)

worker:
  enabled: true
  replicas: 2
  image:
    repository: "iverson-api"
    tag: "0.1.0"   # never "latest" — CI/the image-build pipeline must supply a real, immutable tag
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

jaeger:
  imageTag: "1.62.0"
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  nodeSelector: {}

prometheus:
  enabled: true
  imageTag: "v2.55.1"
  storageSize: "20Gi"
  storageClassName: ""
  resources:
    requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
  nodeSelector: {}

redis:
  enabled: true
  imageTag: "7.4-alpine"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  nodeSelector: {}

adminUi:
  enabled: true
  replicas: 2
  image:
    repository: "iverson-admin-ui"
    tag: "0.1.0"   # never "latest" — CI/the image-build pipeline must supply a real, immutable tag
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  oidcAuthority: "http://authentik.iverson.local/application/o/iverson-api/"
  apiBaseUrl: "http://iverson.local"
  ingress:
    className: ""
    annotations: {}
    tlsSecretName: ""   # set per-environment; empty disables the tls: block (kind only — see values-local.yaml)

authentik:
  enabled: true
  imageTag: "2026.5.3"
  resources:
    server:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
    worker:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
  nodeSelector: {}
  bootstrapEmail: "admin@iverson.local"
