{{- if .Values.adminUi.enabled }}
# admin-ui is a static nginx server reachable from outside the namespace through the
# Istio gateway (local/laptop) or the profile's load balancer (`clusterCidrs`), on 8080.
# Its kubelet probes need no rule (node traffic is always admitted). It needs no egress
# rule of its own (the browser calls the API/Authentik directly, not this pod), so the
# default-deny-all egress posture above is correct and sufficient.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-admin-ui-ingress
spec:
  podSelector:
    matchLabels: { app: {{ .Release.Name }}-admin-ui }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ ipBlock: { cidr: 169.254.7.127/32 } }]   # kubelet probes under the mesh (see the top of this file)
      ports: [{ protocol: TCP, port: 8080 }, { protocol: TCP, port: 15008 }]
    - from:
        {{- if $meshEdge }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ include "iverson.edgeGatewayNamespace" . }} }
        {{- end }}
        {{- range .Values.networkPolicy.clusterCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
        {{- range .Values.networkPolicy.nodeSubnetFallback }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 15008 }
{{- end }}
{{- if .Values.global.tracingEnabled }}
