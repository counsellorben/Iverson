apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-authentik-ingress
spec:
  podSelector:
    matchLabels: { app: {{ .Release.Name }}-authentik-server }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ ipBlock: { cidr: 169.254.7.127/32 } }]   # kubelet probes under the mesh (see the top of this file)
      ports: [{ protocol: TCP, port: 9000 }, { protocol: TCP, port: 9080 }, { protocol: TCP, port: 15008 }]
    # CSR round-10 #5: the API reaches Authentik only on the tls-proxy sidecar's 8443.
    - from:
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-api } }
      ports: [{ protocol: TCP, port: 8443 }, { protocol: TCP, port: 15008 }]
    # CSR round-10 #4: the tls-proxy sidecar's public listener, which the Authentik Ingress targets.
    # Port 9000 has no rule: its only callers are the kubelet (node traffic is always admitted),
    # the sidecar over loopback and `kubectl port-forward`, none of which NetworkPolicy filters.
    - from:
        {{- if $meshEdge }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ include "iverson.edgeGatewayNamespace" . }} }
        {{- end }}
        {{- range .Values.networkPolicy.clusterCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
        {{- range .Values.networkPolicy.nodeSubnetFallback }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports: [{ protocol: TCP, port: 9080 }, { protocol: TCP, port: 15008 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-authentik-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["{{ .Release.Name }}-authentik-server", "{{ .Release.Name }}-authentik-worker"]
  policyTypes: ["Egress"]
  egress:
    {{- include "iverson.dnsEgress" . | nindent 4 }}
    - to: [{ podSelector: { matchLabels: { cnpg.io/cluster: {{ .Release.Name }}-postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 15008 }]
---
# CSR round-10 #4 (C2): the worker's JWKS relay reads the cluster's service-account keys from the API
# server. CSR round-12 §2.6: the server's tokenreview-relay creates TokenReviews there.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-authentik-apiserver-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["{{ .Release.Name }}-authentik-server", "{{ .Release.Name }}-authentik-worker"]
  policyTypes: ["Egress"]
  egress:
    {{- include "iverson.apiServerEgress" . | nindent 4 }}
{{- end }}
