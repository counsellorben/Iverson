{{- include "iverson.validateNoPlaceholders" . -}}
{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.clusterCidrs }}
{{- fail "networkPolicy.clusterCidrs must list at least one CIDR; an empty list renders an allow-all ingress rule" }}
{{- end }}
{{- if not .Values.networkPolicy.apiServerCidrs }}
{{- fail "networkPolicy.apiServerCidrs must list at least one CIDR; it scopes the Postgres, Kafka and Authentik-worker API-server egress rules" }}
{{- end }}
{{- range .Values.networkPolicy.apiServerCidrs }}
{{- if not (trim (toString .)) }}
{{- fail "networkPolicy.apiServerCidrs contains a blank entry; every entry must be a CIDR" }}
{{- end }}
{{- end }}
{{- if or .Values.networkPolicy.dnsAnyDestination .Values.networkPolicy.apiServerAnyDestination }}
{{- if not .Values.networkPolicy.keepFallbacks }}
{{- fail "networkPolicy.dnsAnyDestination / apiServerAnyDestination render port-only egress rules that admit any destination. They are first-deploy fallbacks: replace them with the scoped rules, or set networkPolicy.keepFallbacks: true to record that the fallback is kept on purpose (docs/runbooks/csr10-infrastructure-cutover.md section 4)." }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.nodeSubnetFallback }}
{{- if not .Values.networkPolicy.keepFallbacks }}
{{- fail "networkPolicy.nodeSubnetFallback admits the listed ranges (the node subnet) on the api, admin-ui and Authentik edge rules. It is a first-deploy fallback for a policy engine that does not exempt node traffic: set networkPolicy.keepFallbacks: true to record that it is kept on purpose (docs/runbooks/csr10-infrastructure-cutover.md section 5)." }}
{{- end }}
{{- range .Values.networkPolicy.nodeSubnetFallback }}
{{- if not (trim (toString .)) }}
{{- fail "networkPolicy.nodeSubnetFallback contains a blank entry; every entry must be a CIDR" }}
{{- end }}
{{- end }}
{{- end }}
{{- range .Values.networkPolicy.clusterCidrs }}
{{- if not (trim (toString .)) }}
{{- fail "networkPolicy.clusterCidrs contains a blank entry; every entry must be a CIDR (note: helm's --set x={} produces a one-element list [\"\"], not an empty list — use --set-json or a values file for a true empty list)" }}
{{- end }}
{{- end }}
{{- /*
CSR round 12 §4.2. Where the edge is the Istio gateway (global.gateway.class istio: kind and laptop),
its namespace is admitted on the edge ports (API 8080 and 8081, admin-ui 8080, Authentik 9080); every
other profile reaches those ports from clusterCidrs alone. A rule's `from` list never becomes empty:
clusterCidrs is non-empty (refused above otherwise).

Every rule that lists ports also lists 15008, to the same peers: in the ambient mesh an enrolled
pod's traffic travels as HBONE to <destination>:15008, so both the sender's egress and the receiver's
ingress see that port. Inside the mesh NetworkPolicy therefore keeps pod-pair scoping but not port
scoping; templates/mesh-policies.yaml restores port scoping with an AuthorizationPolicy per workload
that mirrors the ingress rules here, so a peer added or a port changed here is changed there too.

Every probed pod's ingress admits 169.254.7.127/32, the address istio-cni gives kubelet probes, on
its probe ports. Calico's iptables dataplane admits probes without it (they are filtered before the
SNAT), but Istio asks for it wherever NetworkPolicy is enforced, and the cloud CNIs are untested.
*/}}
{{- $meshEdge := eq (include "iverson.meshEdge" .) "true" }}
# Default-deny: nothing in the namespace can talk to anything else unless a
# more specific policy below explicitly allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# api is reachable from outside the namespace two ways: through the Istio gateway's namespace
# (local/laptop, global.gateway.class istio) or from the address ranges
# `.Values.networkPolicy.clusterCidrs` lists for the profile: the ranges the platform's
# load balancer connects from (AWS/Azure/GCP have no gateway namespace). An empty
# list is refused near the top of this file, since it would render an ingress rule that
# matches every source. The kubelet's readiness/liveness probes need no rule: traffic from
# the node a pod runs on is always admitted. Port 8082 admits Prometheus alone: it serves
# /metrics and /build, and only there (CSR round 12 §3.3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-ingress
spec:
  podSelector:
    matchLabels: { app: {{ .Release.Name }}-api }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ ipBlock: { cidr: 169.254.7.127/32 } }]   # kubelet probes under the mesh (see the top of this file)
      ports: [{ protocol: TCP, port: 8081 }, { protocol: TCP, port: 15008 }]
    - from:
        {{- if $meshEdge }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ include "iverson.edgeGatewayNamespace" . }} }
        {{- end }}
        {{- range .Values.networkPolicy.clusterCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
        {{- range .Values.networkPolicy.nodeSubnetFallback }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 15008 }
    - from:
        {{- if $meshEdge }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ include "iverson.edgeGatewayNamespace" . }} }
        {{- end }}
        {{- range .Values.networkPolicy.clusterCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
        {{- range .Values.networkPolicy.nodeSubnetFallback }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 8081 }
        - { protocol: TCP, port: 15008 }
    - from:
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-prometheus } }
      ports:
        - { protocol: TCP, port: 8082 }
        - { protocol: TCP, port: 15008 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-egress
spec:
  podSelector:
    matchLabels: { app: {{ .Release.Name }}-api }
  policyTypes: ["Egress"]
  egress:
    - to: [{ podSelector: { matchLabels: { cnpg.io/cluster: {{ .Release.Name }}-postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { strimzi.io/cluster: {{ .Release.Name }}-kafka } } }]
      ports: [{ protocol: TCP, port: 9093 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { app.starrocks.ownerreference/name: {{ .Release.Name }}-starrocks-fe } } }]
               # clients only ever talk to FE's query port, never BE directly — see the
               # starrocks-egress/-ingress note below on why this isn't app.starrocks.io/cluster.
      ports: [{ protocol: TCP, port: 9030 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { app: {{ .Release.Name }}-qdrant } } }]
      ports: [{ protocol: TCP, port: 6334 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { iverson.io/component: tei } } }]
      ports: [{ protocol: TCP, port: 8080 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { app: {{ .Release.Name }}-ollama } } }]
      ports: [{ protocol: TCP, port: 11434 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { app: {{ .Release.Name }}-jaeger } } }]
      ports: [{ protocol: TCP, port: 4317 }, { protocol: TCP, port: 4318 }, { protocol: TCP, port: 15008 }]
    # CSR round-10 #5: the API reaches Authentik only on the tls-proxy sidecar's 8443.
    - to: [{ podSelector: { matchLabels: { app: {{ .Release.Name }}-authentik-server } } }]
      ports: [{ protocol: TCP, port: 8443 }, { protocol: TCP, port: 15008 }]
{{- if .Values.global.prometheusEnabled }}
    - to: [{ podSelector: { matchLabels: { app: {{ .Release.Name }}-prometheus } } }]
               # api queries Prometheus's own HTTP API (not the /metrics scrape port) to
               # serve live status on the admin console landing page.
      ports: [{ protocol: TCP, port: 9090 }, { protocol: TCP, port: 15008 }]
{{- end }}
    {{- include "iverson.dnsEgress" . | nindent 4 }}
---
# worker is the Kafka-consumer/background-processing counterpart to api (same image,
# WORKLOAD_ROLE=worker) — it needs the same datastore/backing-service egress as api,
# minus the edge's ingress rules (it serves no inbound client traffic; worker-ingress
# below admits only Prometheus and the probes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker-egress
spec:
  podSelector:
    matchLabels: { app: {{ .Release.Name }}-worker }
  policyTypes: ["Egress"]
  egress:
    - to: [{ podSelector: { matchLabels: { cnpg.io/cluster: {{ .Release.Name }}-postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { strimzi.io/cluster: {{ .Release.Name }}-kafka } } }]
      ports: [{ protocol: TCP, port: 9093 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { app.starrocks.ownerreference/name: {{ .Release.Name }}-starrocks-fe } } }]
      ports: [{ protocol: TCP, port: 9030 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { app: {{ .Release.Name }}-qdrant } } }]
      ports: [{ protocol: TCP, port: 6334 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { iverson.io/component: tei } } }]
      ports: [{ protocol: TCP, port: 8080 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { app: {{ .Release.Name }}-ollama } } }]
      ports: [{ protocol: TCP, port: 11434 }, { protocol: TCP, port: 15008 }]
    - to: [{ podSelector: { matchLabels: { app: {{ .Release.Name }}-jaeger } } }]
      ports: [{ protocol: TCP, port: 4317 }, { protocol: TCP, port: 15008 }]
    {{- include "iverson.dnsEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker-ingress
spec:
  podSelector:
    matchLabels: { app: {{ .Release.Name }}-worker }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ ipBlock: { cidr: 169.254.7.127/32 } }]   # kubelet probes under the mesh (see the top of this file)
      ports: [{ protocol: TCP, port: 8081 }, { protocol: TCP, port: 15008 }]
    - from:
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-prometheus } }
      ports: [{ protocol: TCP, port: 8082 }, { protocol: TCP, port: 15008 }]
---
# Every datastore/backing-service component: ingress only from api (and, where noted,
# worker), on its own port. None of them need to initiate egress beyond DNS + their own
# operator/peer traffic, which the operator's own NetworkPolicy (if any) or
# a component-specific rule below already covers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres-ingress
  annotations:
    # postgres is a CloudNativePG-operator-managed CR; kube-score can't see the
    # runtime pod labels the operator applies, so it can't match this policy's
    # podSelector to any pod it renders — confirmed false positive.
    kube-score/ignore: networkpolicy-targets-pod
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: {{ .Release.Name }}-postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-api } }
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-worker } }
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-authentik-server } }
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-authentik-worker } }
        - podSelector: { matchLabels: { job-name: {{ .Release.Name }}-authentik-revoke-cross-db } }
               # the revoke-cross-db job's own egress rule (below) already allows it to *send*
               # to postgres on 5432, but that's only half of a NetworkPolicy: without a
               # matching ingress rule here too, postgres never accepts the connection — same
               # asymmetry as the starrocks create-user job's ingress/egress pairing.
      ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 15008 }]
    # CSR round 12 §4.3 #1: the CNPG operator reads each instance's status port (8000); without it
    # the Cluster reports "Instance Status Extraction Error".
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cnpg-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: cloudnative-pg } }
      ports: [{ protocol: TCP, port: 8000 }, { protocol: TCP, port: 5432 }, { protocol: TCP, port: 15008 }]
    # CSR round 12 §4.3 #4: the instances themselves. A standby streams from the primary (5432) and
    # the instances call each other's status port (8000), so the rule lists no ports; without it a
    # standby can neither stream nor be cloned, while CNPG still reports the Cluster healthy.
    - from: [{ podSelector: { matchLabels: { cnpg.io/cluster: {{ .Release.Name }}-postgres } } }]
    - from: [{ ipBlock: { cidr: 169.254.7.127/32 } }]   # kubelet probes under the mesh (see the top of this file)
      ports: [{ protocol: TCP, port: 8000 }, { protocol: TCP, port: 15008 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres-egress
  annotations:
    # postgres is a CloudNativePG-operator-managed CR; kube-score can't see the
    # runtime pod labels the operator applies, so it can't match this policy's
    # podSelector to any pod it renders — confirmed false positive.
    kube-score/ignore: networkpolicy-targets-pod
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: {{ .Release.Name }}-postgres }
  policyTypes: ["Egress"]
  egress:
    {{- include "iverson.dnsEgress" . | nindent 4 }}
    - to: [{ podSelector: { matchLabels: { cnpg.io/cluster: {{ .Release.Name }}-postgres } } }]   # streaming replication
      ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 15008 }]
    # Kubernetes API server: CNPG's instance manager (baked into the postgres image, not a
    # sidecar) calls it directly to sync Cluster status; without it the Cluster never leaves
    # "Setting up primary".
    {{- include "iverson.apiServerEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-kafka-ingress
  annotations:
    # kafka is a Strimzi-operator-managed CR; kube-score can't see the runtime
    # pod labels the operator applies, so it can't match this policy's
    # podSelector to any pod it renders — confirmed false positive.
    kube-score/ignore: networkpolicy-targets-pod
spec:
  podSelector:
    matchLabels: { strimzi.io/cluster: {{ .Release.Name }}-kafka }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-api } }
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-worker } }
               # worker reuses api's own KafkaUser/SASL credentials (see
               # charts/worker/templates/deployment.yaml's Kafka__SaslUsername) rather than a
               # separate KafkaUser, but NetworkPolicy enforcement is pure L3/L4 pod-label
               # matching — it has no visibility into the SASL layer above it. Strimzi also
               # generates a policy for this listener from the Kafka CR's networkPolicyPeers
               # (charts/kafka/templates/kafka.yaml), which names the same two selectors.
               # NetworkPolicies are additive, so a pod gets through if either admits it; without
               # this entry and those peers, worker's TCP SYN to the broker never gets past the
               # network policy regardless of having valid credentials.
      ports: [{ protocol: TCP, port: 9093 }, { protocol: TCP, port: 15008 }]
    - from: [{ podSelector: { matchLabels: { strimzi.io/cluster: {{ .Release.Name }}-kafka } } }]   # broker/controller peers
    # CSR round 12 §3.2: the Strimzi cluster-operator (namespace kafka, as modules/operators and
    # deploy/kind/setup.sh install it) reconciles the brokers on the control-plane (9090) and
    # replication (9091) listeners and the agent port (8443). Strimzi's own generated policy admits
    # it there too, but it cannot be edited (the operator reverts it), so the chart's own rule carries
    # the operator's ports.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kafka } }
          podSelector: { matchLabels: { strimzi.io/kind: cluster-operator } }
      ports: [{ protocol: TCP, port: 9090 }, { protocol: TCP, port: 9091 }, { protocol: TCP, port: 8443 }, { protocol: TCP, port: 15008 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-kafka-egress
  annotations:
    # kafka is a Strimzi-operator-managed CR; kube-score can't see the runtime
    # pod labels the operator applies, so it can't match this policy's
    # podSelector to any pod it renders — confirmed false positive.
    kube-score/ignore: networkpolicy-targets-pod
spec:
  podSelector:
    matchLabels: { strimzi.io/cluster: {{ .Release.Name }}-kafka }
  policyTypes: ["Egress"]
  egress:
    {{- include "iverson.dnsEgress" . | nindent 4 }}
    - to: [{ podSelector: { matchLabels: { strimzi.io/cluster: {{ .Release.Name }}-kafka } } }]   # broker/controller peers
               # 9093 (tcp-clientstls, external/API traffic) alone isn't enough: the
               # entity-operator (Topic/User operators, also selected by this same
               # strimzi.io/cluster label) talks to the bootstrap service's
               # tcp-replication listener on 9091 to fetch cluster metadata — without it,
               # its AdminClient never gets past "Timed out waiting to send the call".
      ports: [{ protocol: TCP, port: 9091 }, { protocol: TCP, port: 9093 }, { protocol: TCP, port: 15008 }]
    # Kubernetes API server: the broker resolves ${strimziSecretName:...} config placeholders
    # through Strimzi's KubernetesSecretConfigProvider at startup; without it the broker
    # crash-loops before storage format/listener startup.
    {{- include "iverson.apiServerEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-starrocks-ingress
  annotations:
    # starrocks is a StarRocks-operator-managed CR; kube-score can't see the
    # runtime pod labels the operator applies, so it can't match this policy's
    # podSelector to any pod it renders — confirmed false positive.
    kube-score/ignore: networkpolicy-targets-pod
spec:
  # The operator never applies an `app.starrocks.io/cluster` label to the FE/BE pods it
  # creates — its real runtime labels are `app.starrocks.ownerreference/name: <cr>-fe|be` and
  # `app.kubernetes.io/component: fe|be` (confirmed against the operator's own
  # pkg/k8sutils/load/metadata.go, same source used for the FE/BE PodDisruptionBudget
  # selectors). A podSelector on app.starrocks.io/cluster matches zero real pods — this whole
  # policy silently never applied to FE or BE. matchExpressions/In is required since FE and BE
  # have different ownerreference/name values and there's no single label shared by both.
  podSelector:
    matchExpressions:
      - key: app.starrocks.ownerreference/name
        operator: In
        values: ["{{ .Release.Name }}-starrocks-fe", "{{ .Release.Name }}-starrocks-be"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-api } }
        - podSelector: { matchLabels: { app: {{ .Release.Name }}-worker } }
        - podSelector: { matchLabels: { job-name: {{ .Release.Name }}-starrocks-create-user } }
               # the create-user job's own egress rule already allows it to *send* to FE on
               # 9030, but that's only half of a NetworkPolicy: without a matching ingress
               # rule here too, FE never accepts the connection — same asymmetry as the
               # postgres ingress/egress pairing above. Missing this caused mysql's TCP
               # connect to FE to time out (errno 110) instead of erroring cleanly, which
               # the job's own `2>/dev/null` then hid as an infinite "waiting for FE...".
      ports: [{ protocol: TCP, port: 9030 }, { protocol: TCP, port: 15008 }]
    - from:   # FE/BE peers
        - podSelector:
            matchExpressions:
              - key: app.starrocks.ownerreference/name
                operator: In
                values: ["{{ .Release.Name }}-starrocks-fe", "{{ .Release.Name }}-starrocks-be"]
    # Kubelet probes under the mesh (see the top of this file): the operator probes FE on its
    # http_port (8030) and BE on its webserver_port (8040).
    - from: [{ ipBlock: { cidr: 169.254.7.127/32 } }]
      ports: [{ protocol: TCP, port: 8030 }, { protocol: TCP, port: 8040 }, { protocol: TCP, port: 15008 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-starrocks-egress
  annotations:
    # starrocks is a StarRocks-operator-managed CR; kube-score can't see the
    # runtime pod labels the operator applies, so it can't match this policy's
    # podSelector to any pod it renders — confirmed false positive.
    kube-score/ignore: networkpolicy-targets-pod
spec:
  # See the matching comment on starrocks-ingress: app.starrocks.io/cluster matches no real
  # pod, the operator's actual label is app.starrocks.ownerreference/name: <cr>-fe|be.
  podSelector:
    matchExpressions:
      - key: app.starrocks.ownerreference/name
        operator: In
        values: ["{{ .Release.Name }}-starrocks-fe", "{{ .Release.Name }}-starrocks-be"]
  policyTypes: ["Egress"]
  egress:
    {{- include "iverson.dnsEgress" . | nindent 4 }}
    - to:   # FE/BE peers
        - podSelector:
            matchExpressions:
              - key: app.starrocks.ownerreference/name
                operator: In
                values: ["{{ .Release.Name }}-starrocks-fe", "{{ .Release.Name }}-starrocks-be"]
               # 9030 (query, MySQL protocol) alone isn't enough: BE registers itself with FE
               # over FE's rpc_port (9020), and edit_log (9010)/http (8030) plus BE's own
               # http/brpc/heartbeat ports (8040/8060/9050/9060) are used for FE<->BE and
               # BE<->BE coordination. Missing 9020 specifically caused BE's "Add myself into
               # FE" registration call to silently time out and crash-loop.
      ports:
        - { protocol: TCP, port: 8030 }
        - { protocol: TCP, port: 9010 }
        - { protocol: TCP, port: 9020 }
        - { protocol: TCP, port: 9030 }
        - { protocol: TCP, port: 8040 }
        - { protocol: TCP, port: 8060 }
        - { protocol: TCP, port: 9050 }
        - { protocol: TCP, port: 9060 }
        - { protocol: TCP, port: 15008 }
---
# The post-install/post-upgrade create-user Job (charts/starrocks/templates/job-create-user.yaml)
# runs as a plain Job pod, not part of the StarRocksCluster CR — it only carries `job-name`,
# not `app.starrocks.io/cluster`, so none of the policies above cover it. Under default-deny that
# means zero egress, including DNS, so its `mysql -h <fe-service>` wait loop never resolves the
# hostname and spins forever ("waiting for FE..." with no useful error, since the script
# redirects mysql's stderr to /dev/null).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-starrocks-create-user-egress
  # kube-score matches a policy against pod templates, and `job-name` is added by the Job
  # controller at runtime, never in the template, so it reports this policy as matching nothing.
  annotations:
    kube-score/ignore: networkpolicy-targets-pod
spec:
  podSelector:
    matchLabels: { job-name: {{ .Release.Name }}-starrocks-create-user }
  policyTypes: ["Egress"]
  egress:
    {{- include "iverson.dnsEgress" . | nindent 4 }}
    - to: [{ podSelector: { matchLabels: { app.starrocks.ownerreference/name: {{ .Release.Name }}-starrocks-fe } } }]
               # the create-user job's `mysql -h <fe-service>` call only ever reaches FE, never
               # BE — see the starrocks-egress note above on app.starrocks.io/cluster vs the
               # operator's real app.starrocks.ownerreference/name label.
      ports: [{ protocol: TCP, port: 9030 }, { protocol: TCP, port: 15008 }]
---
# The post-install/post-upgrade revoke-cross-db Job
# (charts/authentik/templates/job-revoke-cross-db.yaml) runs as a plain Job pod, not part of
# the postgres CNPG Cluster CR — it only carries `job-name`, not `cnpg.io/cluster`, so none of
# the policies above cover it. Under default-deny that means zero egress, including DNS, so
# its `psql`-based wait loop never resolves the `<release>-postgres-rw` hostname and spins
# forever ("waiting for authentik role to exist..." with no useful error, since the script
# redirects psql's stderr to /dev/null) — same failure mode as the starrocks create-user job
# above, before its own dedicated egress rule was added.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-authentik-revoke-cross-db-egress
  # kube-score matches a policy against pod templates, and `job-name` is added by the Job
  # controller at runtime, never in the template, so it reports this policy as matching nothing.
  annotations:
    kube-score/ignore: networkpolicy-targets-pod
spec:
  podSelector:
    matchLabels: { job-name: {{ .Release.Name }}-authentik-revoke-cross-db }
  policyTypes: ["Egress"]
  egress:
