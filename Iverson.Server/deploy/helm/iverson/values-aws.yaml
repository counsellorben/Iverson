# AWS EKS overlay — StorageClass names and node-pool labels match modules/operators
# and modules/cluster-aws's fixed naming exactly (see Tasks 2 and 3 of this plan).

# modules/cluster-aws's VPC CIDR — covers both the kubelet (node IPs) and the ALB's
# pod-IP targets, since AWS has no ingress-nginx namespace for api-ingress to admit
# instead. See values.yaml's networkPolicy comment for why every profile sets this.
networkPolicy:
  clusterCidrs: ["10.0.0.0/16"]

# Keep in lockstep with api.ingress.host below — see values.yaml's global.ingressHost
# comment for why this is a separate key instead of a single source of truth.
global:
  ingressHost: "iverson.example.com"
  prometheusEnabled: true   # single source of truth — see values.yaml's comment on this flag

postgres:
  storageClassName: "iverson-postgres"
  nodeSelector:
    iverson.io/node-pool: postgres
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "postgres"
      effect: "NoSchedule"

kafka:
  storageClassName: "iverson-kafka"
  nodeSelector:
    iverson.io/node-pool: kafka
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "kafka"
      effect: "NoSchedule"

starrocks:
  storageClassName: "iverson-starrocks"
  fe:
    replicas: 3
    nodeSelector:
      iverson.io/node-pool: starrocks-fe
    tolerations:
      - key: "iverson.io/node-pool"
        operator: "Equal"
        value: "starrocks-fe"
        effect: "NoSchedule"
  be:
    nodeSelector:
      iverson.io/node-pool: starrocks-be
    tolerations:
      - key: "iverson.io/node-pool"
        operator: "Equal"
        value: "starrocks-be"
        effect: "NoSchedule"

qdrant:
  storageClassName: "iverson-qdrant"
  nodeSelector:
    iverson.io/node-pool: qdrant
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "qdrant"
      effect: "NoSchedule"

ollama:
  storageClassName: "iverson-ollama"
  nodeSelector:
    iverson.io/node-pool: ollama
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "ollama"
      effect: "NoSchedule"

tei:
  storageClassName: "iverson-tei"
  nodeSelector:
    iverson.io/node-pool: tei
  tolerations:
    - key: "iverson.io/node-pool"
      operator: "Equal"
      value: "tei"
      effect: "NoSchedule"

api:
  ingress:
    className: "alb"
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol-version: GRPC
      # ALB terminates TLS using an ACM certificate referenced by ARN, not a
      # Kubernetes Secret — tlsSecretName stays empty here on purpose (the
      # Ingress template's tls: block is for Secret-based termination, which
      # ALB doesn't use). Replace <ACM_CERT_ARN> with a real certificate
      # provisioned for the real host before applying — without it ALB will
      # only serve HTTP.
      alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERT_ARN>"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
    host: "iverson.example.com"
  # admin-api.iverson.example.com — same ALB, same ACM certificate (assumed to cover
  # every *.iverson.example.com host the way it already does for authentik/adminUi
  # below), but this backend serves plain HTTP/1.1 JSON, not gRPC — the
  # backend-protocol-version: GRPC annotation above must NEVER be copied here. Omitting
  # it leaves ALB's default (HTTP1), which is correct for this Ingress.
  adminApiIngress:
    className: "alb"
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERT_ARN>"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
  adminConsoleOrigin: "https://iverson.example.com"

# worker/prometheus/redis/authentik: none of these get a dedicated node pool in
# modules/cluster-aws (only postgres/kafka/starrocks/qdrant/ollama do — confirmed
# against the Terraform node-pool map) — they land on the untainted "general" pool,
# same as api. Their resources below are unchanged from values.yaml's cloud-agnostic
# defaults; restated explicitly here (rather than left to silent inheritance) so this
# file is self-documenting and matches values-local.yaml's shape. Only authentik's
# bootstrapEmail actually differs from base, to match this environment's real host.
worker:
  replicas: 2
  resources:
    requests: { cpu: "2", memory: "4Gi", ephemeral-storage: "1Gi" }
    limits: { cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi" }
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70

prometheus:
  imageTag: "v2.55.1"
  storageSize: "20Gi"
  storageClassName: "iverson-prometheus"
  resources:
    requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "512Mi" }
    limits: { cpu: "500m", memory: "1Gi", ephemeral-storage: "1Gi" }
  nodeSelector: {}

redis:
  imageTag: "7.4-alpine"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }
  nodeSelector: {}

authentik:
  imageTag: "2026.5.3"
  resources:
    server:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
    worker:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { cpu: "500m", memory: "1Gi" }
  nodeSelector: {}
  bootstrapEmail: "admin@iverson.example.com"
  ingress:
    className: "alb"
    annotations:
      # Completed to match api.ingress/adminApiIngress/adminUi.ingress (scheme/
      # target-type/listen-ports/ssl-redirect). certificate-arn ALONE is not enough:
      # without listen-ports the AWS Load Balancer Controller defaults to
      # [{"HTTP":80}] and this Ingress answers over plain HTTP only. That matters
      # here specifically because adminUi.ingress below now DOES serve HTTPS, so the
      # console is an https:// page — and an https:// page may not make OIDC calls to
      # an http:// authority (the browser blocks them as mixed content and login never
      # completes). Authentik and the console must terminate the same scheme; keep
      # these four annotations and adminUi.oidcAuthority below in lockstep.
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERT_ARN>"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"

adminUi:
  # https, matching authentik.ingress above (which terminates TLS on the same ALB via
  # the same ACM certificate) and this profile's own https console origin. An http://
  # authority on an https:// page is blocked by the browser as mixed content, so this
  # scheme is not cosmetic — it is what makes login work at all.
  oidcAuthority: "https://authentik.iverson.example.com/application/o/iverson-api/"
  apiBaseUrl: "https://admin-api.iverson.example.com"
  ingress:
    className: "alb"
    annotations:
      # Completed to match api.ingress/adminApiIngress above (scheme/target-type/
      # listen-ports/ssl-redirect) — without them the AWS Load Balancer Controller
      # defaults to listen-ports [{"HTTP":80}] and serves this Ingress over plain
      # HTTP, so the browser's Origin header would be http://iverson.example.com,
      # not https://, and adminConsoleOrigin below (which this Ingress's own host
      # is the origin of) would never match the CORS grant on the API side.
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      # ALB terminates TLS using an ACM certificate referenced by ARN, not a
      # Kubernetes Secret — tlsSecretName stays empty (chart default) same as
      # api.ingress/authentik.ingress above. Replace <ACM_CERT_ARN> with a real
      # certificate provisioned for the real host before applying — without it
      # ALB will only serve HTTP.
      alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERT_ARN>"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"

jaeger:
  nodeSelector: {}
