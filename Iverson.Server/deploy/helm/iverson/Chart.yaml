apiVersion: v2
name: iverson
description: Iverson — cloud-agnostic Kubernetes deployment (Postgres, Kafka, StarRocks, Qdrant, Ollama, API, Jaeger, Prometheus, Authentik)
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: postgres
    version: "0.1.0"
    repository: "file://charts/postgres"
    condition: postgres.enabled
  - name: kafka
    version: "0.1.0"
    repository: "file://charts/kafka"
    condition: kafka.enabled
  - name: starrocks
    version: "0.1.0"
    repository: "file://charts/starrocks"
    condition: global.engagementEnabled
  - name: qdrant
    version: "0.1.0"
    repository: "file://charts/qdrant"
    condition: qdrant.enabled
  - name: ollama
    version: "0.1.0"
    repository: "file://charts/ollama"
    condition: ollama.enabled
  - name: api
    version: "0.1.0"
    repository: "file://charts/api"
    condition: api.enabled
  - name: worker
    version: "0.1.0"
    repository: "file://charts/worker"
    condition: worker.enabled
  - name: admin-ui
    alias: adminUi
    version: "0.1.0"
    repository: "file://charts/admin-ui"
    condition: adminUi.enabled
  - name: jaeger
    version: "0.1.0"
    repository: "file://charts/jaeger"
    condition: global.tracingEnabled
  - name: prometheus
    version: "0.1.0"
    repository: "file://charts/prometheus"
    condition: prometheus.enabled
  - name: redis
    version: "0.1.0"
    repository: "file://charts/redis"
    condition: redis.enabled
  - name: authentik
    version: "0.1.0"
    repository: "file://charts/authentik"
    condition: authentik.enabled
