server {
  listen 8443 ssl;
  ssl_certificate     /etc/iverson/tls/tls.crt;
  ssl_certificate_key /etc/iverson/tls/tls.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  location / {
    proxy_pass http://127.0.0.1:9000;
    # CSR round-12 §2.5: Authentik trusts only 127.0.0.2, and the address it records is this
    # connection's peer, not a header the client sent.
    proxy_bind 127.0.0.2;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
