kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # kindnet (the default CNI) does not enforce NetworkPolicy at all — every
  # NetworkPolicy this chart renders would silently be a no-op under it.
  # Disable it here so setup.sh/setup.ps1 can install Calico instead, which
  # does enforce NetworkPolicy, matching the network-policy engine each
  # cloud profile enables in the companion Terraform plan.
  disableDefaultCNI: true
nodes:
  - role: control-plane
    # CSR round 12 §3.6: pinned, inside Istio 1.31's supported 1.32–1.37 (kind's own default varies
    # with the kind version). Run with kind v0.33.0, which setup.sh and setup.ps1 require. kind reads
    # this when it creates the cluster: to change it, recreate the cluster.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    extraPortMappings:
      # Bound to loopback, so the dev cluster's ingress is reachable only from this machine
      # (the default publishes it on every host interface).
      # kind reads this when it creates the cluster, so an existing cluster keeps its old binding
      # until it is recreated.
      - containerPort: 80
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
